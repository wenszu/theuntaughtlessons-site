name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install administrative function dependencies
        working-directory: functions-admin
        run: npm ci --ignore-scripts --no-audit
      - name: Prepare one cache-safe release
        run: |
          node scripts/sync-cache-versions.js --version="${GITHUB_SHA::12}"
          node scripts/sync-cache-versions.js --check
      - name: Run repository tests
        run: |
          for test_file in tests/*.test.js; do
            node "$test_file"
          done
      - name: Stage the public site only
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a ./ "$RUNNER_TEMP/site/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '.firebase/' \
            --exclude 'functions/' \
            --exclude 'functions-aiko/' \
            --exclude 'functions-admin/' \
            --exclude 'node_modules/' \
            --exclude 'scripts/' \
            --exclude 'tests/' \
            --exclude 'visual/' \
            --exclude '.env*' \
            --exclude '*.log'
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
