name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  static-and-dependency-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-aiko/package-lock.json
            functions-admin/package-lock.json
      - name: Check committed files for GitHub tokens
        run: bash scripts/check-secrets.sh
      - name: Install administrative function dependencies
        working-directory: functions-admin
        run: npm ci --ignore-scripts --no-audit
      - name: Run repository tests
        run: |
          for test_file in tests/*.test.js; do
            node "$test_file"
          done
      - name: Validate Cloud Functions syntax
        run: |
          node --check functions/index.js
          node --check functions-aiko/index.js
          node --check functions-admin/index.js

  dependency-vulnerability-scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
    with:
      scan-args: |-
        --lockfile=functions/package-lock.json
        --lockfile=functions-aiko/package-lock.json
        --lockfile=functions-admin/package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write
