name: Verify deployment cache

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cache-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-deployment-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install administrative function dependencies
        working-directory: functions-admin
        run: npm ci --ignore-scripts --no-audit
      - name: Verify cache-busting consistency
        run: node scripts/sync-cache-versions.js --check
      - name: Run repository tests
        run: |
          for test_file in tests/*.test.js; do
            node "$test_file"
          done
