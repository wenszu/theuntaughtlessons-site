name: Verify deployment cache

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-deployment-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify cache-busting consistency
        run: node scripts/sync-cache-versions.js --check
      - name: Verify deployment cache contracts
        run: node tests/deployment-cache.test.js
