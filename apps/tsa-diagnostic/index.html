  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap');
    :root{--navy:#003366;--gold:#EEA320;--cream:#F3EDE2;--white:#fff;--ink:#333;--steel:#4D7094;--line:#C7D8E8;--green:#2C7A4B;--soft:#FAF8F3}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Lato,Arial,sans-serif}button,textarea{font:inherit}
    .header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
    .header-in{width:min(1100px,100%);min-height:74px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}.logo{width:165px}.logo img{display:block;width:100%}.divider{width:1px;height:40px;background:#ffffff66}.head-copy{min-width:0}.head-copy small{color:var(--gold)}.head-copy strong{display:block;font:700 25px Playfair Display,serif}.exit{margin-left:auto;color:#fff;text-decoration:none;font-weight:700}
    .progress{background:#fff;border-bottom:1px solid var(--line)}.progress-in{width:min(1100px,100%);margin:auto;padding:10px 22px;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}.progress-copy{color:var(--navy);font-weight:700}.saved{color:var(--steel);font-size:13px}.track{grid-column:1/-1;height:5px;background:#D9E1E8;border-radius:9px;overflow:hidden}.track span{display:block;height:100%;background:var(--gold);transition:width .25s}
    main{width:100%;max-width:1000px;margin:auto;padding:34px 22px 80px}.panel{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:clamp(22px,4vw,42px)}h1,h2,h3{max-width:100%;overflow-wrap:break-word;color:var(--navy);font-family:Playfair Display,serif;margin-top:0}.eyebrow{color:#A26700;font-weight:700;margin:0 0 8px}.lede{font-size:18px;line-height:1.55;max-width:760px}.brief{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;line-height:1.55;margin:20px 0}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.step{min-width:0;padding:14px;border-top:3px solid var(--line);background:var(--soft);color:var(--navy)}.step b{display:block;margin-bottom:4px}.step .substep{display:block}
    .button{border:1px solid var(--gold);border-radius:7px;background:var(--gold);color:var(--navy);min-height:48px;padding:12px 20px;font-weight:700;cursor:pointer}.button.secondary{background:#fff;border-color:var(--navy)}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.notice{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:13px 15px;margin:16px 0;line-height:1.5}.error{color:#8B2E25}.hidden{display:none!important}
    .sort-workspace{display:grid;grid-template-columns:minmax(210px,.72fr) minmax(0,2fr);gap:14px;align-items:stretch;margin-top:18px}.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bucket{min-height:260px;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--soft)}.bucket h3{font:700 16px Lato,sans-serif}.bucket.is-target{border-color:var(--gold);background:#FFF8EC}.place{width:100%;min-height:44px;margin:2px 0 10px;border:1px dashed var(--gold);border-radius:6px;background:#FFF8EC;color:var(--navy);font-weight:700;cursor:pointer}.cards{display:grid;gap:8px}.card{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:7px;padding:12px;text-align:left;cursor:pointer}.card.selected{outline:3px solid #EEA32066;border-color:var(--gold)}.pool{margin:18px 0;padding:14px;border:1px dashed var(--steel);border-radius:9px}.sort-workspace>.pool{margin:0;background:#F8FBFC}.pool h3{font:700 16px Lato,sans-serif}.label-select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:#fff}.spot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;cursor:pointer}.check-card input{width:20px;height:20px;flex:0 0 auto}.instruction-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.instruction-step{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:12px;line-height:1.45}.instruction-step strong{display:block;color:var(--navy);margin-bottom:3px}.move-grid{display:grid;grid-template-columns:minmax(190px,.85fr) repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
    .scenario{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:16px 18px;margin:18px 0;line-height:1.55}.scenario>strong{display:block;color:var(--navy);margin-bottom:8px}.scenario ul{margin-bottom:0;padding-left:20px}.scenario li+li{margin-top:8px}.task{margin:18px 0 8px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#EEF3F7;line-height:1.5}.task strong{display:block;color:var(--navy);margin-bottom:4px}.mode-label{display:block;color:var(--navy);margin:18px 0 7px}.mode{display:inline-flex;gap:0;margin:0 0 18px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:3px}.mode button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--steel);padding:9px 14px;font-weight:700;cursor:pointer}.mode button.active{border-bottom-color:var(--navy);color:var(--navy);background:#EEF3F7}.recorder{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;margin:18px 0}.record-button{width:140px;height:140px;border-radius:50%;border:8px solid #D9E1E8;background:var(--navy);color:#fff;cursor:pointer;font-weight:700;padding:15px}.record-button strong{display:block;font:700 30px Playfair Display,serif;margin-bottom:4px}.record-button.recording{background:#8B2E25}.record-help{line-height:1.55}.transcript{width:100%;min-height:170px;border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.5;resize:vertical}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.metric{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--steel);font-size:14px}
    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid var(--line);background:#fff;border-radius:8px;padding:16px;text-align:left;color:var(--navy);font-weight:700;cursor:pointer}.choice.selected{border-color:var(--gold);background:#FFF8EC}.pushback{border:1px solid var(--line);background:#EEF3F7;border-radius:8px;padding:16px;margin:16px 0}.loading{display:flex;align-items:center;gap:10px;color:var(--steel)}.spinner{width:20px;height:20px;border:3px solid #D9E1E8;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .score-hero{text-align:center;border-bottom:1px solid var(--line);padding-bottom:24px}.score-number{font:700 clamp(62px,12vw,100px) Playfair Display,serif;color:var(--navy)}.score-number span{font:700 24px Lato,sans-serif;color:var(--steel)}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.score-card{border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:8px;padding:18px}.score-card strong{display:block;color:var(--navy);font-size:25px;margin-top:5px}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feedback{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;line-height:1.5}.ai-label{font-size:13px;color:var(--steel)}.sync-status{display:flex;align-items:center;gap:8px;margin-top:18px;padding:11px 13px;border:1px solid var(--line);border-radius:7px;color:var(--steel);background:var(--soft);font-size:14px}.sync-status[data-state="saved"]{color:var(--green);border-color:#BBD8C6}.sync-status[data-state="pending"]::before{content:'';width:13px;height:13px;border:2px solid #D9E1E8;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}.sync-status[data-state="failed"]{color:#8A5A00;border-color:#E5D4B4;background:#FFF8EC}
    @media(max-width:760px){.header-in{padding:10px 14px;gap:10px}.logo{width:100px}.divider{height:34px}.head-copy strong{font-size:19px}.exit{font-size:0}.exit::after{content:'Exit';font-size:13px}.saved{display:none}.progress-in{grid-template-columns:1fr}.steps,.sort-workspace,.spot-list,.move-grid,.choice-grid,.score-grid,.feedback-grid,.instruction-steps{grid-template-columns:1fr}.buckets{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.bucket{flex:0 0 min(82vw,280px);min-height:210px;scroll-snap-align:start}.recorder{grid-template-columns:1fr;text-align:center}.record-button{margin:auto}.panel{padding:20px}.progress-in{padding:9px 14px}main{padding:20px 12px 60px}}
    .place,.card,.label-select{font-family:Lato,Arial,sans-serif;font-size:14px}.place,.card{font-weight:700}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px;color:var(--steel);font-size:14px}.quiz-track{height:6px;border-radius:999px;background:#D9E1E8;overflow:hidden}.quiz-track span{display:block;height:100%;background:var(--gold)}.quiz-question{margin:22px 0 16px;font:700 clamp(23px,3vw,32px) Playfair Display,serif;color:var(--navy);line-height:1.2}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quiz-option{display:flex;align-items:flex-start;gap:10px;min-height:68px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:14px;text-align:left;color:var(--navy);font:700 15px Lato,Arial,sans-serif;cursor:pointer}.quiz-option.selected{border-color:var(--gold);background:#FFF8EC;box-shadow:0 0 0 3px #EEA32026}.quiz-letter{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--steel)}@media(max-width:600px){.quiz-options{grid-template-columns:1fr}.quiz-option{min-height:58px}}
    .challenge-parts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0 22px}.challenge-part{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--soft);color:var(--steel);font-size:14px;font-weight:700}.challenge-part+.challenge-part{border-left:1px solid var(--line)}.challenge-part.current{background:#fff;color:var(--navy);box-shadow:inset 0 -3px var(--gold)}.challenge-part.complete{color:var(--green)}.part-number{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px}.challenge-part.current .part-number{background:#FFF2D3;border-color:var(--gold)}.part-next{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px}.part-next strong{display:block;color:var(--navy);margin-bottom:3px}.part-next p{margin:0;color:var(--steel);font-size:14px}.part-next .button{flex:0 0 auto}.quiz-selection-status{min-height:20px;margin:10px 0 0;color:var(--green);font-size:13px;font-weight:700}@media(max-width:600px){.challenge-parts{grid-template-columns:1fr}.challenge-part+.challenge-part{border-left:0;border-top:1px solid var(--line)}.part-next{display:block}.part-next .button{width:100%;margin-top:12px}}
  </style>

  <header class="header"><div class="header-in"><a class="logo" href="../../member-login/index.html#learning-journey"><img src="../../assets/utl-logo-nav-white.png" alt="The Untaught Lessons"></a><span class="divider"></span><div class="head-copy"><small>Find your level</small><strong>The diagnostic</strong></div><a class="exit" href="../../member-login/index.html#learning-journey">Save and exit</a></div></header>
  <div class="progress"><div class="progress-in"><span class="progress-copy" id="progressCopy">Ready to begin</span><span class="saved" id="savedCopy">Progress saves automatically</span><div class="track"><span id="progressBar" style="width:0"></span></div></div></div>
  <main id="app" aria-live="polite"></main>
  <script src="../../assets/reward-events.js"></script>
  <script>
  (()=>{
    const app=document.getElementById('app');
    const FORMS={
      A:{organize:{title:'Plan a group day out',prompt:'Sort the nine details into three useful groups. First choose a clear label for each group, then place every detail.',labels:['Book now','Decide together','Figure out later','Fun ideas','Important things','Other'],correctLabels:['Book now','Decide together','Figure out later'],items:[['Reserve the train tickets',0],['Confirm the museum time slot',0],['Book a table for lunch',0],['Choose between the museum and aquarium',1],['Agree on the lunch budget',1],['Pick a meeting point',1],['Check the weather forecast',2],['Share emergency contact details',2],['Make a playlist for the journey',2]]},spot:{title:'Make a study plan complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Time','Environment','Support'],items:[['Study at the same time each evening','time-a'],['Keep a regular study schedule','time-a'],['Use short focused sessions','time-b'],['Put the phone in another room','env-a'],['Study somewhere quiet','env-b'],['Ask a friend to quiz you','support-a'],['Get help when a topic stays unclear','support-b'],['Review difficult topics with someone','support-b']],missing:[['Plan breaks before you start',0],['Set a finish time for each study block',0],['Clear the desk before studying',1],['Keep the books you need within reach',1],['Choose whom to ask before you get stuck',2],['Buy new stationery',-1]]},speak:{title:'Choose a location for a community event',facts:[['Library option','Free and easy to reach, but it holds only 45 people.'],['Park option','Holds 100 people and costs nothing, but rain is forecast.'],['Community hall option','Holds 80 people, costs $120, and is indoors.'],['Expected attendance','Around 65 people.']],keywords:[['community hall','hall'],['65','capacity','people'],['rain','indoors','weather']],next:['book','reserve','confirm','check']},act:{title:'A group member has not finished their part',setup:'A shared project is due tomorrow. One person has not completed their section and says they need another two days.',choices:['Redistribute the unfinished work across the group tonight','Request a one-day extension and keep the full scope','Reduce their section and agree on a firm handoff time today'],best:2,pushback:'They reply: “I am already overwhelmed. Why can’t everyone just wait?”',terms:['deadline','tomorrow','handoff','section'],concerns:['overwhelmed','workload','capacity','wait'],next:['send','share','finish','time','today'] }},
      B:{organize:{title:'Prepare for an exam week',prompt:'Sort the nine details into three useful groups. First choose a clear label for each group, then place every detail.',labels:['Do this week','Night before','Skip','School tasks','Helpful ideas','Other'],correctLabels:['Do this week','Night before','Skip'],items:[['Make a one-page topic checklist',0],['Practice two difficult question types',0],['Ask about one unclear topic',0],['Pack pens and identification',1],['Set two alarms',1],['Choose comfortable clothes',1],['Rewrite every page of notes',2],['Learn a brand-new topic at midnight',2],['Compare study hours with friends',2]]},spot:{title:'Make a healthy routine complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Sleep','Movement','Food'],items:[['Go to bed at a regular time','sleep-a'],['Keep the same bedtime most nights','sleep-a'],['Put screens away before bed','sleep-b'],['Walk for twenty minutes','move-a'],['Choose stairs for short trips','move-b'],['Plan simple meals ahead','food-a'],['Keep water nearby','food-b'],['Carry a bottle during the day','food-b']],missing:[['Make the bedroom dark and quiet',0],['Follow the same short bedtime routine',0],['Stretch after sitting for a long time',1],['Choose a form of movement you enjoy',1],['Pack a simple healthy snack',2],['Buy an expensive fitness watch',-1]]},speak:{title:'Set a phone rule for a study group',facts:[['Current interruption rate','Notifications interrupt the group about every seven minutes.'],['Reference needs','Some members need phones to check reference material.'],['Previous full ban','Two members left early the last time phones were completely banned.'],['Session length','The group meets for one focused hour.']],keywords:[['silent','notifications','airplane'],['reference','check','break'],['hour','focus','focused']],next:['agree','try','review','set']},act:{title:'An event now costs more than agreed',setup:'Your group planned a small event with a fixed budget. The venue raises its price by 30% one week before the date.',choices:['Keep the venue and reduce food and decoration costs','Compare a cheaper venue and a smaller version, then ask the group to choose today','Ask attendees to cover the increase before changing the plan'],best:1,pushback:'A friend says: “Changing the plan will make us look disorganized. Just pay the extra cost.”',terms:['budget','cost','venue','30'],concerns:['disorganized','reputation','appearance','change'],next:['compare','choose','today','ask'] }},
      C:{organize:{title:'Move into a new home',prompt:'Sort the nine details into three useful groups. First choose a clear label for each group, then place every detail.',labels:['Before moving','First day','Later','Rooms','Important jobs','Other'],correctLabels:['Before moving','First day','Later'],items:[['Confirm the moving time',0],['Pack a first-night bag',0],['Label the main boxes',0],['Check water and electricity',1],['Set up a place to sleep',1],['Find the nearest grocery store',1],['Choose wall decorations',2],['Organize old photographs',2],['Buy matching storage boxes',2]]},spot:{title:'Make a club project complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Purpose','People','Delivery'],items:[['Write one clear project goal','purpose-a'],['State what success should look like','purpose-a'],['Choose the main audience','purpose-b'],['Give each person one owner role','people-a'],['Match tasks to people’s strengths','people-b'],['Set a final due date','delivery-a'],['Check progress every week','delivery-b'],['Hold a weekly progress review','delivery-b']],missing:[['List what the project will not include',0],['Choose evidence that will show the goal was met',0],['Name a backup owner for key work',1],['Agree who makes the final call',1],['Set one midpoint milestone',2],['Design a new club logo',-1]]},speak:{title:'Use a small community fund',facts:[['Available fund','$500.'],['Reading corner','Would serve about 40 children and cost $450.'],['Sports equipment','Would serve about 25 children and cost $300.'],['One-day celebration','Would serve 80 people and cost $500.']],keywords:[['reading','sports','celebration'],['cost','500','450','300'],['children','serve','lasting']],next:['buy','confirm','choose','ask']},act:{title:'Bad weather threatens an outdoor activity',setup:'An outdoor activity for 50 people is tomorrow. Heavy rain is now likely, and the indoor backup space fits only 30.',choices:['Move 30 people indoors, offer a later session, and tell everyone today','Move the entire activity to a later date','Keep the outdoor time but add rain cover and an indoor safety plan'],best:0,pushback:'Someone says: “Splitting the group is inconvenient. We should take the chance and stay outside.”',terms:['rain','indoor','30','50'],concerns:['inconvenient','split','disruption','weather'],next:['tell','move','session','today'] }}
    };
    const SPOT_QUESTION_BANK=[
  {id:'f1-01',format:1,prompt:'A hardware store sorts its returns into "Wrong item shipped", "Returns filed after 30 days", "Damaged in transit" and "Customer changed their mind". Which one would you change?',options:['Returns filed after 30 days','Damaged in transit','Customer changed their mind','Wrong item shipped'],answer:0,rationale:'Three of these say why a return happened. "Returns filed after 30 days" says when it was filed, so the set is sorting on two principles at once. A wrong item returned on day 40 belongs in two places, which is exactly the problem a single grouping principle prevents.'},
  {id:'f1-02',format:1,prompt:'A dental practice books appointments under "Cleanings", "Patient treatment", "Fillings" and "Extractions". Which one would you change?',options:['Extractions','Patient treatment','Cleanings','Fillings'],answer:1,rationale:'Cleanings, fillings and extractions are all patient treatment, so that heading sits one level above the other three rather than beside them. Every appointment would qualify for it, which makes it useless as a sorting choice.'},
  {id:'f1-03',format:1,prompt:'A bakery records daily waste under "Burned in the oven", "Unsold at close", "Damaged in handling" and "Trays dropped on the way to the display case". Which one would you change?',options:['Burned in the oven','Unsold at close','Trays dropped on the way to the display case','Damaged in handling'],answer:2,rationale:'A dropped tray is one way stock gets damaged in handling, so it belongs inside that category rather than beside it. Burning, going unsold and being damaged are three separate ways a bakery loses stock, each with one home.'},
  {id:'f1-04',format:1,prompt:'A city housing office logs tenant complaints under "Heating and hot water", "Repeat complaints", "Pest infestation" and "Structural repairs". Which one would you change?',options:['Heating and hot water','Pest infestation','Structural repairs','Repeat complaints'],answer:3,rationale:'The other three name what the complaint is about. "Repeat complaints" names how often it has been raised, which can apply to any subject. A third call about a broken boiler has two homes, so the axis is mixed.'},
  {id:'f1-05',format:1,prompt:'A community college lists its student services as "Tutoring", "Writing centre", "Academic support" and "Mental health counselling". Which one would you change?',options:['Academic support','Writing centre','Tutoring','Mental health counselling'],answer:0,rationale:'Tutoring and the writing centre are both forms of academic support, so that heading swallows two of its own siblings. Counselling stays outside it, which is why the set looks workable at a glance and still is not.'},
  {id:'f1-06',format:1,prompt:'A delivery firm codes failed drop-offs as "Nobody available to sign", "Driver could not locate the address", "Refused by the recipient" and "Incorrect address on the label". Which one would you change?',options:['Nobody available to sign','Incorrect address on the label','Refused by the recipient','Driver could not locate the address'],answer:1,rationale:'An incorrect label is one reason a driver cannot locate an address, so it belongs inside that category rather than next to it. The other three are separate points of failure at the same level.'},
  {id:'f1-07',format:1,prompt:'A gym logs equipment problems under "Cardio machines", "Free weights", "Member-reported faults" and "Resistance machines". Which one would you change?',options:['Resistance machines','Free weights','Member-reported faults','Cardio machines'],answer:2,rationale:'Three categories name which equipment failed. The fourth names who noticed, and a member can report a fault on any of the three. Reporting source is a second axis and needs its own field, not a slot in this list.'},
  {id:'f1-08',format:1,prompt:'A car rental branch logs vehicle issues under "Engine faults", "Tyre and brake wear", "Interior damage" and "Reported at weekends". Which one would you change?',options:['Engine faults','Tyre and brake wear','Interior damage','Reported at weekends'],answer:3,rationale:'The first three name a type of fault. The last names a time, so a worn brake found on a Saturday fits two categories at once.'},
  {id:'f1-09',format:1,prompt:'A hospital ward codes medication errors as "Wrong dose given", "Patient harmed", "Wrong patient" and "Wrong timing". Which one would you change?',options:['Patient harmed','Wrong patient','Wrong timing','Wrong dose given'],answer:0,rationale:'Dose, patient and timing describe what went wrong. Harm describes what followed, and it can follow any of the three. Mixing the error with its consequence hides how often each error type actually occurs.'},
  {id:'f1-10',format:1,prompt:'A software team labels its backlog "Login and authentication", "Payments", "Performance" and "Reporting". Which one would you change?',options:['Reporting','Performance','Payments','Login and authentication'],answer:1,rationale:'Three of these name a part of the product. Performance names a quality that every part can fail on, so a slow payment page belongs in two labels. It cuts across the set instead of taking a place in it.'},
  {id:'f1-11',format:1,prompt:'A university residence logs maintenance under "Plumbing", "Water leaks", "Electrical" and "Heating". Which one would you change?',options:['Heating','Plumbing','Water leaks','Electrical'],answer:2,rationale:'A water leak is a plumbing job, so the category sits inside one of its neighbours. Electrical and heating are genuinely separate trades.'},
  {id:'f1-12',format:1,prompt:'A charity reports its spending as "Programme delivery", "Fundraising", "Restricted funds" and "Administration". Which one would you change?',options:['Programme delivery','Administration','Fundraising','Restricted funds'],answer:3,rationale:'Three categories say what the money was spent on. Restricted funds says where the money came from and what conditions apply to it. Restricted money is still spent on programmes, fundraising or administration, so it doubles the count rather than adding a fourth slice.'},
  {id:'f1-13',format:1,prompt:'A call centre tags each call as "New order", "Angry caller", "Order status check" or "Complaint". Which one would you change?',options:['Angry caller','Order status check','Complaint','New order'],answer:0,rationale:'Three tags say what the caller wanted. "Angry caller" says how they sounded, and an angry caller is usually also placing a complaint or chasing an order. Tone belongs on a separate field.'},
  {id:'f1-14',format:1,prompt:'A recruitment team tracks where candidates drop out: "Application", "Phone screen", "Lost to a competitor" and "Onsite interview". Which one would you change?',options:['Application','Lost to a competitor','Onsite interview','Phone screen'],answer:1,rationale:'Three categories name a stage in the process. Losing a candidate to a competitor is a reason for the drop-out, and it happens at one of those three stages. The set answers where and why in the same column, so neither question gets a clean answer.'},
  {id:'f1-15',format:1,prompt:'A restaurant groups its costs as "Ingredients", "Costs that rose this quarter", "Staff wages" and "Rent and utilities". Which one would you change?',options:['Rent and utilities','Ingredients','Costs that rose this quarter','Staff wages'],answer:2,rationale:'Three categories name a kind of cost. The other names a direction of travel, which can apply to any of them. A wage bill that went up appears twice and the total stops adding up.'},
  {id:'f2-01',format:2,prompt:'A bike shop groups its repair jobs into "Brakes", "Gears and shifting" and "Wheels and tyres". Which would you add next?',options:['Puncture repairs','Frame and fork damage','Adjusting brake cable tension','Jobs booked in for same-day service'],answer:1,rationale:'Frame and fork work is a fourth part of the bike, so it takes its own place. A puncture is a wheels and tyres job and cable tension is a brakes job, so both sit one level down. Same-day service is a booking type, not a repair type.'},
  {id:'f2-02',format:2,prompt:'A council groups noise complaints into "Construction sites", "Late-night venues" and "Domestic disputes". Which would you add next?',options:['Neighbours arguing after midnight','Complaints received more than once','Vehicle and traffic noise','Drilling before 7am'],answer:2,rationale:'Traffic noise has a different source from building work, venues or households, so it earns a fourth category. Arguing neighbours are a domestic dispute and early drilling is a construction site, so both are examples rather than categories. Repeat complaints sort on frequency, which is a different question.'},
  {id:'f2-03',format:2,prompt:'A publisher groups manuscript rejections into "Weak writing", "Wrong fit for our list" and "Market already saturated". Which would you add next?',options:['Too many similar titles already selling','Prose that needs heavy editing','A genre we do not publish','Submitted without the material we asked for'],answer:3,rationale:'An incomplete submission is a process failure, and it can be rejected before anyone judges the writing, the fit or the market. Heavy editing restates weak writing, an unpublished genre restates wrong fit, and similar titles restates saturation.'},
  {id:'f2-04',format:2,prompt:'A clinic groups missed outpatient appointments into "Transport problems", "Never received the reminder" and "Symptoms improved so they stayed home". Which would you add next?',options:['Could not get time off work','Patients who miss more than one appointment','The bus route was cancelled','The reminder text went to an old number'],answer:0,rationale:'Work commitments are a separate barrier from travel, communication or how the patient felt. A cancelled bus route is a transport problem and a wrong phone number is why the reminder was never received, so both are causes inside an existing category. Repeat non-attenders are a patient group, not a reason.'},
  {id:'f2-05',format:2,prompt:'A pet shop groups its stock into "Food", "Toys" and "Bedding". Which would you add next?',options:['Items currently on sale','Grooming and health products','Dry kibble','Chew ropes'],answer:1,rationale:'Grooming and health products are a fourth kind of product. Kibble is food and chew ropes are toys, so both sit inside existing categories. Sale items are a price status that any product can carry.'},
  {id:'f2-06',format:2,prompt:'An accounting firm groups client questions into "Tax filing deadlines", "Allowable expenses" and "Payroll setup". Which would you add next?',options:['Whether a laptop can be claimed','Questions from clients in their first year','Choosing a company structure','When the quarterly return is due'],answer:2,rationale:'Company structure is a separate advisory question from deadlines, expenses or payroll. A laptop claim is an allowable expenses question and a quarterly return date is a deadline question. First-year clients are a client segment, which sorts people rather than questions.'},
  {id:'f2-07',format:2,prompt:'A theatre groups front-of-house incidents into "Ticketing errors", "Accessibility problems" and "Latecomer seating". Which would you add next?',options:['A seat sold twice','A patron arriving after curtain up','The lift being out of service','Bar and refreshment complaints'],answer:3,rationale:'The bar is a fourth front-of-house function with its own failures. A double-sold seat is a ticketing error, a patron arriving late is latecomer seating, and a broken lift is an accessibility problem.'},
  {id:'f2-08',format:2,prompt:'A software company groups the reasons customers cancel into "Price", "Missing features" and "Poor support experience". Which would you add next?',options:['The team stopped logging in','An integration we do not offer','A competitor undercut our pricing','Slow replies to support tickets'],answer:0,rationale:'A team that stops logging in has an adoption problem, and it can happen while the price, the features and the support are all fine. Undercutting is a price reason, slow replies are a support reason, and a missing integration is a missing feature.'},
  {id:'f2-09',format:2,prompt:'A school groups parent complaints into "Homework load", "Bullying" and "Communication from staff". Which would you add next?',options:['Too many assignments set over the holidays','School meal quality','Newsletters arriving after the event','Complaints sent by email'],answer:1,rationale:'Meal quality is a fourth subject with no home in the current three. Late newsletters are a communication failure and holiday assignments are homework load. Email sorts complaints by channel, which is a separate axis.'},
  {id:'f2-10',format:2,prompt:'A manufacturer groups line stoppages into "Machine faults", "Material shortages" and "Operator absence". Which would you add next?',options:['Components arriving after the scheduled slot','A conveyor motor seizing','A quality hold placed on finished units','Stoppages lasting more than one hour'],answer:2,rationale:'A quality hold stops the line by decision rather than by breakdown, shortage or absence, so it is a genuine fourth cause. A seized motor is a machine fault and late components are a material shortage. Duration sorts stoppages by length, not by cause.'},
  {id:'f2-11',format:2,prompt:'A gym groups membership cancellations into "Cost", "Location and travel time" and "Not seeing enough progress". Which would you add next?',options:['Members who cancelled in January','Moved to a different city','Found the monthly fee too high','Injury or a change in health'],answer:3,rationale:'Injury is a fourth reason that has nothing to do with money, distance or results. Moving city is a location reason and a fee that feels too high is a cost reason. January cancellations sort by timing.'},
  {id:'f2-12',format:2,prompt:'A charity groups the reasons volunteers stop coming into "Time commitment", "Travel cost" and "Unclear tasks". Which would you add next?',options:['Not feeling their work mattered','Being given jobs with no instructions','Petrol and fares adding up','Shifts clashing with paid work'],answer:0,rationale:'Feeling unappreciated is a recognition problem, separate from hours, money or instructions. A shift clash is a time commitment issue, jobs without instructions restate unclear tasks, and petrol restates travel cost.'},
  {id:'f2-13',format:2,prompt:'A hotel groups housekeeping issues into "Room not cleaned on time", "Missing amenities" and "Damaged linens". Which would you add next?',options:['No shampoo left in the bathroom','Maintenance faults found in the room','A room cleaned after the guest arrived','Torn towels put back into service'],answer:1,rationale:'A maintenance fault is a different department and a different kind of problem. Cleaning after arrival restates the timing category, missing shampoo restates amenities, and torn towels restate damaged linens.'},
  {id:'f2-14',format:2,prompt:'A bank groups its fraud alerts into "Card used abroad", "Unusually large purchase" and "Several attempts in quick succession". Which would you add next?',options:['A purchase far above the usual amount','A payment made in another country','A first purchase in a merchant type never used before','Three declines within two minutes'],answer:2,rationale:'A new merchant type is a fourth signal that is not about place, size or speed. A payment abroad restates the first category, a purchase above the usual amount restates the second, and three declines in two minutes restates the third.'},
  {id:'f2-15',format:2,prompt:'A farm shop groups supplier problems into "Late deliveries", "Short quantities" and "Produce quality below standard". Which would you add next?',options:['Bruised or wilting stock','Crates two units short of the order','Boxes arriving a day after the agreed slot','Invoicing and pricing errors'],answer:3,rationale:'Invoicing is a commercial failure rather than a delivery, quantity or quality failure, so it needs its own category. The other three restate the categories already in the list.'},
  {id:'f3-01',format:3,prompt:'A restaurant owner wants to work out why profit fell last quarter. Which headings would you use?',options:['Weekday trade · Weekend trade · Supplier problems','Revenue · Costs · Profitability','Fewer customers · Lower spend per customer · Higher costs','Food costs · Staff costs · Rising prices'],answer:2,rationale:'Fewer customers, lower spend and higher costs are the three independent ways profit falls, and together they account for all of it. "Rising prices" already covers food and staff costs. Profitability is the thing being explained, so it cannot sit beside its own drivers. Splitting weekday from weekend trade sorts by day while supplier problems sorts by cause, so that set mixes two principles.'},
  {id:'f3-02',format:3,prompt:'A school is organising the work for its annual trip. Which headings would you use?',options:['Travel · Buses and trains · Activities on the day','Tasks to do first · Money and permissions · Activities on the day','Travel · Money · Trip planning','Travel and accommodation · Money and permissions · Activities on the day'],answer:3,rationale:'Travel and accommodation, money and permissions, and activities on the day are three workstreams that do not overlap. "Trip planning" contains the other two. Buses and trains sit inside travel. "Tasks to do first" sorts by timing while its neighbours sort by subject.'},
  {id:'f3-03',format:3,prompt:'A hospital wants to reduce how long patients wait in the emergency department. Which headings would you use?',options:['Staffing levels · Bed availability · Test turnaround','Busy periods · Staffing levels · Long waits','Staffing levels · Nursing shortages · Bed availability','Arrival volume · Time to be seen · Time to be discharged'],answer:0,rationale:'Staff, beds and test results are three separate constraints, and a delay traces back to one of them. Time to be seen and time to be discharged measure the wait rather than explaining it. Nursing shortages sit inside staffing levels. "Long waits" is the problem being solved, so it cannot also be a cause of itself.'},
  {id:'f3-04',format:3,prompt:'A charity shop wants to raise more money from the same floor space. Which headings would you use?',options:['Stock quality · Pricing · Sales performance','Stock quality · Pricing · Shopper footfall','Weekday sales · Weekend sales · Pricing','Donations received · Items priced · Money raised'],answer:1,rationale:'Stock, price and footfall are three things the shop can change, and each moves takings on its own. Donations, pricing and money raised are a sequence ending in the result. Sales performance is the result. Weekday and weekend sales sort by day while pricing sorts by lever.'},
  {id:'f3-05',format:3,prompt:'A software team keeps missing release dates and wants to find out why. Which headings would you use?',options:['Estimation accuracy · Optimistic estimates · Scope changes','Missed deadlines · Scope changes · Team capacity','Estimation accuracy · Scope changes · Testing and rework','Planning problems · Scope changes · Testing and rework'],answer:2,rationale:'Bad estimates, growing scope and unplanned rework are three distinct ways a date slips. Optimistic estimates are one form of estimation error, so listing both records the same cause twice. "Planning problems" contains both estimation and scope. "Missed deadlines" is the symptom.'},
  {id:'f3-06',format:3,prompt:'A council wants to understand why its recycling rate has stopped improving. Which headings would you use?',options:['What residents throw away · Kerbside collection · Public awareness','Low rates in flats · Contamination in bins · Collection coverage','Household participation · Households that never recycle · Collection coverage','Household participation · Contamination in bins · Collection coverage'],answer:3,rationale:'Participation, contamination and coverage are three independent points where recycling fails. Households that never recycle are a subset of participation. What residents throw away overlaps with public awareness of what to throw away. Low rates in flats sorts by housing type while its neighbours sort by cause.'},
  {id:'f3-07',format:3,prompt:'A gym wants to know why new members stop coming after about six weeks. Which headings would you use?',options:['Motivation · Convenience · Cost','Member experience · Convenience · Cost','Attendance drop-off · Convenience · Cost','Motivation · Losing interest · Cost'],answer:0,rationale:'Motivation, convenience and cost are three separate reasons a habit fails to form. Losing interest is what falling motivation looks like, so listing both says the same thing twice. Member experience is broad enough to include convenience. Attendance drop-off is the behaviour being explained.'},
  {id:'f3-08',format:3,prompt:'A bookshop is deciding whether to open a second branch. Which headings would you use?',options:['Rent in the new area · Set-up and running costs · Staffing capacity','Expected demand · Set-up and running costs · Staffing capacity','Expected demand · Set-up and running costs · Business case','Location · Costs · Risks'],answer:1,rationale:'Demand, cost and the ability to staff it are the three questions that decide the answer. Risk cuts across location and cost rather than sitting beside them. "Business case" is the whole decision, not a part of it. Rent is one of the running costs.'},
  {id:'f3-09',format:3,prompt:'A manufacturer wants to cut the number of products customers send back. Which headings would you use?',options:['Design faults · Manufacturing defects · Returns volume','Product problems · Manufacturing defects · Damage in transit','Design faults · Manufacturing defects · Damage in transit','Design faults · Customer complaints · Damage in transit'],answer:2,rationale:'A returned product failed at design, at production or on the way to the customer, and those three stages do not overlap. "Product problems" contains both design and manufacturing. Returns volume is the number being reduced. Customer complaints are how a fault is reported, not where it came from.'},
  {id:'f3-10',format:3,prompt:'A university wants to understand why fewer students are applying. Which headings would you use?',options:['Course appeal · Cost and funding · Application numbers','Recruitment performance · Cost and funding · Awareness of the university','Applications from overseas · Cost and funding · Awareness of the university','Course appeal · Cost and funding · Awareness of the university'],answer:3,rationale:'A student has to know about the university, want the course and be able to afford it, so those three cover the funnel. Application numbers are the figure being explained. Recruitment performance contains awareness. Overseas applications are a segment, not a cause.'},
  {id:'f3-11',format:3,prompt:'A café owner wants to reduce the food thrown away at closing time. Which headings would you use?',options:['Baking quantities · Storage and shelf life · Demand forecasting','Morning waste · Afternoon waste · Storage and shelf life','Baking quantities · Storage and shelf life · Kitchen problems','How much is made · How much is sold · How much is wasted'],answer:0,rationale:'How much is baked, how long it keeps and how well demand is predicted are three levers the owner controls. Made, sold and wasted ends with the waste it is meant to explain. "Kitchen problems" is broad enough to include the other two. Splitting morning waste from afternoon waste sorts by time of day while storage and shelf life sorts by cause.'},
  {id:'f3-12',format:3,prompt:'A bus operator has to explain to its board why fares keep rising. Which headings would you use?',options:['Fare increases · Staff costs · Passenger numbers','Fuel costs · Staff costs · Passenger numbers','Fuel costs · Diesel prices · Passenger numbers','Fuel costs · Staff costs · Rising expenses'],answer:1,rationale:'A fare covers cost divided by passengers, so two cost drivers and the number of riders explain the rise. "Rising expenses" already contains fuel and staff. Diesel prices are what fuel costs are made of. Fare increases are the thing being explained.'},
  {id:'f3-13',format:3,prompt:'A veterinary practice wants to know why clients are moving to a rival practice. Which headings would you use?',options:['Client satisfaction · Appointment availability · Quality of care','Clients who left this year · Price · Appointment availability','Price · Appointment availability · Quality of care','Price · Cost of treatment · Appointment availability'],answer:2,rationale:'What it costs, whether you can get seen and how good the treatment is cover the reasons a client switches. Price and cost of treatment are the same reason written twice. Client satisfaction is a summary of the other two headings. Clients who left this year puts a group of people beside two reasons.'},
  {id:'f3-14',format:3,prompt:'A city wants to reduce the number of cyclists injured on its roads. Which headings would you use?',options:['Injury numbers · Road design · Driver behaviour','Injuries at junctions · Driver behaviour · Cyclist behaviour','Road design · Junction layouts · Driver behaviour','Road design · Driver behaviour · Cyclist behaviour'],answer:3,rationale:'A collision comes down to the road, the driver or the cyclist, and those three cover it. Junction layouts are part of road design. Injury numbers are the total being reduced. Injuries at junctions sort by location while the neighbouring headings sort by cause.'},
  {id:'f3-15',format:3,prompt:'A supermarket wants to cut the time customers spend queuing at the checkout. Which headings would you use?',options:['Number of tills open · Speed per transaction · When customers arrive','Queues at lunchtime · Speed per transaction · When customers arrive','Number of tills open · Staffing levels · Speed per transaction','Queue length · Speed per transaction · When customers arrive'],answer:0,rationale:'Queue time is set by how many tills are open, how fast each one runs and how customers arrive across the day. Staffing levels decide how many tills open, so listing both puts a cause beside its own driver. Queue length is the measure being reduced. Lunchtime queues are one instance of the arrival pattern.'},
];
    const SPOT_DIFFICULTY={accessible:['f1-02','f1-08','f1-11','f2-01','f2-05','f2-13','f3-02','f3-04','f3-11'],stretch:['f1-04','f1-06','f1-09','f1-12','f1-14','f2-04','f2-06','f2-08','f2-10','f2-14','f3-03','f3-05','f3-07','f3-09','f3-12']};
    function questionDifficulty(id){return SPOT_DIFFICULTY.accessible.includes(id)?'accessible':SPOT_DIFFICULTY.stretch.includes(id)?'stretch':'core'}
    function spotAssessmentQuestions(){if(!Array.isArray(state.spot.questionIds)||state.spot.questionIds.length!==15){const byFormat={1:[],2:[],3:[]};SPOT_QUESTION_BANK.forEach(q=>byFormat[q.format].push(q.id));let seen={};try{seen=JSON.parse(localStorage.getItem('utl_tsa_spot_seen')||'{}')}catch(_){}function take(pool,count){const chosen=[];while(chosen.length<count&&pool.length){const idx=Math.floor(Math.random()*pool.length);chosen.push(pool.splice(idx,1)[0])}return chosen}function pick5(ids){const format=SPOT_QUESTION_BANK.find(q=>q.id===ids[0]).format,seenIds=new Set(seen[format]||[]);function candidates(level){const all=ids.filter(id=>questionDifficulty(id)===level),fresh=all.filter(id=>!seenIds.has(id));return [...(fresh.length?fresh:all)]}return[...take(candidates('accessible'),1),...take(candidates('core'),2),...take(candidates('stretch'),2)]}const picked=[...pick5(byFormat[1]),...pick5(byFormat[2]),...pick5(byFormat[3])];for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]]}state.spot.questionIds=picked;picked.forEach(id=>{const format=SPOT_QUESTION_BANK.find(q=>q.id===id).format;seen[format]=Array.from(new Set([...(seen[format]||[]),id]))});try{localStorage.setItem('utl_tsa_spot_seen',JSON.stringify(seen))}catch(_){}}return state.spot.questionIds.map(id=>SPOT_QUESTION_BANK.find(q=>q.id===id))}
    const qs=new URLSearchParams(location.search); const kind=qs.get('assessment')==='checkpoint'?'checkpoint':'diagnostic';
    const STATE_KEY='utl_tsa_unified_'+kind+'_v2'; const RESULT_KEY='utl_result_tsa_'+kind+'_v2'; if(qs.get('reset')==='1')localStorage.removeItem(STATE_KEY);
    const stages=['welcome','organize','spot','speak','act','scoring','results'];
    const state=load();state.spot.answers=state.spot.answers||{};state.spot.optionOrders=state.spot.optionOrders||{};state.spot.questionIds=state.spot.questionIds||[];state.spot.correctPositions=state.spot.correctPositions||[];state.spot.part1Answers=state.spot.part1Answers||{};state.spot.part1OptionOrders=state.spot.part1OptionOrders||{};state.spot.part1QuestionIds=state.spot.part1QuestionIds||[];state.spot.part1CorrectPositions=state.spot.part1CorrectPositions||[];state.spot.part=state.spot.part===2?2:1;state.spot.quizIndex=Math.max(0,Math.min(9,Number(state.spot.quizIndex)||0));state.spot.part1Index=Math.max(0,Math.min(4,Number(state.spot.part1Index)||0));const form=FORMS[state.form]; let recognition=null,mediaRecorder=null,stream=null,timer=null,startAt=0;
    function chooseForm(){const forced=(qs.get('form')||'').toUpperCase(),canForce=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||qs.get('preview')==='1';if(canForce&&FORMS[forced])return forced;let pair={};try{pair=JSON.parse(localStorage.getItem('utl_tsa_form_pair')||'{}')}catch(_){}if(pair[kind]&&FORMS[pair[kind]])return pair[kind];if(kind==='checkpoint'&&pair.diagnostic){pair.checkpoint={A:'B',B:'C',C:'A'}[pair.diagnostic]}else pair.diagnostic=['A','B','C'][Math.floor(Math.random()*3)];localStorage.setItem('utl_tsa_form_pair',JSON.stringify(pair));return pair[kind]||pair.diagnostic}
    function blank(picked){return{version:2,attemptId:(crypto.randomUUID?crypto.randomUUID():'tsa-'+Date.now()+'-'+Math.random().toString(36).slice(2)),rubricVersion:'tsa-unified-20260811-mc10',kind,form:picked||chooseForm(),stage:'welcome',organize:{labels:['','',''],placements:{}},spot:{questionIds:[],answers:{},index:0},speak:{mode:'record',transcript:'',duration:0},act:{choice:null,mode:'record',transcript:'',duration:0},score:null,syncStatus:'idle',rewardAttempted:false,updatedAt:new Date().toISOString()}}
    function load(){try{const saved=JSON.parse(localStorage.getItem(STATE_KEY)||'null');return saved&&FORMS[saved.form]&&saved.rubricVersion==='tsa-unified-20260811-mc10'?Object.assign(blank(saved.form),saved):blank(saved?.form)}catch(_){return blank()}}
    function save(){state.updatedAt=new Date().toISOString();localStorage.setItem(STATE_KEY,JSON.stringify(state));document.getElementById('savedCopy').textContent='Saved';setTimeout(()=>{const e=document.getElementById('savedCopy');if(e)e.textContent='Progress saves automatically'},900)}
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setProgress(){const i=stages.indexOf(state.stage),pct=state.stage==='results'?100:Math.max(0,(i-0.4)/5*100);document.getElementById('progressBar').style.width=pct+'%';const names={welcome:'Ready to begin',organize:'Part 1a of 3 · Organize information',spot:'Part 1b of 3 · Test the structure',speak:'Part 2 of 3 · Speak concisely',act:'Part 3 of 3 · Act with judgment',scoring:'Preparing your results',results:'Diagnostic complete'};document.getElementById('progressCopy').textContent=names[state.stage]}
    function render(){stopMedia();setProgress();({welcome:welcome,organize:organize,spot:spotQuizVisible,speak:()=>delivery('speak'),act:()=>delivery('act'),scoring:scoreAll,results:results}[state.stage]||welcome)();if(state.stage==='results'){const label=document.querySelector('.score-hero .eyebrow');if(label)label.textContent='Your TSA profile'}scrollTo({top:0,behavior:'smooth'})}
    function go(stage){state.stage=stage;save();render()}
    function welcome(){const label=kind==='checkpoint'?'Checkpoint · after the program':'Diagnostic · before the program';app.innerHTML=`<section class="panel"><p class="eyebrow">${label}</p><h1>See how you Think, Speak, and Act.</h1><p class="lede">Complete four short challenges in one sitting. ${kind==='checkpoint'?'This is your post-program comparison. It uses the same skills and scoring as the diagnostic, with a different scenario set.':'This is your starting baseline before the program.'} It is not a pass or fail test. Most people finish in 12 to 15 minutes.</p><div class="brief"><strong>Your progress saves automatically.</strong> The Speak and Act challenges let you record in this browser or type what you would say. The microphone is optional and is requested only if you press Record. Your responses and transcript are saved with your progress so they can be scored and the assessment can be improved. If AI feedback is unavailable, the same measurable rules will score your work and you can still finish normally.</div><div class="steps"><div class="step"><b>1 · Think</b><span class="substep">1a. Organize information</span><span class="substep">1b. Test the structure</span></div><div class="step"><b>2 · Speak</b>Give a recommendation</div><div class="step"><b>3 · Act</b>Respond to pushback</div></div><div class="actions"><button class="button" id="start">Start the ${kind}</button></div></section>`;start.onclick=()=>go('organize')}
    function organize(){const o=form.organize;const placed=[[],[],[]];Object.entries(state.organize.placements).forEach(([i,b])=>placed[b]?.push(+i));const unplaced=o.items.map((_,i)=>i).filter(i=>state.organize.placements[i]===undefined);app.innerHTML=`<section class="panel"><p class="eyebrow">Part 1a of 3 · Think</p><h1>${o.title}</h1><p class="lede">${o.prompt}</p><div class="notice" id="selectionCue">${state.selected===undefined?'Select a source item, then choose “Place selected item here” in the right bucket. Select a placed item to move it again.':'Selected: <strong>'+esc(o.items[state.selected][0])+'</strong>. Now choose a bucket.'}</div><div class="sort-workspace"><div class="pool"><h3>Source items · ${unplaced.length} remaining</h3><div class="cards">${unplaced.map(cardHtml).join('')||'<span>Everything has been placed.</span>'}</div></div><div class="buckets">${placed.map((list,b)=>`<section class="bucket"><select class="label-select" data-label="${b}" aria-label="Label for group ${b+1}"><option value="">Choose a bucket label</option>${o.labels.map(x=>`<option ${state.organize.labels[b]===x?'selected':''} ${state.organize.labels.some((v,i)=>i!==b&&v===x)?'disabled':''}>${esc(x)}</option>`).join('')}</select><button class="place" data-bucket="${b}" ${state.selected===undefined?'disabled':''}>Place selected item here</button><div class="cards">${list.map(cardHtml).join('')}</div></section>`).join('')}</div></div><div class="actions"><button class="button" id="next" ${unplaced.length||state.organize.labels.some(x=>!x)?'disabled':''}>Continue</button></div></section>`;bindCards();document.querySelectorAll('[data-label]').forEach(x=>x.onchange=()=>{state.organize.labels[+x.dataset.label]=x.value;save();organize()});next.onclick=()=>go('spot')}
    function cardHtml(i){const item=form.organize.items[i];return `<button class="card ${state.selected===i?'selected':''}" data-card="${i}">${esc(item[0])}</button>`}
    function bindCards(){document.querySelectorAll('[data-card]').forEach(x=>x.onclick=()=>{state.selected=+x.dataset.card;save();organize()});document.querySelectorAll('[data-bucket]').forEach(x=>x.onclick=()=>{if(state.selected===undefined)return;state.organize.placements[state.selected]=+x.dataset.bucket;delete state.selected;save();organize()})}
    function spotQuizVisible(){const questions=spotAssessmentQuestions(),i=state.spot.index,q=questions[i],answer=state.spot.answers[q.id],typeLabel={1:'Diagnose the grouping',2:'Complete the grouping',3:'Build the headings'}[q.format];save();app.innerHTML=`<section class="panel"><p class="eyebrow">Part 1b of 3 · Think</p><h1>Test the structure</h1><p class="lede">You will see three kinds of question in mixed order: diagnose a grouping, complete a grouping, and build a set of headings. Use only the information given. Every question has exactly one correct answer; “none of the above” is never the answer.</p><div class="quiz-head"><strong>Question ${i+1} of ${questions.length} · ${typeLabel}</strong><span>${Object.keys(state.spot.answers).filter(id=>questions.some(item=>item.id===id)).length} answered</span></div><div class="quiz-track" aria-hidden="true"><span style="width:${(i+1)/questions.length*100}%"></span></div><div class="quiz-question">${esc(q.prompt)}</div><div class="quiz-options">${q.options.map((option,n)=>`<button class="quiz-option ${answer===n?'selected':''}" data-quiz-answer="${n}" aria-pressed="${answer===n}"><span class="quiz-letter">${String.fromCharCode(65+n)}</span><span>${esc(option)}</span></button>`).join('')}</div><p class="quiz-selection-status" id="quizSelectionStatus" aria-live="polite">${answer===undefined?'':'Answer selected. You can change it or continue.'}</p><div class="actions">${i?'<button class="button secondary" id="quizBack" type="button">Previous</button>':''}<button class="button" id="quizNext" type="button" ${answer===undefined?'disabled':''}>${i===questions.length-1?'Continue to Part 2':'Next question'}</button></div></section>`;const next=document.getElementById('quizNext');document.querySelectorAll('[data-quiz-answer]').forEach(button=>button.onclick=()=>{const chosen=+button.dataset.quizAnswer;state.spot.answers[q.id]=chosen;save();document.querySelectorAll('[data-quiz-answer]').forEach(option=>{const active=+option.dataset.quizAnswer===chosen;option.classList.toggle('selected',active);option.setAttribute('aria-pressed',String(active))});document.getElementById('quizSelectionStatus').textContent='Answer selected. You can change it or continue.';next.disabled=false;next.focus()});const back=document.getElementById('quizBack');if(back)back.onclick=()=>{state.spot.index=i-1;save();spotQuizVisible();scrollTo({top:0,behavior:'smooth'})};next.onclick=()=>{if(state.spot.answers[q.id]===undefined)return;if(i<questions.length-1){state.spot.index=i+1;save();spotQuizVisible();scrollTo({top:0,behavior:'smooth'})}else go('speak')}}
    addEventListener('pagehide',()=>{if(state.speak.recording||state.act.recording){state.speak.recording=false;state.act.recording=false;save()}stopMedia()});
    function count(t){return String(t||'').trim().split(/\s+/).filter(Boolean).length}function format(n){return '0:'+String(Math.max(0,n)).padStart(2,'0')}
    function contains(text,terms){const t=text.toLowerCase();return terms.some(x=>t.includes(x))}
    function validAi(value){const keys=['speakEvidence','actEvidence','speakStrength','speakNext','actStrength','actNext'];return value&&value.fallback!==true&&keys.every(k=>typeof value[k]==='string'&&value[k].trim()&&value[k].length<=500)}
    function delivery(type){const d=state[type],data=form[type],isAct=type==='act',minimum=isAct?15:25,ready=count(d.transcript)>=minimum;const response=isAct&&d.choice===null?'':`<strong class="mode-label">Choose how to give your answer</strong><div class="mode" role="group" aria-label="Response method"><button data-mode="record" aria-pressed="${d.mode==='record'}" class="${d.mode==='record'?'active':''}">Use microphone</button><button data-mode="type" aria-pressed="${d.mode==='type'}" class="${d.mode==='type'?'active':''}">Type my response</button></div>${d.mode==='record'?recordUi(type):typeUi(type)}<p class="ai-label">Write or say at least ${minimum} words so there is enough evidence to score.</p><div class="actions"><button class="button" id="next" ${ready?'':'disabled'}>${isAct?'Finish and see my results':'Continue'}</button></div>`;app.innerHTML=`<section class="panel"><p class="eyebrow">Part ${isAct?'3':'2'} of 3 · ${isAct?'Act':'Speak'}</p>${isAct?`<h1>${data.title}</h1><div class="scenario"><strong>Situation</strong><p>${esc(data.setup)}</p></div><p class="lede">Choose what you would do first.</p><div class="choice-grid">${data.choices.map((c,i)=>`<button class="choice ${d.choice===i?'selected':''}" data-choice="${i}">${esc(c)}</button>`).join('')}</div>${d.choice!==null?`<div class="pushback"><strong>Now respond to this pushback:</strong><p>${esc(data.pushback)}</p><p>State your decision, respond to the concern, and explain what happens next. You have up to 45 seconds.</p></div>`:''}`:`<h1>Give a clear recommendation</h1><div class="scenario"><strong>Situation · ${esc(data.title)}</strong><ul>${data.facts.map(x=>`<li><strong>${esc(x[0])}:</strong> ${esc(x[1])}</li>`).join('')}</ul></div><div class="task"><strong>Your task</strong>Recommend one option. Give two or three reasons based on the information above, then state a clear next step. You have up to 60 seconds.</div>`}${response}</section>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{if(d.recording)stopRecording(type,false);d.mode=x.dataset.mode;d.recording=false;stopMedia();save();delivery(type)});document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{if(d.recording)stopRecording(type,false);d.choice=+x.dataset.choice;d.recording=false;stopMedia();save();delivery(type)});bindDelivery(type);const next=document.getElementById('next');if(next)next.onclick=()=>go(isAct?'scoring':'act')}
    function recordUi(type){const d=state[type],limit=type==='speak'?60:45;return `<div class="recorder"><button class="record-button" id="record"><strong id="clock">${format(d.duration||limit)}</strong><span>${d.recording?'Stop recording':d.transcript?'Record again':'Start recording'}</span></button><div class="record-help"><strong>Your words will appear below as you speak.</strong><p>Your audio stays in this browser. You can review and correct obvious transcription errors before continuing.</p><div id="recordStatus" class="ai-label">Microphone permission is requested only when you press Start.</div></div></div><label><strong>Transcript</strong><textarea class="transcript" id="transcript" placeholder="Your transcript will appear here.">${esc(d.transcript)}</textarea></label>${metrics(type)}`}
    function typeUi(type){return `<div class="notice"><strong>Written response selected.</strong> Type the answer you would give aloud. The assessment scores the content of this response; it does not score vocal delivery.</div><label><strong>Your response</strong><textarea class="transcript" id="transcript" placeholder="Type what you would say.">${esc(state[type].transcript)}</textarea></label>${metrics(type)}`}
    function metrics(type){const d=state[type],words=count(d.transcript),wpm=d.duration?Math.round(words/d.duration*60):0;return `<div class="metrics"><span class="metric">${words} words</span>${d.duration?`<span class="metric">${d.duration}s measured</span><span class="metric">${wpm} WPM</span>`:''}</div>`}
    function bindDelivery(type){const ta=document.getElementById('transcript');if(ta)ta.oninput=()=>{state[type].transcript=ta.value;save();const next=document.getElementById('next');if(next)next.disabled=count(ta.value)<(type==='act'?15:25)};const b=document.getElementById('record');if(b)b.onclick=()=>state[type].recording?stopRecording(type):startRecording(type)}
    async function startRecording(type){const d=state[type],limit=type==='speak'?60:45,SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){d.mode='type';d.recording=false;save();delivery(type);const n=document.querySelector('.notice');if(n)n.innerHTML='<strong>Live transcription is not supported in this browser.</strong> Type what you would say and finish normally.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});d.transcript='';d.duration=0;d.recording=true;startAt=Date.now();mediaRecorder=new MediaRecorder(stream);mediaRecorder.start();recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';let final='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}d.transcript=(final+interim).trim();const ta=document.getElementById('transcript');if(ta)ta.value=d.transcript;save()};recognition.start();timer=setInterval(()=>{d.duration=Math.min(limit,Math.round((Date.now()-startAt)/1000));const c=document.getElementById('clock');if(c)c.textContent=format(limit-d.duration);if(d.duration>=limit)stopRecording(type)},250);delivery(type)}catch(e){stopMedia();d.mode='type';d.recording=false;save();delivery(type);const n=document.querySelector('.notice');if(n)n.innerHTML='<strong>Recording is unavailable.</strong> You can type your response and finish normally.'}}
    function stopRecording(type,rerender=true){const d=state[type];d.recording=false;if(startAt)d.duration=Math.max(1,Math.round((Date.now()-startAt)/1000));stopMedia();save();if(rerender)delivery(type)}
    function stopMedia(){clearInterval(timer);timer=null;try{recognition?.stop()}catch(_){}recognition=null;try{if(mediaRecorder?.state==='recording')mediaRecorder.stop()}catch(_){}mediaRecorder=null;stream?.getTracks().forEach(t=>t.stop());stream=null}
    function deterministic(){const o=form.organize,unique=new Set();let label=0;state.organize.labels.forEach(x=>{if(o.correctLabels.includes(x)&&!unique.has(x)){label+=2;unique.add(x)}});let place=0;o.items.forEach((x,i)=>{const bucket=state.organize.placements[i],chosenLabel=state.organize.labels[bucket],correctLabel=o.correctLabels[x[1]];if(chosenLabel===correctLabel)place+=14/o.items.length});const organize=Math.min(20,Math.round((label+place)*10)/10);const spot=Math.max(0,Math.min(20,spotAssessmentQuestions().reduce((points,q)=>points+(state.spot.answers[q.id]===q.answer?20/15:0),0)));const speech=scoreText(state.speak,form.speak,false);const act=scoreText(state.act,form.act,true);return{think:Math.round((organize+spot)*10)/10,organize,spot,speak:speech.total,act:act.total,speakDetail:speech,actDetail:act,total:Math.round((organize+spot+speech.total+act.total)*10)/10}}
    function normalizeContractions(t){return t.replace(/\bi'd\b/g,'i would').replace(/\bi'll\b/g,'i will').replace(/\bwe'd\b/g,'we would').replace(/\bwe'll\b/g,'we will')}
    function scoreText(d,data,isAct){const t=d.transcript.toLowerCase(),words=count(t),norm=normalizeContractions(t);if(!isAct){const hasRecommendation=/\b(i recommend|i would choose|i would go with|we should choose|the best option is|my recommendation is|let's)\b/.test(norm);let coverage=data.keywords.reduce((n,g)=>n+(contains(t,g)?4:0),0);let structure=(hasRecommendation?4:0)+((t.match(/\b(because|first|second|also|another)\b/g)||[]).length>=2?3:0)+(contains(t,data.next)?3:0);let concise=(words>=35&&words<=150?5:words>=25&&words<=180?3:1)+((t.match(/[.!?]/g)||[]).length>=2?3:1);let total=Math.min(30,coverage+structure+concise);if(!hasRecommendation)total=Math.min(10,total);return{total,coverage,structure,concise,hasRecommendation}}const hasDecision=/\b(i would|we should|my decision is|i will|we will|let's)\b/.test(norm);let choice=d.choice===data.best?6:4;let decision=hasDecision?5:0;let reason=(/\b(because|so that|while|but|instead)\b/.test(t)?4:0)+(contains(t,data.terms)?3:0);let awareness=contains(t,data.concerns)&&/\b(understand|hear|agree|concern|although|while)\b/.test(t)?6:0;let next=contains(t,data.next)?4:0;let concise=words>=18&&words<=110?2:1;let total=Math.min(30,choice+decision+reason+awareness+next+concise);if(!hasDecision)total=Math.min(8,total);return{total,choice,decision,reason,awareness,next,concise,hasDecision}}
    async function scoreAll(){app.innerHTML='<section class="panel"><div class="loading"><span class="spinner"></span><div><h1 style="margin-bottom:4px">Preparing your TSA profile</h1><p>Your score is already available from the fixed assessment rules. AI may add comments, but it cannot change the official score or delay completion.</p></div></div></section>';const base=deterministic();let ai=null,controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const res=await fetch('https://us-central1-the-untaught-lessons.cloudfunctions.net/scoreTsaDiagnostic',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({formId:state.form,kind,speak:state.speak,act:state.act,scenario:{speakFacts:form.speak.facts.map(x=>x[0]+': '+x[1]),actSetup:form.act.setup,actChoice:form.act.choices[state.act.choice],actPushback:form.act.pushback},deterministic:base})});if(res.ok)ai=await res.json()}catch(_){}finally{clearTimeout(timeout)}if(validAi(ai))base.ai=ai;else base.aiFallback=true;state.score=base;state.stage='results';state.syncStatus='pending';save();localStorage.setItem(RESULT_KEY,JSON.stringify({assessment:kind,formId:state.form,mode:{speak:state.speak.mode,act:state.act.mode},responses:{organize:state.organize,spot:state.spot,speak:state.speak,act:state.act},scores:base,rubricVersion:state.rubricVersion,completedAt:new Date().toISOString()}));render();complete(base)}
    function completionPayload(score){let pair={};try{pair=JSON.parse(localStorage.getItem('utl_tsa_form_pair')||'{}')}catch(_){}return{completed:true,attemptId:state.attemptId,assessmentKind:kind,assignedForms:pair,formId:state.form,rubricVersion:state.rubricVersion,score:score.total,scores:score,responseMode:{speak:state.speak.mode,act:state.act.mode},duration:{speak:state.speak.duration,act:state.act.duration},responses:{organize:state.organize,spot:state.spot,speak:state.speak,act:state.act},completedAt:new Date().toISOString()}}
    function showSync(){const e=document.getElementById('syncStatus');if(!e)return;const copy={pending:'Saving your diagnostic response…',saved:'Diagnostic response saved.',failed:'Your result is safe on this device. We will retry saving when you are online.'};e.dataset.state=state.syncStatus;e.textContent=copy[state.syncStatus]||copy.pending}
    async function complete(score){if(!score||state.syncStatus==='saved')return;state.syncStatus='pending';save();showSync();try{const fb=await import('../../assets/firebase.js');await fb.saveUserProgress('tsa-'+kind+'-v2',kind==='checkpoint'?'TSA checkpoint':'TSA diagnostic',completionPayload(score));state.syncStatus='saved'}catch(_){state.syncStatus='failed'}save();showSync();if(!state.rewardAttempted){state.rewardAttempted=true;save();try{await window.UTLRewardEvents?.awardAssessment({assessmentId:kind,title:(kind==='checkpoint'?'Checkpoint':'Diagnostic')+' complete'})}catch(_){}}}
    function results(){const s=state.score||deterministic();const weakest=[['Think',s.think/40],['Speak',s.speak/30],['Act',s.act/30]].sort((a,b)=>a[1]-b[1])[0][0];const strength=[['Think',s.think/40],['Speak',s.speak/30],['Act',s.act/30]].sort((a,b)=>b[1]-a[1])[0][0];const moves={Think:'Practice grouping information before writing or speaking.',Speak:s.ai?.speakNext||'State the recommendation first, then support it with two or three connected reasons.',Act:s.ai?.actNext||'Name your decision, acknowledge the concern, and give a practical next step.'};const observations={Think:`You earned ${Math.round(s.organize)} of 20 for organizing and ${Math.round(s.spot)} of 20 for spotting structural problems.`,Speak:s.ai?`${esc(s.ai.speakStrength)} Evidence: “${esc(s.ai.speakEvidence)}”`:`Your response covered ${Math.round(s.speakDetail.coverage)} of 12 available evidence points and ${Math.round(s.speakDetail.structure)} of 10 structure points.`,Act:s.ai?`${esc(s.ai.actStrength)} Evidence: “${esc(s.ai.actEvidence)}”`:`Your decision, reasoning, response to the concern, and next step produced ${Math.round(s.act)} of 30 points.`};app.innerHTML=`<section class="panel"><div class="score-hero"><p class="eyebrow">Your TSA profile · Form ${state.form}</p><h1>Your provisional TSA snapshot</h1><div class="score-number">${Math.round(s.total)}<span>/100</span></div><p>This is your ${kind==='checkpoint'?'checkpoint':'starting point'}. It is a snapshot of this attempt, not a fixed label. Results are directional while we continue calibrating scoring against real learner responses.</p></div><div class="score-grid"><div class="score-card">Think<strong>${Math.round(s.think)} / 40</strong></div><div class="score-card">Speak<strong>${Math.round(s.speak)} / 30</strong></div><div class="score-card">Act<strong>${Math.round(s.act)} / 30</strong></div></div><div class="feedback-grid"><div class="feedback"><strong>Your strongest area: ${strength}</strong><p>${observations[strength]}</p></div><div class="feedback"><strong>Your next move: ${weakest}</strong><p>${esc(moves[weakest])}</p></div></div><p class="ai-label">${s.aiFallback?'AI comments were unavailable. Your official score still used the same fixed rules.':'AI added comments for Speak and Act. The official score came from fixed rules.'}${state.speak.mode==='type'||state.act.mode==='type'?' One or more responses were text-only, so no vocal qualities were scored.':''}</p><div class="sync-status" id="syncStatus" data-state="${esc(state.syncStatus||'pending')}"></div><div class="actions"><a class="button secondary" href="../../member-login/index.html#learning-journey">Return to Learning Journey</a></div></section>`;showSync()}
    addEventListener('online',()=>{if(state.stage==='results'&&state.syncStatus!=='saved')complete(state.score)});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.stage==='results'&&state.syncStatus!=='saved')complete(state.score)});
    if(qs.get('preview')==='1')window.UTLTsaDiagnosticTest={state,form,deterministic,scoreText};
    render();if(state.stage==='results'&&state.syncStatus!=='saved')complete(state.score);
  })();
  </script>
