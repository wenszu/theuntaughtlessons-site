  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap');
    :root{--navy:#003366;--gold:#EEA320;--cream:#F3EDE2;--white:#fff;--ink:#333;--steel:#4D7094;--line:#C7D8E8;--green:#2C7A4B;--soft:#FAF8F3}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Lato,Arial,sans-serif}button,textarea{font:inherit}
    .header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
    .header-in{width:min(1100px,100%);min-height:74px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}.logo{width:165px}.logo img{display:block;width:100%}.divider{width:1px;height:40px;background:#ffffff66}.head-copy{min-width:0}.head-copy small{color:var(--gold)}.head-copy strong{display:block;font:700 25px Playfair Display,serif}.exit{margin-left:auto;color:#fff;text-decoration:none;font-weight:700}
    .progress{background:#fff;border-bottom:1px solid var(--line)}.progress-in{width:min(1100px,100%);margin:auto;padding:10px 22px;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}.progress-copy{color:var(--navy);font-weight:700}.saved{color:var(--steel);font-size:13px}.track{grid-column:1/-1;height:5px;background:#D9E1E8;border-radius:9px;overflow:hidden}.track span{display:block;height:100%;background:var(--gold);transition:width .25s}
    main{width:100%;max-width:1000px;margin:auto;padding:34px 22px 80px}.panel{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:clamp(22px,4vw,42px)}h1,h2,h3{max-width:100%;overflow-wrap:break-word;color:var(--navy);font-family:Playfair Display,serif;margin-top:0}.eyebrow{color:#A26700;font-weight:700;margin:0 0 8px}.lede{font-size:18px;line-height:1.55;max-width:760px}.brief{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;line-height:1.55;margin:20px 0}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.step{min-width:0;padding:14px;border-top:3px solid var(--line);background:var(--soft);color:var(--navy)}.step b{display:block;margin-bottom:4px}.step .substep{display:block}
    .button{border:1px solid var(--gold);border-radius:7px;background:var(--gold);color:var(--navy);min-height:48px;padding:12px 20px;font-weight:700;cursor:pointer}.button.secondary{background:#fff;border-color:var(--navy)}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.notice{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:13px 15px;margin:16px 0;line-height:1.5}.error{color:#8B2E25}.hidden{display:none!important}
    .sort-workspace{display:grid;grid-template-columns:minmax(210px,.72fr) minmax(0,2fr);gap:14px;align-items:stretch;margin-top:18px}.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bucket{min-height:260px;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--soft)}.bucket h3{font:700 16px Lato,sans-serif}.bucket.is-target{border-color:var(--gold);background:#FFF8EC}.place{width:100%;min-height:44px;margin:2px 0 10px;border:1px dashed var(--gold);border-radius:6px;background:#FFF8EC;color:var(--navy);font-weight:700;cursor:pointer}.cards{display:grid;gap:8px}.card{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:7px;padding:12px;text-align:left;cursor:pointer}.card.selected{outline:3px solid #EEA32066;border-color:var(--gold)}.pool{margin:18px 0;padding:14px;border:1px dashed var(--steel);border-radius:9px}.sort-workspace>.pool{margin:0;background:#F8FBFC}.pool h3{font:700 16px Lato,sans-serif}.label-select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:#fff}.spot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;cursor:pointer}.check-card input{width:20px;height:20px;flex:0 0 auto}.instruction-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.instruction-step{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:12px;line-height:1.45}.instruction-step strong{display:block;color:var(--navy);margin-bottom:3px}.move-grid{display:grid;grid-template-columns:minmax(190px,.85fr) repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
    .scenario{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:16px 18px;margin:18px 0;line-height:1.55}.scenario>strong{display:block;color:var(--navy);margin-bottom:8px}.scenario ul{margin-bottom:0;padding-left:20px}.scenario li+li{margin-top:8px}.task{margin:18px 0 8px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#EEF3F7;line-height:1.5}.task strong{display:block;color:var(--navy);margin-bottom:4px}.mode-label{display:block;color:var(--navy);margin:18px 0 7px}.mode{display:inline-flex;gap:0;margin:0 0 18px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:3px}.mode button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--steel);padding:9px 14px;font-weight:700;cursor:pointer}.mode button.active{border-bottom-color:var(--navy);color:var(--navy);background:#EEF3F7}.recorder{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;margin:18px 0}.record-button{width:140px;height:140px;border-radius:50%;border:8px solid #D9E1E8;background:var(--navy);color:#fff;cursor:pointer;font-weight:700;padding:15px}.record-button strong{display:block;font:700 30px Playfair Display,serif;margin-bottom:4px}.record-button.recording{background:#8B2E25}.record-help{line-height:1.55}.transcript{width:100%;min-height:170px;border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.5;resize:vertical}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.metric{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--steel);font-size:14px}
    .assessment-task{margin:4px 0 22px;padding:16px 18px;border-left:5px solid var(--gold);border-radius:0 8px 8px 0;background:#FFF8EC;line-height:1.55}.assessment-task strong,.section-label{display:block;color:var(--navy);font-weight:700}.assessment-task strong{margin-bottom:5px}.section-label{margin:22px 0 8px}.scenario.information{margin-top:0}.scenario.information>strong{font-size:16px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid var(--line);background:#fff;border-radius:8px;padding:16px;text-align:left;color:var(--navy);font-weight:700;cursor:pointer}.choice.selected{border-color:var(--gold);background:#FFF8EC}.pushback{border:1px solid var(--line);background:#EEF3F7;border-radius:8px;padding:16px;margin:16px 0}.loading{display:flex;align-items:center;gap:10px;color:var(--steel)}.spinner{width:20px;height:20px;border:3px solid #D9E1E8;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .score-hero{text-align:center;border-bottom:1px solid var(--line);padding-bottom:24px}.score-number{font:700 clamp(62px,12vw,100px) Playfair Display,serif;color:var(--navy)}.score-number span{font:700 24px Lato,sans-serif;color:var(--steel)}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.score-card{border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:8px;padding:18px}.score-card strong{display:block;color:var(--navy);font-size:25px;margin-top:5px}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feedback{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;line-height:1.5}.ai-label{font-size:13px;color:var(--steel)}.sync-status{display:flex;align-items:center;gap:8px;margin-top:18px;padding:11px 13px;border:1px solid var(--line);border-radius:7px;color:var(--steel);background:var(--soft);font-size:14px}.sync-status[data-state="saved"]{color:var(--green);border-color:#BBD8C6}.sync-status[data-state="pending"]::before{content:'';width:13px;height:13px;border:2px solid #D9E1E8;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}.sync-status[data-state="failed"]{color:#8A5A00;border-color:#E5D4B4;background:#FFF8EC}
    @media(max-width:760px){.header-in{padding:10px 14px;gap:10px}.logo{width:100px}.divider{height:34px}.head-copy strong{font-size:19px}.exit{font-size:0}.exit::after{content:'Exit';font-size:13px}.saved{display:none}.progress-in{grid-template-columns:1fr}.steps,.sort-workspace,.spot-list,.move-grid,.choice-grid,.score-grid,.feedback-grid,.instruction-steps{grid-template-columns:1fr}.buckets{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.bucket{flex:0 0 min(82vw,280px);min-height:210px;scroll-snap-align:start}.recorder{grid-template-columns:1fr;text-align:center}.record-button{margin:auto}.panel{padding:20px}.progress-in{padding:9px 14px}main{padding:20px 12px 60px}}
    .place,.card,.label-select{font-family:Lato,Arial,sans-serif;font-size:14px}.place,.card{font-weight:700}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px;color:var(--steel);font-size:14px}.quiz-track{height:6px;border-radius:999px;background:#D9E1E8;overflow:hidden}.quiz-track span{display:block;height:100%;background:var(--gold)}.quiz-question{margin:22px 0 16px;font:700 clamp(23px,3vw,32px) Playfair Display,serif;color:var(--navy);line-height:1.2}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quiz-option{display:flex;align-items:flex-start;gap:10px;min-height:68px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:14px;text-align:left;color:var(--navy);font:700 15px Lato,Arial,sans-serif;cursor:pointer}.quiz-option.selected{border-color:var(--gold);background:#FFF8EC;box-shadow:0 0 0 3px #EEA32026}.quiz-letter{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--steel)}.question-report{margin-top:14px;color:var(--steel);font-size:13px}.question-report summary{display:inline-block;cursor:pointer;text-decoration:underline;text-decoration-color:#4D709466;text-underline-offset:3px}.question-report-panel{max-width:560px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.question-report-panel label{display:block;color:var(--navy);font-weight:700}.question-report-panel select,.question-report-panel textarea{width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:400 13px Lato,Arial,sans-serif}.question-report-panel textarea{min-height:70px;resize:vertical}.question-report-note{margin:8px 0 0;color:var(--green)}@media(max-width:600px){.quiz-options{grid-template-columns:1fr}.quiz-option{min-height:58px}}
    .challenge-parts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0 22px}.challenge-part{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--soft);color:var(--steel);font-size:14px;font-weight:700}.challenge-part+.challenge-part{border-left:1px solid var(--line)}.challenge-part.current{background:#fff;color:var(--navy);box-shadow:inset 0 -3px var(--gold)}.challenge-part.complete{color:var(--green)}.part-number{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px}.challenge-part.current .part-number{background:#FFF2D3;border-color:var(--gold)}.part-next{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px}.part-next strong{display:block;color:var(--navy);margin-bottom:3px}.part-next p{margin:0;color:var(--steel);font-size:14px}.part-next .button{flex:0 0 auto}.quiz-selection-status{min-height:20px;margin:10px 0 0;color:var(--green);font-size:13px;font-weight:700}@media(max-width:600px){.challenge-parts{grid-template-columns:1fr}.challenge-part+.challenge-part{border-left:0;border-top:1px solid var(--line)}.part-next{display:block}.part-next .button{width:100%;margin-top:12px}}
  </style>

  <script src="../../assets/reward-events.js"></script>
  <script>
  (()=>{
    const app=document.getElementById('app');
    const FORMS={
      A:{organize:{title:'Plan a group day out',prompt:'Organize the nine tasks according to when they should be handled. Choose the best three timing labels, then place every task.',labels:['Book now','Decide together','Figure out later','Fun ideas','Important things','Other'],correctLabels:['Book now','Decide together','Figure out later'],items:[['Reserve the train tickets while the lowest fare is still available',0],['Secure the museum’s only remaining group time slot',0],['Reserve lunch while tables for a group of this size remain available',0],['Choose between the museum and aquarium after collecting everyone’s preference',1],['Set the lunch budget once every person accepts the amount',1],['Select a meeting point after checking where each person will arrive',1],['Check the forecast once it covers the date of the outing',2],['Share the final emergency-contact list once attendance is confirmed',2],['Build the playlist after everyone submits a song choice',2]]},spot:{title:'Make a study plan complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Time','Environment','Support'],items:[['Study at the same time each evening','time-a'],['Keep a regular study schedule','time-a'],['Use short focused sessions','time-b'],['Put the phone in another room','env-a'],['Study somewhere quiet','env-b'],['Ask a friend to quiz you','support-a'],['Get help when a topic stays unclear','support-b'],['Review difficult topics with someone','support-b']],missing:[['Plan breaks before you start',0],['Set a finish time for each study block',0],['Clear the desk before studying',1],['Keep the books you need within reach',1],['Choose whom to ask before you get stuck',2],['Buy new stationery',-1]]},speak:{title:'Choose a location for a community event',facts:[['Library option','Free and easy to reach, but it holds only 45 people.'],['Park option','Holds 100 people and costs nothing, but rain is forecast.'],['Community hall option','Holds 80 people, costs $120, and is indoors.'],['Expected attendance','Around 65 people.']],keywords:[['library','park','community hall','hall'],['65','capacity','people','everyone expected','accommodate','fit everyone','enough room'],['rain','indoors','weather','forecast','disrupt','shelter','weather risk','uncertainty'],['cost','additional cost','price','120','afford','budget','worth']],next:['book','reserve','confirm','check']},act:{title:'A group member has not finished their part',setup:'A shared project is due tomorrow. One person has not completed their section and says they need another two days.',choices:['Redistribute the unfinished work across the group tonight','Request a one-day extension and keep the full scope','Reduce their section and agree on a firm handoff time today'],best:2,pushback:'They reply: “I am already overwhelmed. Why can’t everyone just wait?”',terms:['deadline','tomorrow','handoff','section'],concerns:['overwhelmed','overloaded','workload','busy','too busy','stretched','stretched thin','capacity','bandwidth','too much','too much on your plate','cannot finish','struggling','wait'],next:['send','share','finish','time','today'] }},
      B:{organize:{title:'Prepare for an exam week',prompt:'Organize the nine tasks according to when they should be handled. Choose the best three timing labels, then place every task.',labels:['Do this week','Night before','Skip','School tasks','Helpful ideas','Other'],correctLabels:['Do this week','Night before','Skip'],items:[['Turn the syllabus into a one-page checklist, leaving time to study every topic',0],['Complete difficult practice questions with enough time to correct mistakes',0],['Get clarification while the teacher is still available',0],['Place the permitted pens and required identification beside the exam bag',1],['Set wake-up alarms after the exam time and travel plan are confirmed',1],['Choose clothes using the forecast for the exam morning',1],['Copy every page of notes word for word instead of practising',2],['Start studying a topic that is not included in the exam syllabus',2],['Rank friends by who claims to have studied the most hours',2]]},spot:{title:'Make a healthy routine complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Sleep','Movement','Food'],items:[['Go to bed at a regular time','sleep-a'],['Keep the same bedtime most nights','sleep-a'],['Put screens away before bed','sleep-b'],['Walk for twenty minutes','move-a'],['Choose stairs for short trips','move-b'],['Plan simple meals ahead','food-a'],['Keep water nearby','food-b'],['Carry a bottle during the day','food-b']],missing:[['Make the bedroom dark and quiet',0],['Follow the same short bedtime routine',0],['Stretch after sitting for a long time',1],['Choose a form of movement you enjoy',1],['Pack a simple healthy snack',2],['Buy an expensive fitness watch',-1]]},speak:{title:'Set a phone rule for a study group',facts:[['Current interruption rate','Notifications interrupt the group about every seven minutes.'],['Reference needs','Some members need phones to check reference material.'],['Previous full ban','Two members left early the last time phones were completely banned.'],['Session length','The group meets for one focused hour.']],keywords:[['silent','notifications','airplane','mute','do not disturb'],['reference','check','break','look things up','resources'],['hour','focus','focused','concentrate','interrupt']],next:['agree','try','review','set','test']},act:{title:'An event now costs more than agreed',setup:'Your group planned a small event with a fixed budget. The venue raises its price by 30% one week before the date.',choices:['Keep the venue and reduce food and decoration costs','Compare a cheaper venue and a smaller version, then ask the group to choose today','Ask attendees to cover the increase before changing the plan'],best:1,pushback:'A friend says: “Changing the plan will make us look disorganized. Just pay the extra cost.”',terms:['budget','cost','venue','30'],concerns:['disorganized','reputation','appearance','change'],next:['compare','choose','today','ask'] }},
      C:{organize:{title:'Move into a new home',prompt:'Organize the nine tasks according to when they should be handled. Choose the best three timing labels, then place every task.',labels:['Before moving','First day','Later','Rooms','Important jobs','Other'],correctLabels:['Before moving','First day','Later'],items:[['Confirm the movers before their cancellation deadline',0],['Pack essential items separately so they are available before any boxes are unpacked',0],['Label each box while packing, before the movers collect it',0],['Test water and electricity before relying on either service in the new home',1],['Set up a place to sleep before the first bedtime in the new home',1],['Buy essential groceries once the refrigerator has been tested',1],['Choose wall decorations once the furniture positions are final',2],['Organize old photographs once essential rooms are usable',2],['Buy matching storage boxes once room measurements and furniture positions are final',2]]},spot:{title:'Make a club project complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Purpose','People','Delivery'],items:[['Write one clear project goal','purpose-a'],['State what success should look like','purpose-a'],['Choose the main audience','purpose-b'],['Give each person one owner role','people-a'],['Match tasks to people’s strengths','people-b'],['Set a final due date','delivery-a'],['Check progress every week','delivery-b'],['Hold a weekly progress review','delivery-b']],missing:[['List what the project will not include',0],['Choose evidence that will show the goal was met',0],['Name a backup owner for key work',1],['Agree who makes the final call',1],['Set one midpoint milestone',2],['Design a new club logo',-1]]},speak:{title:'Use a small community fund',facts:[['Available fund','$500.'],['Reading corner','Would serve about 40 children and cost $450.'],['Sports equipment','Would serve about 25 children and cost $300.'],['One-day celebration','Would serve 80 people and cost $500.']],keywords:[['reading','sports','celebration'],['cost','500','450','300','budget','afford','save'],['children','serve','lasting','reach','benefit','long-term','durable','people']],next:['buy','confirm','choose','ask','approve']},act:{title:'Bad weather threatens an outdoor activity',setup:'An outdoor activity for 50 people is tomorrow. Heavy rain is now likely, and the indoor backup space fits only 30.',choices:['Move 30 people indoors, offer a later session, and tell everyone today','Move the entire activity to a later date','Keep the outdoor time but add rain cover and an indoor safety plan'],best:0,pushback:'Someone says: “Splitting the group is inconvenient. We should take the chance and stay outside.”',terms:['rain','indoor','30','50'],concerns:['inconvenient','split','disruption','weather'],next:['tell','move','session','today'] }}
    };
    const SPOT_QUESTION_BANK=[
  {id:'f1-01',format:1,prompt:'A hardware store sorts its returns into "Wrong item shipped", "Returns filed after 30 days", "Damaged in transit" and "Customer changed their mind". Which one would you change?',options:['Returns filed after 30 days','Damaged in transit','Customer changed their mind','Wrong item shipped'],answer:0,rationale:'Three of these say why a return happened. "Returns filed after 30 days" says when it was filed, so the set is sorting on two principles at once. A wrong item returned on day 40 belongs in two places, which is exactly the problem a single grouping principle prevents.'},
  {id:'f1-02',format:1,prompt:'A dental practice books appointments under "Cleanings", "Patient treatment", "Fillings" and "Extractions". Which one would you change?',options:['Extractions','Patient treatment','Cleanings','Fillings'],answer:1,rationale:'Cleanings, fillings and extractions are all patient treatment, so that heading sits one level above the other three rather than beside them. Every appointment would qualify for it, which makes it useless as a sorting choice.'},
  {id:'f1-03',format:1,prompt:'A bakery records daily waste under "Burned in the oven", "Unsold at close", "Damaged in handling" and "Trays dropped on the way to the display case". Which one would you change?',options:['Burned in the oven','Unsold at close','Trays dropped on the way to the display case','Damaged in handling'],answer:2,rationale:'A dropped tray is one way stock gets damaged in handling, so it belongs inside that category rather than beside it. Burning, going unsold and being damaged are three separate ways a bakery loses stock, each with one home.'},
  {id:'f1-04',format:1,prompt:'A city housing office logs tenant complaints under "Heating and hot water", "Repeat complaints", "Pest infestation" and "Structural repairs". Which one would you change?',options:['Heating and hot water','Pest infestation','Structural repairs','Repeat complaints'],answer:3,rationale:'The other three name what the complaint is about. "Repeat complaints" names how often it has been raised, which can apply to any subject. A third call about a broken boiler has two homes, so the axis is mixed.'},
  {id:'f1-05',format:1,prompt:'A community college lists its student services as "Tutoring", "Writing centre", "Academic support" and "Mental health counselling". Which one would you change?',options:['Academic support','Writing centre','Tutoring','Mental health counselling'],answer:0,rationale:'Tutoring and the writing centre are both forms of academic support, so that heading swallows two of its own siblings. Counselling stays outside it, which is why the set looks workable at a glance and still is not.'},
  {id:'f1-06',format:1,prompt:'A delivery firm codes failed drop-offs as "Nobody available to sign", "Driver could not locate the address", "Refused by the recipient" and "Address missing a house number". Which one would you change?',options:['Nobody available to sign','Address missing a house number','Refused by the recipient','Driver could not locate the address'],answer:1,rationale:'"Address missing a house number" describes a problem with the address information, while the other headings describe the outcome or reason for the failed delivery. It can also coexist with the other outcomes, so it uses a different grouping rule.'},
  {id:'f1-07',format:1,prompt:'A gym logs equipment problems under "Cardio machines", "Free weights", "Member-reported faults" and "Resistance machines". Which one would you change?',options:['Resistance machines','Free weights','Member-reported faults','Cardio machines'],answer:2,rationale:'Three categories name which equipment failed. The fourth names who noticed, and a member can report a fault on any of the three. Reporting source is a second axis and needs its own field, not a slot in this list.'},
  {id:'f1-08',format:1,prompt:'A car rental branch logs vehicle issues under "Engine faults", "Tyre and brake wear", "Interior damage" and "Reported at weekends". Which one would you change?',options:['Engine faults','Tyre and brake wear','Interior damage','Reported at weekends'],answer:3,rationale:'The first three name a type of fault. The last names a time, so a worn brake found on a Saturday fits two categories at once.'},
  {id:'f1-09',format:1,prompt:'A hospital ward codes medication errors as "Wrong dose given", "Patient harmed", "Wrong patient" and "Wrong timing". Which one would you change?',options:['Patient harmed','Wrong patient','Wrong timing','Wrong dose given'],answer:0,rationale:'Dose, patient and timing describe what went wrong. Harm describes what followed, and it can follow any of the three. Mixing the error with its consequence hides how often each error type actually occurs.'},
  {id:'f1-10',format:1,prompt:'A software team labels its backlog "Login and authentication", "Payments", "Performance" and "Reporting". Which one would you change?',options:['Reporting','Performance','Payments','Login and authentication'],answer:1,rationale:'Three of these name a part of the product. Performance names a quality that every part can fail on, so a slow payment page belongs in two labels. It cuts across the set instead of taking a place in it.'},
  {id:'f1-11',format:1,prompt:'A university residence logs maintenance under "Plumbing", "Burst water pipes", "Electrical" and "Heating". Which one would you change?',options:['Heating','Plumbing','Burst water pipes','Electrical'],answer:2,rationale:'A burst water pipe is a specific plumbing problem, so it sits inside the broader plumbing category rather than beside it. Electrical and heating are separate maintenance categories.'},
  {id:'f1-12',format:1,prompt:'A charity reports its spending as "Programme delivery", "Fundraising", "Restricted funds" and "Administration". Which one would you change?',options:['Programme delivery','Administration','Fundraising','Restricted funds'],answer:3,rationale:'Three categories say what the money was spent on. Restricted funds says where the money came from and what conditions apply to it. Restricted money is still spent on programmes, fundraising or administration, so it doubles the count rather than adding a fourth slice.'},
  {id:'f1-13',format:1,prompt:'A call centre tags each call as "New order", "Angry caller", "Order status check" or "Complaint". Which one would you change?',options:['Angry caller','Order status check','Complaint','New order'],answer:0,rationale:'Three tags say what the caller wanted. "Angry caller" says how they sounded, and an angry caller is usually also placing a complaint or chasing an order. Tone belongs on a separate field.'},
  {id:'f1-14',format:1,prompt:'A recruitment team tracks where candidates drop out: "Application", "Phone screen", "Lost to a competitor" and "Onsite interview". Which one would you change?',options:['Application','Lost to a competitor','Onsite interview','Phone screen'],answer:1,rationale:'Three categories name a stage in the process. Losing a candidate to a competitor is a reason for the drop-out, and it happens at one of those three stages. The set answers where and why in the same column, so neither question gets a clean answer.'},
  {id:'f1-15',format:1,prompt:'A restaurant groups its costs as "Ingredients", "Costs that rose this quarter", "Staff wages" and "Rent and utilities". Which one would you change?',options:['Rent and utilities','Ingredients','Costs that rose this quarter','Staff wages'],answer:2,rationale:'Three categories name a kind of cost. The other names a direction of travel, which can apply to any of them. A wage bill that went up appears twice and the total stops adding up.'},
  {id:'f2-01',format:2,prompt:'A bike shop groups its repair jobs into "Brakes", "Gears and shifting" and "Wheels and tyres". Which would you add next?',options:['Puncture repairs','Frame and fork damage','Adjusting brake cable tension','Jobs booked in for same-day service'],answer:1,rationale:'Frame and fork work is a fourth part of the bike, so it takes its own place. A puncture is a wheels and tyres job and cable tension is a brakes job, so both sit one level down. Same-day service is a booking type, not a repair type.'},
  {id:'f2-02',format:2,prompt:'A council groups noise complaints into "Construction sites", "Late-night venues" and "Domestic disputes". Which would you add next?',options:['Neighbours arguing after midnight','Complaints received more than once','Vehicle and traffic noise','Drilling before 7am'],answer:2,rationale:'Traffic noise has a different source from building work, venues or households, so it earns a fourth category. Arguing neighbours are a domestic dispute and early drilling is a construction site, so both are examples rather than categories. Repeat complaints sort on frequency, which is a different question.'},
  {id:'f2-03',format:2,prompt:'A publisher assigns each manuscript rejection to one primary reason: "Weak writing", "Wrong fit for our list" or "Market already saturated". Which would you add next?',options:['Too many similar titles already selling','Prose that needs heavy editing','A genre we do not publish','Submitted without the material we asked for'],answer:3,rationale:'An incomplete submission adds a distinct primary rejection reason alongside writing quality, fit and market saturation. Heavy editing belongs under weak writing, an unpublished genre belongs under wrong fit, and too many similar titles belongs under market saturation.'},
  {id:'f2-04',format:2,prompt:'A clinic assigns each missed outpatient appointment to one primary reason: "Transport problems", "Never received the reminder" or "Symptoms improved so they stayed home". Which would you add next?',options:['Could not get time off work','Patients who miss more than one appointment','The bus route was cancelled','The reminder text went to an old number'],answer:0,rationale:'Work commitments add a distinct primary reason alongside travel, communication and improved symptoms. A cancelled bus route belongs under transport problems and a wrong phone number explains why the reminder was not received. Repeat non-attenders are a patient group, not a reason.'},
  {id:'f2-05',format:2,prompt:'A pet shop groups its stock into "Food", "Toys" and "Bedding". Which would you add next?',options:['Items currently on sale','Grooming and health products','Dry kibble','Chew ropes'],answer:1,rationale:'Grooming and health products are a fourth kind of product. Kibble is food and chew ropes are toys, so both sit inside existing categories. Sale items are a price status that any product can carry.'},
  {id:'f2-06',format:2,prompt:'An accounting firm groups client questions into "Tax filing deadlines", "Allowable expenses" and "Payroll setup". Which would you add next?',options:['Whether a laptop can be claimed','Questions from clients in their first year','Choosing a company structure','When the quarterly return is due'],answer:2,rationale:'Company structure is a separate advisory question from deadlines, expenses or payroll. A laptop claim is an allowable expenses question and a quarterly return date is a deadline question. First-year clients are a client segment, which sorts people rather than questions.'},
  {id:'f2-07',format:2,prompt:'A theatre groups front-of-house incidents into "Ticketing errors", "Accessibility problems" and "Latecomer seating". Which would you add next?',options:['A seat sold twice','A patron arriving after curtain up','The lift being out of service','Bar and refreshment complaints'],answer:3,rationale:'The bar is a fourth front-of-house function with its own failures. A double-sold seat is a ticketing error, a patron arriving late is latecomer seating, and a broken lift is an accessibility problem.'},
  {id:'f2-08',format:2,prompt:'A software company assigns each cancellation to one primary reason: "Price", "Missing features" or "Poor support experience". Which would you add next?',options:['The customer no longer needs the product','An integration we do not offer','A competitor undercut our pricing','Slow replies to support tickets'],answer:0,rationale:'No longer needing the product adds a distinct primary cancellation reason alongside price, features and support. A missing integration belongs under missing features, a competitor undercutting the company belongs under price, and slow replies belong under poor support.'},
  {id:'f2-09',format:2,prompt:'A school groups parent complaints into "Homework load", "Bullying" and "Communication from staff". Which would you add next?',options:['Too many assignments set over the holidays','School meal quality','Newsletters arriving after the event','Complaints sent by email'],answer:1,rationale:'Meal quality is a fourth subject with no home in the current three. Late newsletters are a communication failure and holiday assignments are homework load. Email sorts complaints by channel, which is a separate axis.'},
  {id:'f2-10',format:2,prompt:'A manufacturer groups line stoppages into "Machine faults", "Material shortages" and "Operator absence". Which would you add next?',options:['Components arriving after the scheduled slot','A conveyor motor seizing','Production stopped for a quality inspection','Stoppages lasting more than one hour'],answer:2,rationale:'A required quality inspection can stop production even when the machines, materials and operators are available, so it adds a distinct cause at the same level. A seized motor is a machine fault and late components are a material shortage. Duration classifies how long a stoppage lasted, not what caused it.'},
  {id:'f2-11',format:2,prompt:'A gym assigns each membership cancellation to one primary reason: "Cost", "Location and travel time" or "Not seeing enough progress". Which would you add next?',options:['Members who cancelled in January','Moved to a different city','Found the monthly fee too high','Injury or a change in health'],answer:3,rationale:'Injury or a health change adds a distinct primary reason alongside cost, location and progress. Moving city belongs under location, a high monthly fee belongs under cost, and January classifies when someone cancelled rather than why.'},
  {id:'f2-12',format:2,prompt:'A charity assigns each volunteer departure to one primary reason: "Time commitment", "Travel cost" or "Unclear tasks". Which would you add next?',options:['Not feeling their work mattered','Being given jobs with no instructions','Petrol and fares adding up','Shifts clashing with paid work'],answer:0,rationale:'Not feeling the work mattered adds a distinct purpose-and-impact reason alongside time, travel cost and task clarity. A shift clash belongs under time commitment, jobs without instructions belong under unclear tasks, and petrol and fares belong under travel cost.'},
  {id:'f2-13',format:2,prompt:'A hotel groups housekeeping issues into "Room not cleaned on time", "Missing amenities" and "Damaged linens". Which would you add next?',options:['No shampoo left in the bathroom','Cleaning quality below standard','A room cleaned after the guest arrived','Torn towels put back into service'],answer:1,rationale:'Cleaning quality below standard adds a distinct housekeeping category alongside timing, amenities and linen condition. Cleaning after arrival belongs under timing, missing shampoo belongs under amenities, and torn towels belong under damaged linens.'},
  {id:'f2-14',format:2,prompt:'A bank assigns each fraud alert to its primary triggering signal: "Card used abroad", "Unusually large purchase" or "Several attempts in quick succession". Which would you add next?',options:['A purchase far above the usual amount','A payment made in another country','A first purchase in a merchant type never used before','Three declines within two minutes'],answer:2,rationale:'A first purchase in a new merchant type adds a distinct primary triggering signal alongside location, purchase size and attempt frequency. A payment abroad restates the location trigger, a far-above-usual purchase restates the size trigger, and three declines in two minutes restates the frequency trigger.'},
  {id:'f2-15',format:2,prompt:'A farm shop assigns each supplier problem to one primary category: "Late deliveries", "Short quantities" or "Produce quality below standard". Which would you add next?',options:['Bruised or wilting stock','Crates two units short of the order','Boxes arriving a day after the agreed slot','Invoicing and pricing errors'],answer:3,rationale:'Invoicing and pricing errors add a distinct primary supplier-problem category alongside delivery timing, quantity and produce quality. Bruised stock belongs under quality, a short crate belongs under quantity, and a late box belongs under delivery timing.'},
  {id:'f3-01',format:3,prompt:'A restaurant uses the equation profit = customers × average spend per customer − total costs. It wants to explain why profit fell last quarter. Which headings would you use?',options:['Weekday trade · Weekend trade · Supplier problems','Revenue · Costs · Profitability','Fewer customers · Lower spend per customer · Higher costs','Food costs · Staff costs · Rising prices'],answer:2,rationale:'Fewer customers, lower spend per customer and higher costs are the three distinct drivers in the stated profit equation. Option D breaks the stated equation: food and staff costs are narrower components of total costs, while "rising prices" introduces an ambiguous factor rather than another same-level driver. Profitability is the result, and weekday versus weekend sorts by time while supplier problems sorts by cause.'},
  {id:'f3-02',format:3,prompt:'A school has listed every annual-trip task. Each task concerns getting to and staying at the destination, securing funds and approval, or planning what students will do there. Which headings would you use?',options:['Travel · Buses and trains · Activities on the day','Tasks to do first · Money and permissions · Activities on the day','Travel · Money · Trip planning','Travel and accommodation · Money and permissions · Activities on the day'],answer:3,rationale:'The task list defines three complete workstreams: travel and accommodation, money and permissions, and activities on the day. Buses and trains sit inside travel; "Trip planning" is broader than the other headings; and "Tasks to do first" sorts by timing while its neighbours sort by subject.'},
  {id:'f3-03',format:3,prompt:'A hospital review found that every emergency-department delay arose from demand when patients arrived, capacity to assess and treat them, or delays moving them out of the department. Which headings would you use?',options:['Demand on arrival · Treatment capacity · Discharge flow','Busy periods · Staffing levels · Long waits','Treatment capacity · Nursing shortages · Bed availability','Arrival volume · Time to be seen · Time to be discharged'],answer:0,rationale:'Demand on arrival, treatment capacity and discharge flow match the three complete delay sources defined by the review. The other options mix causes with the result, place narrower items inside broader headings, or use measurements of the wait instead of a consistent set of causes.'},
  {id:'f3-04',format:3,prompt:'A charity shop uses the equation sales revenue = visitors × purchase rate × average amount spent. It wants to raise revenue from the same floor space. Which headings would you use?',options:['Visitor numbers · Purchase rate · Sales performance','Visitor numbers · Purchase rate · Average amount spent','Weekday visitors · Weekend visitors · Average amount spent','Donations received · Items priced · Money raised'],answer:1,rationale:'Visitor numbers, purchase rate and average amount spent are the three distinct inputs in the stated revenue equation, so together they explain all movement in the result. Sales performance and money raised are results, while weekday and weekend visitors split only one input.'},
  {id:'f3-05',format:3,prompt:'A software team compares each release plan with what actually happened. Every delay came from more work being added, planned work taking longer than estimated, or fewer working hours being available. Which headings would you use?',options:['Work took longer than estimated · Optimistic estimates · Scope added','Release delays · Scope added · Delivery capacity lost','Work took longer than estimated · Scope added · Delivery capacity lost','Planning problems · Scope added · Work took longer than estimated'],answer:2,rationale:'Work taking longer than estimated, scope being added and delivery capacity being lost directly match the three complete sources stated in the review. Option A mixes the defined problem, work taking longer than estimated, with one possible explanation for it, optimistic estimates, while omitting lost delivery capacity. Release delays are the result, and planning problems are broader than the other headings.'},
  {id:'f3-06',format:3,prompt:'A council audit found that every missed recycling opportunity occurred because a household did not participate, recyclable material was put in the wrong bin, or collection was unavailable. Which headings would you use?',options:['What residents throw away · Collection availability · Public awareness','Low rates in flats · Sorting errors · Collection availability','Household participation · Households that never recycle · Collection availability','Household participation · Sorting accuracy · Collection availability'],answer:3,rationale:'The audit defines three complete failure points: whether households participate, whether material is sorted correctly, and whether collection is available. Households that never recycle sit inside participation; housing type cuts across the causes; and public awareness can affect both participation and sorting.'},
  {id:'f3-07',format:3,prompt:'A gym codes every six-week cancellation from its exit survey as a motivation or results issue, an access or schedule issue, or an affordability issue. Which headings would you use?',options:['Motivation and results · Access and convenience · Cost','Member experience · Access and convenience · Cost','Attendance drop-off · Access and convenience · Cost','Motivation and results · Losing interest · Cost'],answer:0,rationale:'The survey defines three complete, same-level reason groups: motivation and results, access and convenience, and cost. "Member experience" is broad enough to contain the first two; attendance drop-off is the result; and losing interest sits inside motivation.'},
  {id:'f3-08',format:3,prompt:'A bookshop requires its second-branch proposal to answer three questions: Is there a viable market, will the finances work, and can the branch be operated? Which headings would you use?',options:['Rent in the new area · Financial viability · Staffing capacity','Market demand and competition · Financial viability · Operating capability','Market demand and competition · Set-up costs · Business case','Location · Costs · Risks'],answer:1,rationale:'Market demand and competition, financial viability, and operating capability map directly to the three required questions without overlap. Rent is one part of the finances, "business case" contains all three questions, and location, costs and risks mix specific inputs with cross-cutting concerns.'},
  {id:'f3-09',format:3,prompt:'A manufacturer reviews returns caused by products arriving faulty. Its records show that every fault began in the design, during manufacturing, or during delivery. Which headings would you use?',options:['Design faults · Manufacturing defects · Returns volume','Product faults · Manufacturing defects · Damage in transit','Design faults · Manufacturing defects · Damage in transit','Design faults · Customer complaints · Damage in transit'],answer:2,rationale:'The records define three complete origins for products that arrived faulty: design, manufacturing and transit. "Product faults" contains design and manufacturing; returns volume is the result; and customer complaints are how faults are reported rather than where they began.'},
  {id:'f3-10',format:3,prompt:'A university studies its application funnel. It measures whether prospective students know it exists, whether they see a suitable course, and whether they start and finish the application. Which headings would you use?',options:['Course interest · Application completion · Application numbers','Recruitment performance · Course interest · Awareness','Overseas prospects · Course interest · Application completion','Awareness · Course interest · Application completion'],answer:3,rationale:'Awareness, course interest and application completion match the three measured stages in the stated funnel. Application numbers are the result, recruitment performance contains all three stages, and overseas prospects are one audience segment rather than a funnel stage.'},
  {id:'f3-11',format:3,prompt:'A café reviews closing-time waste each day. Its analysis found every case arose from production above plan, sales below plan when production matched plan, or spoilage before sale, with each case assigned to one primary cause. Which headings would you use?',options:['Production above plan · Sales below plan · Spoilage before sale','Morning waste · Afternoon waste · Spoilage before sale','Production planning · Sales below plan · Kitchen problems','How much is made · How much is sold · How much is wasted'],answer:0,rationale:'Production above plan, sales below plan and spoilage before sale exactly match the three complete primary causes defined by the analysis. Assigning each case to one primary cause prevents overlap. Morning and afternoon sort by time, "kitchen problems" is broader than spoilage, and the final option mixes inputs with the waste result.'},
  {id:'f3-12',format:3,prompt:'A bus operator has confirmed that this year’s fare increase comes only from higher fuel costs, higher staff costs and fewer passenger journeys sharing those costs. Which headings would you use?',options:['Fare increases · Staff costs · Passenger journeys','Fuel costs · Staff costs · Passenger journeys','Fuel costs · Diesel prices · Passenger journeys','Fuel costs · Staff costs · Rising expenses'],answer:1,rationale:'The evidence defines the complete explanation: fuel costs, staff costs and the number of passenger journeys sharing them. Diesel prices sit inside fuel costs, rising expenses contain both cost headings, and fare increases are the result being explained.'},
  {id:'f3-13',format:3,prompt:'A veterinary practice uses an exit survey that places every switch to a rival under cost, ability to get an appointment, or confidence in the care provided. Which headings would you use?',options:['Client satisfaction · Appointment availability · Confidence in care','Clients who left this year · Price · Appointment availability','Price · Appointment availability · Confidence in care','Price · Cost of treatment · Appointment availability'],answer:2,rationale:'Price, appointment availability and confidence in care exactly match the three complete reason groups in the stated survey. Price and cost of treatment repeat one reason, client satisfaction is a broad result influenced by availability and confidence, and clients who left are the population being analysed.'},
  {id:'f3-14',format:3,prompt:'A city review attributes every cyclist injury in its dataset to road design, driver behaviour or cyclist behaviour. Which headings would you use?',options:['Injury numbers · Road design · Driver behaviour','Injuries at junctions · Driver behaviour · Cyclist behaviour','Road design · Junction layouts · Driver behaviour','Road design · Driver behaviour · Cyclist behaviour'],answer:3,rationale:'Road design, driver behaviour and cyclist behaviour are the three complete cause groups defined by the review. Junction layouts sit inside road design, injury numbers are the result, and injuries at junctions classify cases by location while the other headings classify causes.'},
  {id:'f3-15',format:3,prompt:'A supermarket queue model uses three inputs: the number of tills open, the speed of each transaction and the pattern of customer arrivals. Which headings would you use?',options:['Number of tills open · Speed per transaction · Customer arrival pattern','Queues at lunchtime · Speed per transaction · Customer arrival pattern','Number of tills open · Staffing levels · Speed per transaction','Queue length · Speed per transaction · Customer arrival pattern'],answer:0,rationale:'Number of tills open, speed per transaction and customer arrival pattern exactly match the three stated inputs. Staffing levels are an upstream factor that may affect the number of tills open, but they are not one of the three inputs specified in the model. Queue length is a result, and lunchtime queues are one instance of the wider arrival pattern.'},
];

    function spotQuestionPrompt(question){return question.prompt.replace(/Which one would you change\?|Which would you add next\?|Which headings would you use\?$/,SPOT_PROMPT_RULES[question.format])}
    function questionDifficulty(id){return SPOT_DIFFICULTY.accessible.includes(id)?'accessible':SPOT_DIFFICULTY.stretch.includes(id)?'stretch':'core'}
    function spotAssessmentQuestions(){if(contentPreview==='part1b'){state.spot.questionIds=SPOT_QUESTION_BANK.map(question=>question.id);return SPOT_QUESTION_BANK}if(!Array.isArray(state.spot.questionIds)||state.spot.questionIds.length!==15){const byFormat={1:[],2:[],3:[]};SPOT_QUESTION_BANK.forEach(q=>byFormat[q.format].push(q.id));let seen={};try{seen=JSON.parse(localStorage.getItem('utl_tsa_spot_seen')||'{}')}catch(_){}function take(pool,count){const chosen=[];while(chosen.length<count&&pool.length){const idx=Math.floor(Math.random()*pool.length);chosen.push(pool.splice(idx,1)[0])}return chosen}function pick5(ids){const format=SPOT_QUESTION_BANK.find(q=>q.id===ids[0]).format,seenIds=new Set(seen[format]||[]);function candidates(level){const all=ids.filter(id=>questionDifficulty(id)===level),fresh=all.filter(id=>!seenIds.has(id));return [...(fresh.length?fresh:all)]}return[...take(candidates('accessible'),1),...take(candidates('core'),2),...take(candidates('stretch'),2)]}const picked=[...pick5(byFormat[1]),...pick5(byFormat[2]),...pick5(byFormat[3])];for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]]}state.spot.questionIds=picked;picked.forEach(id=>{const format=SPOT_QUESTION_BANK.find(q=>q.id===id).format;seen[format]=Array.from(new Set([...(seen[format]||[]),id]))});try{localStorage.setItem('utl_tsa_spot_seen',JSON.stringify(seen))}catch(_){} }return state.spot.questionIds.map(id=>SPOT_QUESTION_BANK.find(q=>q.id===id))}
    const qs=new URLSearchParams(location.search); const kind=qs.get('assessment')==='checkpoint'?'checkpoint':'diagnostic';
    const contentPreview=['part1a','part1b','part2','part3'].includes(qs.get('contentPreview'))?qs.get('contentPreview'):''; const previewMode=Boolean(contentPreview);
    const STATE_KEY='utl_tsa_unified_'+kind+'_v2'; const RESULT_KEY='utl_result_tsa_'+kind+'_v2'; if(qs.get('reset')==='1')localStorage.removeItem(STATE_KEY);
    const stages=['welcome','organize','spot','speak','act','previewDone','scoring','results'];

    Object.entries(ORGANIZE_RULES).forEach(([formId,rules])=>{FORMS[formId].organize.prompt=`Use these organizing rules: ${rules} Choose the best three labels, then place every task.`});
    const state=previewMode?blank(chooseForm()):load();state.itemTelemetrySyncStatus=state.itemTelemetrySyncStatus||'idle';state.spot.answers=state.spot.answers||{};state.spot.telemetry=state.spot.telemetry||{};state.spot.optionOrders=state.spot.optionOrders||{};state.spot.questionIds=state.spot.questionIds||[];state.spot.correctPositions=state.spot.correctPositions||[];state.spot.part1Answers=state.spot.part1Answers||{};state.spot.part1OptionOrders=state.spot.part1OptionOrders||{};state.spot.part1QuestionIds=state.spot.part1QuestionIds||[];state.spot.part1CorrectPositions=state.spot.part1CorrectPositions||[];state.spot.part=state.spot.part===2?2:1;state.spot.quizIndex=Math.max(0,Math.min(9,Number(state.spot.quizIndex)||0));state.spot.part1Index=Math.max(0,Math.min(4,Number(state.spot.part1Index)||0));if(previewMode)state.stage={part1a:'organize',part1b:'spot',part2:'speak',part3:'act'}[contentPreview];const form=FORMS[state.form]; let recognition=null,mediaRecorder=null,stream=null,timer=null,startAt=0,activeSpotId=null,activeSpotSince=0;
    function seededRandom(seedText){let seed=2166136261;for(const char of seedText){seed^=char.charCodeAt(0);seed=Math.imul(seed,16777619)}return()=>{seed+=0x6D2B79F5;let value=seed;value=Math.imul(value^value>>>15,value|1);value^=value+Math.imul(value^value>>>7,value|61);return((value^value>>>14)>>>0)/4294967296}}
    function mixedOrganizeItems(items,seedText){const random=seededRandom(seedText);for(let attempt=0;attempt<50;attempt++){const mixed=[...items];for(let i=mixed.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[mixed[i],mixed[j]]=[mixed[j],mixed[i]]}const hasThreeTogether=mixed.some((item,i)=>i>1&&item[1]===mixed[i-1][1]&&item[1]===mixed[i-2][1]);if(!hasThreeTogether)return mixed}return[items[0],items[3],items[6],items[1],items[4],items[7],items[2],items[5],items[8]]}

    async function scoreAll(){app.innerHTML='<section class="panel"><div class="loading"><span class="spinner"></span><div><h1 style="margin-bottom:4px">Preparing your TSA profile</h1><p>Reviewing your responses and preparing your results.</p></div></div></section>';const base=deterministic(),rules={speak:{...base.speakDetail},act:{...base.actDetail}},settings={speakGenAiEnabled:false,actGenAiEnabled:false};let ai=null;try{const fb=await import('../../assets/firebase.js');Object.assign(settings,await fb.getTsaScoringSettings())}catch(_){}if(settings.speakGenAiEnabled||settings.actGenAiEnabled){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const res=await fetch('https://us-central1-the-untaught-lessons.cloudfunctions.net/scoreTsaDiagnostic',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({formId:state.form,kind,enabled:{speak:settings.speakGenAiEnabled,act:settings.actGenAiEnabled},speak:state.speak,act:state.act,scenario:{speakFacts:form.speak.facts.map(x=>x[0]+': '+x[1]),actSetup:form.act.setup,actChoices:form.act.choices,actChoice:form.act.choices[state.act.choice],actPushback:form.act.pushback},deterministic:base})});if(res.ok)ai=await res.json()}catch(_){}finally{clearTimeout(timeout)}}const speakAi=settings.speakGenAiEnabled&&validAiSection(ai?.scores?.speak,'speak'),actAi=settings.actGenAiEnabled&&validAiSection(ai?.scores?.act,'act');if(speakAi){base.speak=ai.scores.speak.total;base.speakDetail=ai.scores.speak}if(actAi){base.act=ai.scores.act.total;base.actDetail=ai.scores.act}base.total=Math.round((base.think+base.speak+base.act)*10)/10;if(ai?.feedback)base.ai=ai.feedback;base.scoringSource={speak:speakAi?'genai':'deterministic',act:actAi?'genai':'deterministic'};base.calibration={enabled:{speak:settings.speakGenAiEnabled,act:settings.actGenAiEnabled},deterministic:rules,genAi:{speak:speakAi?ai.scores.speak:null,act:actAi?ai.scores.act:null},difference:{speak:speakAi?Object.fromEntries(['total','leads','supports','focuses'].map(key=>[key,Math.round((ai.scores.speak[key]-rules.speak[key])*10)/10])):null,act:actAi?Object.fromEntries(['total','decides','adapts','advances'].map(key=>[key,Math.round((ai.scores.act[key]-rules.act[key])*10)/10])):null},modelVersion:String(ai?.modelVersion||'')};state.score=base;state.stage='results';state.syncStatus='pending';save();localStorage.setItem(RESULT_KEY,JSON.stringify({assessment:kind,formId:state.form,mode:{speak:state.speak.mode,act:state.act.mode},responses:{organize:state.organize,spot:state.spot,speak:state.speak,act:state.act},scores:base,rubricVersion:state.rubricVersion,completedAt:new Date().toISOString()}));render();complete(base)}
    function completionPayload(score){let pair={};try{pair=JSON.parse(localStorage.getItem('utl_tsa_form_pair')||'{}')}catch(_){}return{completed:true,attemptId:state.attemptId,assessmentKind:kind,assignedForms:pair,formId:state.form,rubricVersion:state.rubricVersion,score:score.total,scores:score,responseMode:{speak:state.speak.mode,act:state.act.mode},duration:{speak:state.speak.duration,act:state.act.duration},responses:{organize:state.organize,spot:state.spot,speak:state.speak,act:state.act},completedAt:new Date().toISOString()}}
    function assessmentItemPayload(score){const completedAt=new Date().toISOString();return{attemptId:state.attemptId,assessment:kind,bankRelease:SPOT_BANK_RELEASE,rubricVersion:state.rubricVersion,formId:state.form,totalScore:score.total,items:spotItemResults(score),completedAt}}
    function showSync(){const e=document.getElementById('syncStatus');if(!e)return;const copy={pending:'Saving your diagnostic response…',saved:'Diagnostic response saved.',failed:'Your result is safe on this device. We will retry saving when you are online.'};e.dataset.state=state.syncStatus;e.textContent=copy[state.syncStatus]||copy.pending}
    async function complete(score){if(!score||(state.syncStatus==='saved'&&state.itemTelemetrySyncStatus==='saved'))return;state.syncStatus=state.syncStatus==='saved'?'saved':'pending';state.itemTelemetrySyncStatus=state.itemTelemetrySyncStatus==='saved'?'saved':'pending';save();showSync();try{const fb=await import('../../assets/firebase.js');if(state.syncStatus!=='saved'){try{await fb.saveUserProgress('tsa-'+kind+'-v2',kind==='checkpoint'?'TSA checkpoint':'TSA diagnostic',completionPayload(score));state.syncStatus='saved'}catch(_){state.syncStatus='failed'}}if(state.itemTelemetrySyncStatus!=='saved'){try{await fb.saveAssessmentItemAttempt(assessmentItemPayload(score));state.itemTelemetrySyncStatus='saved'}catch(_){state.itemTelemetrySyncStatus='failed'}}if(score.calibration&&(score.calibration.enabled.speak||score.calibration.enabled.act)){try{await fb.saveTsaScoringComparison({attemptId:state.attemptId,assessment:kind,formId:state.form,rubricVersion:state.rubricVersion,enabled:score.calibration.enabled,officialSource:score.scoringSource,deterministic:score.calibration.deterministic,genAi:score.calibration.genAi,difference:score.calibration.difference,modelVersion:score.calibration.modelVersion,completedAt:new Date().toISOString()})}catch(_){}}}catch(_){if(state.syncStatus!=='saved')state.syncStatus='failed';if(state.itemTelemetrySyncStatus!=='saved')state.itemTelemetrySyncStatus='failed'}save();showSync();if(!state.rewardAttempted){state.rewardAttempted=true;save();try{await window.UTLRewardEvents?.awardAssessment({assessmentId:kind,title:(kind==='checkpoint'?'Checkpoint':'Diagnostic')+' complete'})}catch(_){}}}
    function results(){const s=state.score||deterministic(),hasSpeakFeedback=Boolean(s.ai?.speakStrength&&s.ai?.speakEvidence&&s.ai.speakEvidence!=='No relevant content found'),hasActFeedback=Boolean(s.ai?.actStrength&&s.ai?.actEvidence&&s.ai.actEvidence!=='No relevant content found');const weakest=[['Think',s.think/40],['Speak',s.speak/30],['Act',s.act/30]].sort((a,b)=>a[1]-b[1])[0][0];const strength=[['Think',s.think/40],['Speak',s.speak/30],['Act',s.act/30]].sort((a,b)=>b[1]-a[1])[0][0];const moves={Think:'Practice grouping information before writing or speaking.',Speak:s.ai?.speakNext||'State the recommendation first, then support it with two or three connected reasons.',Act:s.ai?.actNext||'Name your decision, acknowledge the concern, and give a practical next step.'};const observations={Think:`You earned ${Math.round(s.organize)} of 20 for organizing and ${Math.round(s.spot)} of 20 for spotting structural problems.`,Speak:hasSpeakFeedback?`${esc(s.ai.speakStrength)} Evidence: “${esc(s.ai.speakEvidence)}”`:`Your response earned ${Math.round(s.speakDetail.leads)} for Leads, ${Math.round(s.speakDetail.supports)} for Supports, and ${Math.round(s.speakDetail.focuses)} for Focuses.`,Act:hasActFeedback?`${esc(s.ai.actStrength)} Evidence: “${esc(s.ai.actEvidence)}”`:`Your response earned ${Math.round(s.actDetail.decides)} for Decides, ${Math.round(s.actDetail.adapts)} for Adapts, and ${Math.round(s.actDetail.advances)} for Advances.`};app.innerHTML=`<section class="panel"><div class="score-hero"><p class="eyebrow">Your TSA profile · Form ${state.form}</p><h1>Your provisional TSA snapshot</h1><div class="score-number">${Math.round(s.total)}<span>/100</span></div><p>This is your ${kind==='checkpoint'?'checkpoint':'starting point'}. It is a snapshot of this attempt, not a fixed label. Results are directional while we continue calibrating scoring against real learner responses.</p></div><div class="score-grid"><div class="score-card">Think<strong>${Math.round(s.think)} / 40</strong></div><div class="score-card">Speak<strong>${Math.round(s.speak)} / 30</strong></div><div class="score-card">Act<strong>${Math.round(s.act)} / 30</strong></div></div><div class="feedback-grid"><div class="feedback"><strong>Your strongest area: ${strength}</strong><p>${observations[strength]}</p></div><div class="feedback"><strong>Your next move: ${weakest}</strong><p>${esc(moves[weakest])}</p></div></div>${state.speak.mode==='type'||state.act.mode==='type'?'<p class="ai-label">One or more responses were text-only, so no vocal qualities were scored.</p>':''}<div class="sync-status" id="syncStatus" data-state="${esc(state.syncStatus||'pending')}"></div><div class="actions"><a class="button secondary" href="../../member-login/index.html#learning-journey">Return to Learning Journey</a></div></section>`;showSync()}
    addEventListener('online',()=>{if(state.stage==='results'&&(state.syncStatus!=='saved'||state.itemTelemetrySyncStatus!=='saved'))complete(state.score)});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSpotQuestion();if(document.visibilityState==='visible'&&state.stage==='spot'){const question=spotAssessmentQuestions()[state.spot.index];if(question)activateSpotQuestion(question.id)}if(document.visibilityState==='visible'&&state.stage==='results'&&(state.syncStatus!=='saved'||state.itemTelemetrySyncStatus!=='saved'))complete(state.score)});
    if(qs.get('preview')==='1')window.UTLTsaDiagnosticTest={state,form,deterministic,scoreText};
    render();if(state.stage==='results'&&(state.syncStatus!=='saved'||state.itemTelemetrySyncStatus!=='saved'))complete(state.score);
  })();
