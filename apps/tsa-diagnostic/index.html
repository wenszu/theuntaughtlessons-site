  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap');
    :root{--navy:#003366;--gold:#EEA320;--cream:#F3EDE2;--white:#fff;--ink:#333;--steel:#4D7094;--line:#C7D8E8;--green:#2C7A4B;--soft:#FAF8F3}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Lato,Arial,sans-serif}button,textarea{font:inherit}
    .header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
    .header-in{width:min(1100px,100%);min-height:74px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}.logo{width:165px}.logo img{display:block;width:100%}.divider{width:1px;height:40px;background:#ffffff66}.head-copy{min-width:0}.head-copy small{color:var(--gold)}.head-copy strong{display:block;font:700 25px Playfair Display,serif}.exit{margin-left:auto;color:#fff;text-decoration:none;font-weight:700}
    .progress{background:#fff;border-bottom:1px solid var(--line)}.progress-in{width:min(1100px,100%);margin:auto;padding:10px 22px;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}.progress-copy{color:var(--navy);font-weight:700}.saved{color:var(--steel);font-size:13px}.track{grid-column:1/-1;height:5px;background:#D9E1E8;border-radius:9px;overflow:hidden}.track span{display:block;height:100%;background:var(--gold);transition:width .25s}
    main{width:100%;max-width:1000px;margin:auto;padding:34px 22px 80px}.panel{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:clamp(22px,4vw,42px)}h1,h2,h3{max-width:100%;overflow-wrap:break-word;color:var(--navy);font-family:Playfair Display,serif;margin-top:0}.eyebrow{color:#A26700;font-weight:700;margin:0 0 8px}.lede{font-size:18px;line-height:1.55;max-width:760px}.brief{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;line-height:1.55;margin:20px 0}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.step{min-width:0;padding:14px;border-top:3px solid var(--line);background:var(--soft);color:var(--navy)}.step b{display:block;margin-bottom:4px}.step .substep{display:block}
    .button{border:1px solid var(--gold);border-radius:7px;background:var(--gold);color:var(--navy);min-height:48px;padding:12px 20px;font-weight:700;cursor:pointer}.button.secondary{background:#fff;border-color:var(--navy)}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.notice{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:13px 15px;margin:16px 0;line-height:1.5}.error{color:#8B2E25}.hidden{display:none!important}
    .sort-workspace{display:grid;grid-template-columns:minmax(210px,.72fr) minmax(0,2fr);gap:14px;align-items:stretch;margin-top:18px}.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bucket{min-height:260px;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--soft)}.bucket h3{font:700 16px Lato,sans-serif}.bucket.is-target{border-color:var(--gold);background:#FFF8EC}.place{width:100%;min-height:44px;margin:2px 0 10px;border:1px dashed var(--gold);border-radius:6px;background:#FFF8EC;color:var(--navy);font-weight:700;cursor:pointer}.cards{display:grid;gap:8px}.card{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:7px;padding:12px;text-align:left;cursor:pointer}.card.selected{outline:3px solid #EEA32066;border-color:var(--gold)}.pool{margin:18px 0;padding:14px;border:1px dashed var(--steel);border-radius:9px}.sort-workspace>.pool{margin:0;background:#F8FBFC}.pool h3{font:700 16px Lato,sans-serif}.label-select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:#fff}.spot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;cursor:pointer}.check-card input{width:20px;height:20px;flex:0 0 auto}.instruction-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.instruction-step{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:12px;line-height:1.45}.instruction-step strong{display:block;color:var(--navy);margin-bottom:3px}.move-grid{display:grid;grid-template-columns:minmax(190px,.85fr) repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
    .scenario{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:16px 18px;margin:18px 0;line-height:1.55}.scenario>strong{display:block;color:var(--navy);margin-bottom:8px}.scenario ul{margin-bottom:0;padding-left:20px}.scenario li+li{margin-top:8px}.task{margin:18px 0 8px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#EEF3F7;line-height:1.5}.task strong{display:block;color:var(--navy);margin-bottom:4px}.mode-label{display:block;color:var(--navy);margin:18px 0 7px}.mode{display:inline-flex;gap:0;margin:0 0 18px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:3px}.mode button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--steel);padding:9px 14px;font-weight:700;cursor:pointer}.mode button.active{border-bottom-color:var(--navy);color:var(--navy);background:#EEF3F7}.recorder{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;margin:18px 0}.record-button{width:140px;height:140px;border-radius:50%;border:8px solid #D9E1E8;background:var(--navy);color:#fff;cursor:pointer;font-weight:700;padding:15px}.record-button strong{display:block;font:700 30px Playfair Display,serif;margin-bottom:4px}.record-button.recording{background:#8B2E25}.record-help{line-height:1.55}.transcript{width:100%;min-height:170px;border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.5;resize:vertical}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.metric{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--steel);font-size:14px}
    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid var(--line);background:#fff;border-radius:8px;padding:16px;text-align:left;color:var(--navy);font-weight:700;cursor:pointer}.choice.selected{border-color:var(--gold);background:#FFF8EC}.pushback{border:1px solid var(--line);background:#EEF3F7;border-radius:8px;padding:16px;margin:16px 0}.loading{display:flex;align-items:center;gap:10px;color:var(--steel)}.spinner{width:20px;height:20px;border:3px solid #D9E1E8;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .score-hero{text-align:center;border-bottom:1px solid var(--line);padding-bottom:24px}.score-number{font:700 clamp(62px,12vw,100px) Playfair Display,serif;color:var(--navy)}.score-number span{font:700 24px Lato,sans-serif;color:var(--steel)}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.score-card{border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:8px;padding:18px}.score-card strong{display:block;color:var(--navy);font-size:25px;margin-top:5px}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feedback{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;line-height:1.5}.ai-label{font-size:13px;color:var(--steel)}.sync-status{display:flex;align-items:center;gap:8px;margin-top:18px;padding:11px 13px;border:1px solid var(--line);border-radius:7px;color:var(--steel);background:var(--soft);font-size:14px}.sync-status[data-state="saved"]{color:var(--green);border-color:#BBD8C6}.sync-status[data-state="pending"]::before{content:'';width:13px;height:13px;border:2px solid #D9E1E8;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}.sync-status[data-state="failed"]{color:#8A5A00;border-color:#E5D4B4;background:#FFF8EC}
    @media(max-width:760px){.header-in{padding:10px 14px;gap:10px}.logo{width:100px}.divider{height:34px}.head-copy strong{font-size:19px}.exit{font-size:0}.exit::after{content:'Exit';font-size:13px}.saved{display:none}.progress-in{grid-template-columns:1fr}.steps,.sort-workspace,.spot-list,.move-grid,.choice-grid,.score-grid,.feedback-grid,.instruction-steps{grid-template-columns:1fr}.buckets{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.bucket{flex:0 0 min(82vw,280px);min-height:210px;scroll-snap-align:start}.recorder{grid-template-columns:1fr;text-align:center}.record-button{margin:auto}.panel{padding:20px}.progress-in{padding:9px 14px}main{padding:20px 12px 60px}}
    .place,.card,.label-select{font-family:Lato,Arial,sans-serif;font-size:14px}.place,.card{font-weight:700}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px;color:var(--steel);font-size:14px}.quiz-track{height:6px;border-radius:999px;background:#D9E1E8;overflow:hidden}.quiz-track span{display:block;height:100%;background:var(--gold)}.quiz-question{margin:22px 0 16px;font:700 clamp(23px,3vw,32px) Playfair Display,serif;color:var(--navy);line-height:1.2}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quiz-option{display:flex;align-items:flex-start;gap:10px;min-height:68px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:14px;text-align:left;color:var(--navy);font:700 15px Lato,Arial,sans-serif;cursor:pointer}.quiz-option.selected{border-color:var(--gold);background:#FFF8EC;box-shadow:0 0 0 3px #EEA32026}.quiz-letter{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--steel)}@media(max-width:600px){.quiz-options{grid-template-columns:1fr}.quiz-option{min-height:58px}}
    .challenge-parts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0 22px}.challenge-part{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--soft);color:var(--steel);font-size:14px;font-weight:700}.challenge-part+.challenge-part{border-left:1px solid var(--line)}.challenge-part.current{background:#fff;color:var(--navy);box-shadow:inset 0 -3px var(--gold)}.challenge-part.complete{color:var(--green)}.part-number{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px}.challenge-part.current .part-number{background:#FFF2D3;border-color:var(--gold)}.part-next{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px}.part-next strong{display:block;color:var(--navy);margin-bottom:3px}.part-next p{margin:0;color:var(--steel);font-size:14px}.part-next .button{flex:0 0 auto}.quiz-selection-status{min-height:20px;margin:10px 0 0;color:var(--green);font-size:13px;font-weight:700}@media(max-width:600px){.challenge-parts{grid-template-columns:1fr}.challenge-part+.challenge-part{border-left:0;border-top:1px solid var(--line)}.part-next{display:block}.part-next .button{width:100%;margin-top:12px}}
  </style>

  <header class="header"><div class="header-in"><a class="logo" href="../../member-login/index.html#learning-journey"><img src="../../assets/utl-logo-nav-white.png" alt="The Untaught Lessons"></a><span class="divider"></span><div class="head-copy"><small>Find your level</small><strong>The diagnostic</strong></div><a class="exit" href="../../member-login/index.html#learning-journey">Save and exit</a></div></header>
  <div class="progress"><div class="progress-in"><span class="progress-copy" id="progressCopy">Ready to begin</span><span class="saved" id="savedCopy">Progress saves automatically</span><div class="track"><span id="progressBar" style="width:0"></span></div></div></div>
  <main id="app" aria-live="polite"></main>
  <script src="../../assets/reward-events.js"></script>
  <script>
  (()=>{
    const app=document.getElementById('app');
    const FORMS={
      A:{organize:{title:'Plan a group day out',prompt:'Sort the nine details into three useful groups. First choose a clear label for each group, then place every detail.',labels:['Book now','Decide together','Figure out later','Fun ideas','Important things','Other'],correctLabels:['Book now','Decide together','Figure out later'],items:[['Reserve the train tickets',0],['Confirm the museum time slot',0],['Book a table for lunch',0],['Choose between the museum and aquarium',1],['Agree on the lunch budget',1],['Pick a meeting point',1],['Check the weather forecast',2],['Share emergency contact details',2],['Make a playlist for the journey',2]]},spot:{title:'Make a study plan complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Time','Environment','Support'],items:[['Study at the same time each evening','time-a'],['Keep a regular study schedule','time-a'],['Use short focused sessions','time-b'],['Put the phone in another room','env-a'],['Study somewhere quiet','env-b'],['Ask a friend to quiz you','support-a'],['Get help when a topic stays unclear','support-b'],['Review difficult topics with someone','support-b']],missing:[['Plan breaks before you start',0],['Set a finish time for each study block',0],['Clear the desk before studying',1],['Keep the books you need within reach',1],['Choose whom to ask before you get stuck',2],['Buy new stationery',-1]]},speak:{title:'Choose a location for a community event',facts:[['Library option','Free and easy to reach, but it holds only 45 people.'],['Park option','Holds 100 people and costs nothing, but rain is forecast.'],['Community hall option','Holds 80 people, costs $120, and is indoors.'],['Expected attendance','Around 65 people.']],keywords:[['community hall','hall'],['65','capacity','people'],['rain','indoors','weather']],next:['book','reserve','confirm','check']},act:{title:'A group member has not finished their part',setup:'A shared project is due tomorrow. One person has not completed their section and says they need another two days.',choices:['Redistribute the unfinished work across the group tonight','Request a one-day extension and keep the full scope','Reduce their section and agree on a firm handoff time today'],best:2,pushback:'They reply: “I am already overwhelmed. Why can’t everyone just wait?”',terms:['deadline','tomorrow','handoff','section'],concerns:['overwhelmed','workload','capacity','wait'],next:['send','share','finish','time','today'] }},
      B:{organize:{title:'Prepare for an exam week',prompt:'Sort the nine details into three useful groups. First choose a clear label for each group, then place every detail.',labels:['Do this week','Night before','Skip','School tasks','Helpful ideas','Other'],correctLabels:['Do this week','Night before','Skip'],items:[['Make a one-page topic checklist',0],['Practice two difficult question types',0],['Ask about one unclear topic',0],['Pack pens and identification',1],['Set two alarms',1],['Choose comfortable clothes',1],['Rewrite every page of notes',2],['Learn a brand-new topic at midnight',2],['Compare study hours with friends',2]]},spot:{title:'Make a healthy routine complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Sleep','Movement','Food'],items:[['Go to bed at a regular time','sleep-a'],['Keep the same bedtime most nights','sleep-a'],['Put screens away before bed','sleep-b'],['Walk for twenty minutes','move-a'],['Choose stairs for short trips','move-b'],['Plan simple meals ahead','food-a'],['Keep water nearby','food-b'],['Carry a bottle during the day','food-b']],missing:[['Make the bedroom dark and quiet',0],['Follow the same short bedtime routine',0],['Stretch after sitting for a long time',1],['Choose a form of movement you enjoy',1],['Pack a simple healthy snack',2],['Buy an expensive fitness watch',-1]]},speak:{title:'Set a phone rule for a study group',facts:[['Current interruption rate','Notifications interrupt the group about every seven minutes.'],['Reference needs','Some members need phones to check reference material.'],['Previous full ban','Two members left early the last time phones were completely banned.'],['Session length','The group meets for one focused hour.']],keywords:[['silent','notifications','airplane'],['reference','check','break'],['hour','focus','focused']],next:['agree','try','review','set']},act:{title:'An event now costs more than agreed',setup:'Your group planned a small event with a fixed budget. The venue raises its price by 30% one week before the date.',choices:['Keep the venue and reduce food and decoration costs','Compare a cheaper venue and a smaller version, then ask the group to choose today','Ask attendees to cover the increase before changing the plan'],best:1,pushback:'A friend says: “Changing the plan will make us look disorganized. Just pay the extra cost.”',terms:['budget','cost','venue','30'],concerns:['disorganized','reputation','appearance','change'],next:['compare','choose','today','ask'] }},
      C:{organize:{title:'Move into a new home',prompt:'Sort the nine details into three useful groups. First choose a clear label for each group, then place every detail.',labels:['Before moving','First day','Later','Rooms','Important jobs','Other'],correctLabels:['Before moving','First day','Later'],items:[['Confirm the moving time',0],['Pack a first-night bag',0],['Label the main boxes',0],['Check water and electricity',1],['Set up a place to sleep',1],['Find the nearest grocery store',1],['Choose wall decorations',2],['Organize old photographs',2],['Buy matching storage boxes',2]]},spot:{title:'Make a club project complete',prompt:'Find repeated ideas, then decide which additional ideas complete the structure.',groups:['Purpose','People','Delivery'],items:[['Write one clear project goal','purpose-a'],['State what success should look like','purpose-a'],['Choose the main audience','purpose-b'],['Give each person one owner role','people-a'],['Match tasks to people’s strengths','people-b'],['Set a final due date','delivery-a'],['Check progress every week','delivery-b'],['Hold a weekly progress review','delivery-b']],missing:[['List what the project will not include',0],['Choose evidence that will show the goal was met',0],['Name a backup owner for key work',1],['Agree who makes the final call',1],['Set one midpoint milestone',2],['Design a new club logo',-1]]},speak:{title:'Use a small community fund',facts:[['Available fund','$500.'],['Reading corner','Would serve about 40 children and cost $450.'],['Sports equipment','Would serve about 25 children and cost $300.'],['One-day celebration','Would serve 80 people and cost $500.']],keywords:[['reading','sports','celebration'],['cost','500','450','300'],['children','serve','lasting']],next:['buy','confirm','choose','ask']},act:{title:'Bad weather threatens an outdoor activity',setup:'An outdoor activity for 50 people is tomorrow. Heavy rain is now likely, and the indoor backup space fits only 30.',choices:['Move 30 people indoors, offer a later session, and tell everyone today','Move the entire activity to a later date','Keep the outdoor time but add rain cover and an indoor safety plan'],best:0,pushback:'Someone says: “Splitting the group is inconvenient. We should take the chance and stay outside.”',terms:['rain','indoor','30','50'],concerns:['inconvenient','split','disruption','weather'],next:['tell','move','session','today'] }}
    };
    const SPOT_QUESTION_BANK=[
  {id:'f1-01',format:1,prompt:'A clothing store sorts return requests into "Wrong size," "Changed my mind," "Item arrived damaged," and "Item was damaged when it arrived." What is the single problem with this grouping?',options:['Nothing is wrong, all four are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:1,rationale:'The last two labels are direct restatements of the same condition, so two categories describe the same thing. Neither label contains Wrong size or Changed my mind, so there is no parent category. The prompt supplies no evidence of an unclassified return reason, so a missing category cannot be inferred.'},
  {id:'f1-02',format:1,prompt:'A community garden coordinator tracks volunteer sign-ups under "Watering," "Weeding," and "Harvesting." New volunteers keep asking where to sign up to build the compost bins and raised beds. What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:3,rationale:'Construction tasks like building beds and bins are a real, recurring category of work with no home in the current list. The other three categories are already clearly distinct from each other, so B and C do not fit.'},
  {id:'f1-03',format:1,prompt:'An auto repair shop lists estimate line items under "Parts," "Labor," and "Shop fees." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:0,rationale:'Parts, labor, and shop fees are the standard, non-overlapping cost drivers on a repair estimate, and together they cover the full bill. There is no genuine overlap or missing piece to point to.'},
  {id:'f1-04',format:1,prompt:'A city parks department logs maintenance requests under "Broken playground equipment," "Overgrown grass," and "General upkeep issues." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:2,rationale:'"General upkeep issues" is worded broadly enough to already cover broken equipment and overgrown grass, so it does not stand beside them as a separate, equal category. It needs to be replaced with something narrower, like graffiti or trash removal.'},
  {id:'f1-05',format:1,prompt:'A veterinary clinic books appointments under "Routine checkup," "Vaccination appointment," "Appointment to receive a vaccine," and "Surgery consult." What is the single problem with this grouping?',options:['Nothing is wrong, all four are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:1,rationale:'Vaccination appointment and Appointment to receive a vaccine are direct restatements, so two categories describe the same thing. Neither is broad enough to contain routine checkups or surgery consults. The prompt gives no evidence that a required appointment type is missing.'},
  {id:'f1-06',format:1,prompt:'A high school sorts course registration requests into "Core requirements," "Electives," and "Study hall period." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:0,rationale:'These three categories describe genuinely different parts of a student\'s schedule request, without one containing another or duplicating another. No relabeling or addition is needed.'},
  {id:'f1-07',format:1,prompt:'A nonprofit tracks its fundraising gala budget under "Venue rental," "Catering," and "Entertainment." The event also requires printed invitations, table decorations, and a photographer, and nobody knows which budget line to charge them to. What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:3,rationale:'Invitations, decorations, and a photographer are all real gala expenses with no matching category, so a category such as "Materials and production" is missing. The three existing categories do not overlap with each other, so B and C do not apply.'},
  {id:'f1-08',format:1,prompt:'A warehouse manager tracks stock under "Fast-moving items," "Slow-moving items," and "Inventory issues." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:2,rationale:'"Inventory issues" is vague enough to absorb almost anything, including items that move fast or slow but also have a problem, so it does not sit cleanly beside the other two. It needs to be split into something specific, like "Damaged" or "Miscounted."'},
  {id:'f1-09',format:1,prompt:'A hotel logs guest complaints under "Noise from the room next door," "Sound from the neighboring room," "Slow check-in," and "Housekeeping missed a room." What is the single problem with this grouping?',options:['Nothing is wrong, all four are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:1,rationale:'Noise from the room next door and Sound from the neighboring room are direct restatements, so two categories describe the same thing. Neither contains the check-in or housekeeping categories, and the prompt gives no evidence of a required missing category.'},
  {id:'f1-10',format:1,prompt:'A farmers market sorts vendor applications into "Produce sellers," "Prepared food sellers," and "Craft and goods sellers." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:0,rationale:'These three vendor types describe clearly different kinds of goods being sold, with no overlap and nothing obviously left out for a typical farmers market. The grouping works as written.'},
  {id:'f1-11',format:1,prompt:'A public library organizes its event calendar under "Children\'s story time," "Adult book club," and "Library programs." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:2,rationale:'"Library programs" is broad enough to already include story time and the book club, so it cannot sit next to them as an equal, separate category. A narrower label, like "Teen workshops," would fix the problem.'},
  {id:'f1-12',format:1,prompt:'A daycare center classifies incident reports under "Minor injury," "Behavioral issue," and "Illness." A parent asks how the center logs it when a child is picked up late by an unauthorized adult. What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:3,rationale:'A pickup or custody concern is a real, distinct type of incident that does not fit under injury, behavior, or illness, so a category is missing. The three listed categories do not overlap with each other, so B and C are not the issue.'},
  {id:'f1-13',format:1,prompt:'A gym tracks membership cancellation reasons under "Moving away," "No longer living in the area," "Too expensive," and "Not using it enough." What is the problem with this grouping?',options:['Nothing is wrong, all four are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:1,rationale:'"Moving away" and "No longer living in the area" record the same reason for canceling. Cost and low usage are genuinely separate reasons from each other and from relocation.'},
  {id:'f1-14',format:1,prompt:'A recycling center sorts incoming materials into "Paper and cardboard," "Glass," "Plastic," and "Metal." What is the problem with this grouping?',options:['Nothing is wrong, all four are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:0,rationale:'These four material types are the standard, non-overlapping streams a recycling center sorts, and nothing described in the prompt is left without a home. The grouping is sound.'},
  {id:'f1-15',format:1,prompt:'A construction site logs safety inspection findings under "Electrical hazards," "Fall hazards," and "Site safety concerns." What is the problem with this grouping?',options:['Nothing is wrong, all three are distinct','Two categories describe the same thing','One category is broad enough to include the others','A category is missing entirely'],answer:2,rationale:'"Site safety concerns" is worded broadly enough to already include electrical and fall hazards, so it does not function as a third, equal category. It should be replaced with something specific, like "Equipment hazards."'},
  {id:'f2-01',format:2,prompt:'A coffee shop groups its weekly problems into "Long wait times," "Order mistakes," and "Messy seating area." A manager wants to add a category for the espresso machine breaking down mid-shift. Which of the following completes the set without overlapping the other three?',options:['Equipment failing in the middle of service','A rush of customers slowing everything down','Drinks that don\'t match what was ordered','Tables left dirty between customers'],answer:0,rationale:'A broken machine is a hardware failure, a new cause distinct from pacing, accuracy, or cleanliness. A customer rush is a driver of long waits rather than its own category, mismatched drinks restates order mistakes, and dirty tables restates the seating problem.'},
  {id:'f2-02',format:2,prompt:'A public transit agency groups rider complaints into "Late buses," "Overcrowded buses," and "Rude drivers." The agency wants to add a category for buses arriving with trash and dirt still on the seats. Which of the following completes the set without overlapping the other three?',options:['Buses not sticking to their posted times','Seats and floors left dirty from prior riders','Standing room only during peak hours','Drivers snapping at riders who ask questions'],answer:1,rationale:'Leftover trash and dirt is a maintenance issue distinct from timing, capacity, and driver conduct. Missed schedules restates lateness, standing room during peak hours is one instance of overcrowding rather than a separate category, and snapping at riders restates rude drivers.'},
  {id:'f2-03',format:2,prompt:'An IT helpdesk groups tickets into "Password resets," "Software installation issues," and "Network connectivity problems." The team wants to add a category for a laptop screen that will not turn on. Which of the following completes the set without overlapping the other three?',options:['An app that won\'t finish installing','Wifi dropping in and out of the office','A device that fails to power on or respond','An employee locked out after too many login attempts'],answer:2,rationale:'A dead screen is a physical hardware failure, unrelated to login access, software, or the network. A failed install restates the software category, wifi dropping is one example of a connectivity problem, and being locked out restates password resets.'},
  {id:'f2-04',format:2,prompt:'A school PTA groups its fundraiser volunteer tasks into "Silent auction," "Bake sale table," and "Setting up decorations." Organizers want to add a category for someone to sell raffle tickets throughout the night. Which of the following completes the set without overlapping the other three?',options:['Handling entries for the night\'s prize drawing','Taking bids on donated items','Wrapping up unsold treats at the end of the night','Arranging tables and hanging banners before doors open'],answer:0,rationale:'Selling entries for the prize drawing is a distinct volunteer function from bidding, baking, or decorating. Taking bids restates the auction, packing up leftover treats is a task within the bake sale rather than a new role, and arranging tables restates decorating.'},
  {id:'f2-05',format:2,prompt:'A landscaping company groups its job types into "Lawn mowing," "Tree trimming," and "Garden bed weeding." The owner wants to add a category for clearing driveways after a snowstorm. Which of the following completes the set without overlapping the other three?',options:['Mowing the lawn to an even, tidy height','Removing snow and ice from paved surfaces','Cutting back overgrown branches, including limbs hanging near the driveway','Clearing weeds from garden beds before they spread'],answer:1,rationale:'Snow removal is a seasonal service unrelated to mowing, trimming, or weeding. Trimming overgrown limbs near the driveway still restates tree trimming even though it mentions the driveway, mowing restates the first category, and clearing weeds restates the third.'},
  {id:'f2-06',format:2,prompt:'A public health clinic groups patient concerns into "Billing questions," "Appointment scheduling problems," and "Long wait times in the exam room." Staff want to add a category for patients whose prescription refill never arrived at the pharmacy. Which of the following completes the set without overlapping the other three?',options:['Confusion over what a co-pay should have been','No available appointment slots for weeks','A medication refill that never reached the pharmacy','Waiting well past the scheduled time inside the exam room'],answer:2,rationale:'A missing refill is a distinct medication issue, unrelated to charges, booking, or in-room wait times. A co-pay question is a specific instance within billing rather than a new category, no available slots is a specific instance within scheduling, and waiting past the scheduled time restates the third category.'},
  {id:'f2-07',format:2,prompt:'A moving company groups customer complaints into "Damaged items," "Truck arrived late," and "Movers were rude to the family." The company wants to add a category for boxes that were packed onto the truck but never delivered. Which of the following completes the set without overlapping the other three?',options:['Furniture arriving scratched or dented','The crew showing up hours after the agreed window','Staff being dismissive when the family asked questions','Boxes that were loaded but never arrived at the new home'],answer:3,rationale:'Missing boxes describe a loss, distinct from items arriving damaged, the truck arriving late, or crew behavior. Scratched furniture is one form of damage rather than a new category, showing up late restates the second category, and dismissive staff restates the third.'},
  {id:'f2-08',format:2,prompt:'A city permit office groups requests into "Building permits," "Business licenses," and "Zoning variance requests." Staff want to add a category for residents applying for a permit to park on the street overnight. Which of the following completes the set without overlapping the other three?',options:['Permission to leave a vehicle on the street overnight','Approval to add a room onto an existing house','Registering a new shop to legally open its doors','Asking to use a lot differently than current rules allow'],answer:0,rationale:'An overnight parking permit is a different kind of request from construction, business registration, or zoning approval. Adding a room is a specific example of a building permit rather than a new category, registering a shop restates licensing, and using land differently restates zoning.'},
  {id:'f2-09',format:2,prompt:'An online bookstore groups service tickets into "Wrong book shipped," "Book damaged in shipping," and "Order charged twice." The team wants to add a category for orders that show as delivered but never arrive within two extra weeks. Which of the following completes the set without overlapping the other three?',options:['The wrong edition landing in a customer\'s mailbox','Tracking says delivered, but the package never showed up','A cover arriving torn or creased','A card billed twice for the same order'],answer:1,rationale:'A non-arriving order is a separate shipping failure from sending the wrong title, damage in transit, or a billing error. The wrong edition restates the first category, a torn cover restates damage, and a duplicate charge restates the billing category.'},
  {id:'f2-10',format:2,prompt:'A community theater groups volunteer roles into "Set construction," "Costume design," and "Program ushering." The director wants to add a category for someone to sell and scan tickets before each show. Which of the following completes the set without overlapping the other three?',options:['Painting and assembling pieces of the stage','Fitting cast members for their roles','Checking guests in and scanning them into the theater','Walking latecomers to open seats after the show starts'],answer:2,rationale:'Ticketing is a distinct front-of-house function from building sets, making costumes, or seating the audience. Painting the set restates set construction, fitting costumes restates costume design, and walking in latecomers is one task within ushering rather than a new role.'},
  {id:'f2-11',format:2,prompt:'A dental clinic groups patient feedback into "Long wait in the waiting room," "Confusing insurance billing," and "Front desk was hard to reach by phone." The office manager wants to add a category for patients who report unexpected pain during a cleaning. Which of the following completes the set without overlapping the other three?',options:['Sitting past the scheduled appointment time','Not knowing what a plan will actually cover','Calls going unanswered during business hours','Discomfort felt while a procedure is being performed'],answer:3,rationale:'Pain during treatment is a clinical concern, unrelated to wait times, billing clarity, or phone access. Sitting past the scheduled time restates the wait category, not knowing coverage restates billing, and unanswered calls restates the phone category.'},
  {id:'f2-12',format:2,prompt:'A manufacturing plant groups quality control defects into "Dimensional errors," "Surface scratches," and "Incorrect color." The quality team wants to add a category for units shipped without a required bracket attached. Which of the following completes the set without overlapping the other three?',options:['A required part left off the finished unit','A part measuring a few millimeters outside spec','Marks left on the surface during handling','The wrong shade of paint applied to a batch'],answer:0,rationale:'A missing bracket is a different defect type, an absent component, from a sizing error, a surface flaw, or a color mistake. A part measuring outside spec is a specific instance of a dimensional error rather than a new category, handling marks restates scratches, and the wrong shade restates the color category.'},
  {id:'f2-13',format:2,prompt:'A nonprofit blood donation drive groups volunteer roles into "Donor registration," "Snack table after donating," and "Directing donors to the right chair." Organizers want to add a category for someone to watch donors for a few minutes after they give blood in case they feel dizzy. Which of the following completes the set without overlapping the other three?',options:['Confirming a donor is eligible before they begin','Staying nearby in case a donor feels faint afterward','Offering juice and cookies once donation is finished','Pointing each donor toward an open chair'],answer:1,rationale:'Post-donation monitoring is a safety role, separate from registration, refreshments, or seating. Confirming eligibility restates registration, offering refreshments restates the snack table role, and pointing donors to chairs restates the directing role.'},
  {id:'f2-14',format:2,prompt:'A pet grooming salon groups customer complaints into "Appointment ran long," "Groomer was rough with my pet," and "Wrong haircut style given." The owner wants to add a category for customers disputing the price charged after pickup. Which of the following completes the set without overlapping the other three?',options:['Pickup happening well after the promised time','A pet flinching or seeming distressed during the visit','The amount charged not matching what was expected','A cut that doesn\'t resemble the style that was requested'],answer:2,rationale:'A price dispute is a billing concern, different from timing, handling, or the finished cut. Pickup running late restates the first category, a distressed pet restates rough handling, and a mismatched cut restates the style category.'},
  {id:'f2-15',format:2,prompt:'A print shop groups order problems into "Wrong paper color," "Text cut off in printing," and "Order billed at the wrong price." The manager wants to add a category for orders that are finished correctly but picked up two days after the promised date. Which of the following completes the set without overlapping the other three?',options:['A job printed on the incorrect stock color','Margins trimming off part of the printed page','An invoice that doesn\'t match the amount quoted','A completed order sitting past its promised pickup date'],answer:3,rationale:'A late pickup is a timing problem, separate from a paper color mistake, a printing error, or a billing mistake. Incorrect stock restates the paper category, trimmed margins restates the printing error, and a mismatched invoice restates the billing category.'},
  {id:'f3-01',format:3,prompt:'A nonprofit annual report needs a home for its income and expenses, the number and profile of people reached, and a short account of why the organization exists. Which set of headings creates three distinct, complete sections?',options:['Finances · People served · Organization background','Finances · Fundraising results · Money spent','Nonprofit information · People served · Organization background','Donors thanked · People served · Total impact'],answer:0,rationale:'Finances covers income and expenses, People served covers reach, and Organization background covers purpose. Option B divides one financial topic into overlapping sections and omits reach and purpose. Option C overlaps because Nonprofit information can include the organization background. Option D does not provide a home for expenses or organizational history.'},
  {id:'f3-02',format:3,prompt:'A software support team must sort these tickets: a button no longer works, a customer wants an export tool that does not exist, and an invoice shows an unexpected fee. Which set of headings gives each ticket one clear home?',options:['Product problems · Software issues · Billing questions','Bug reports · Feature requests · Billing questions','Bug reports · Feature requests · Account problems','Slow response times · Feature requests · Billing questions'],answer:1,rationale:'The broken button is a bug, the nonexistent export tool is a feature request, and the fee belongs under billing. Option A overlaps because Product problems and Software issues both fit the broken button. Option C leaves the invoice issue without a precise home. Option D has no category for broken functionality.'},
  {id:'f3-03',format:3,prompt:'A wedding plan must organize booking the reception meal, confirming who will attend, and arranging clothes and photographs. Which set of headings gives every task one clear home without using a catch-all category?',options:['Venue and catering · Wedding logistics · Attire and photography','Venue planning · Guest planning · Attire planning','Venue and catering · Guests and invitations · Attire and photography','Stressful tasks · Guests and invitations · Attire and photography'],answer:2,rationale:'Option C covers the reception and meal, attendance and invitations, and clothes and photography as three distinct workstreams. Wedding logistics in Option A is a catch-all that overlaps the other headings. Option B omits catering, invitations, and photography. Stressful tasks in Option D is subjective and can overlap every workstream.'},
  {id:'f3-04',format:3,prompt:'A cafeteria compares menu ideas using nutrient content, cost per serving, and student taste-test ratings. Which set of headings keeps those three measures separate and covers all of them?',options:['Nutrition · Cost · Student preference','Nutrition · Ingredient sourcing · Cost','Food quality · Cost · Student preference','Nutrition · Cost · Plate waste'],answer:0,rationale:'Nutrition, Cost, and Student preference each correspond to one stated measure. Ingredient sourcing does not cover taste-test ratings. Food quality overlaps both nutrition and preference. Plate waste is an outcome that does not directly organize the taste-test ratings.'},
  {id:'f3-05',format:3,prompt:'A tutoring coordinator compares the class where help is needed, the times both people are free, and notes from short introductory conversations. Which set of headings gives each input one distinct place?',options:['Subject need · Tutor qualifications · Personality fit','Subject need · Schedule availability · Personality fit','Matching criteria · Schedule availability · Personality fit','Subject need · Schedule availability · Session length'],answer:1,rationale:'The class maps to Subject need, shared free times to Schedule availability, and introductory-conversation notes to Personality fit. Tutor qualifications does not cover availability. Matching criteria is a parent category that contains the other headings. Session length is not one of the stated inputs.'},
  {id:'f3-06',format:3,prompt:'A bike-share team receives reports of failed brakes and gears, deliberate damage, and electric bikes that will not hold a charge. Which set of headings gives every report one clear home?',options:['Broken gears · Mechanical issues · Battery and charging problems','Bike condition problems · Vandalism · Battery and charging problems','Mechanical issues · Vandalism · Battery and charging problems','Mechanical issues · Vandalism · Bikes out of service'],answer:2,rationale:'Mechanical issues covers brakes and gears, Vandalism covers deliberate damage, and Battery and charging problems covers failed batteries. Option A overlaps because broken gears are mechanical issues. Bike condition problems in Option B is broad enough to overlap the other two. Bikes out of service in Option D is a status that can result from any problem.'},
  {id:'f3-07',format:3,prompt:'A local newspaper reviews cancellation notes such as “the monthly fee is too high,” “the articles are no longer useful to me,” and “my newspaper often arrives late or does not arrive.” Which set of headings gives every reason one clear home?',options:['Price · Too expensive · Delivery reliability','Subscriber satisfaction · Content and value · Delivery reliability','Price · Content and value · Missed deliveries','Price · Content and value · Delivery reliability'],answer:3,rationale:'Price covers the fee, Content and value covers the articles, and Delivery reliability covers both late and missing newspapers. Option A duplicates the same price reason and omits content. Subscriber satisfaction in Option B is a parent category that could contain all three. Missed deliveries in Option C is too narrow because it excludes late deliveries.'},
  {id:'f3-08',format:3,prompt:'A brewery batch record must store the grain and hops used, temperatures and timing during production, and the bottle or keg details after production. Which set of headings creates three distinct stages?',options:['Ingredients · Brewing process · Packaging','Ingredients · Grain and hops sourcing · Packaging','Ingredients · Production quality · Packaging','Ingredients · Brewing process · Customer complaints'],answer:0,rationale:'Ingredients, Brewing process, and Packaging map to inputs, production, and finished-product packing. Option B splits ingredients into overlapping headings and omits production. Production quality can include both ingredient and process checks, so Option C overlaps. Customer complaints in Option D is not a production stage.'},
  {id:'f3-09',format:3,prompt:'A museum compares exhibit proposals using the money required, survey evidence of likely attendance, and confirmation that lenders can provide the objects. Which set of headings gives each decision factor one clear home?',options:['Exhibit planning · Visitor interest · Artifact availability','Budget · Visitor interest · Artifact availability','Budget · Funding available · Artifact availability','Budget · Visitor interest · Low attendance risk'],answer:1,rationale:'Budget covers required money, Visitor interest covers attendance evidence, and Artifact availability covers lender confirmation. Exhibit planning in Option A is a parent category that can include the other headings. Budget and Funding available overlap in Option C. Low attendance risk is an interpretation of visitor interest and leaves artifact availability uncovered.'},
  {id:'f3-10',format:3,prompt:'A kitchen-renovation file must organize drawings and permit approvals, purchases and contractor hours, and start dates and deadlines. Which set of headings gives every item one distinct place?',options:['Design and permits · Approvals needed · Materials and labor','Renovation planning · Materials and labor · Timeline','Design and permits · Materials and labor · Timeline','Design and permits · Materials and labor · Contractor delays'],answer:2,rationale:'Design and permits covers drawings and approvals, Materials and labor covers purchases and hours, and Timeline covers dates and deadlines. Option A overlaps permits with approvals and omits timing. Renovation planning is a parent heading that can contain the other two in Option B. Contractor delays is too narrow to hold all dates and deadlines in Option D.'},
  {id:'f3-11',format:3,prompt:'A vehicle-service report includes scheduled oil changes, manufacturer-covered repairs, and optional accessories requested by owners. Which set of headings gives each job one clear home?',options:['Service work · Warranty repairs · Customer-requested upgrades','Routine maintenance · Oil changes · Customer-requested upgrades','Routine maintenance · Warranty repairs · Repeat visits','Routine maintenance · Warranty repairs · Customer-requested upgrades'],answer:3,rationale:'Routine maintenance covers scheduled oil changes, Warranty repairs covers manufacturer-paid work, and Customer-requested upgrades covers optional accessories. Service work in Option A is a parent category that overlaps the other headings. Option B duplicates oil changes within routine work and omits warranty repairs. Repeat visits is not a type of service job.'},
  {id:'f3-12',format:3,prompt:'A freight company codes delay reports for storms that close roads, trucks that break down, and customs forms that are incomplete. Which set of headings separates the three causes?',options:['Weather · Vehicle breakdowns · Customs and paperwork','Shipping problems · Mechanical breakdowns · Customs and paperwork','Weather · Mechanical breakdowns · Vehicle problems','Weather · Mechanical breakdowns · Late deliveries'],answer:0,rationale:'Weather covers storms, Vehicle breakdowns covers truck failures, and Customs and paperwork covers incomplete forms. Shipping problems in Option B is a parent category that can include every delay. Mechanical breakdowns and Vehicle problems overlap in Option C. Late deliveries in Option D is the result being explained, not a cause.'},
  {id:'f3-13',format:3,prompt:'A university purchase form asks for the quoted amount, proof that laboratory rules are met, and an explanation of why the research requires the equipment. Which set of headings gives each requirement one clear home?',options:['Cost · Budget impact · Safety compliance','Cost · Safety compliance · Research justification','Equipment review · Safety compliance · Research justification','Cost · Safety compliance · Delayed research timelines'],answer:1,rationale:'Cost holds the quote, Safety compliance holds proof of meeting rules, and Research justification holds the explanation of need. Cost and Budget impact overlap in Option A. Equipment review in Option C is a parent category that includes all requirements. Delayed timelines in Option D are a possible consequence, not the requested justification.'},
  {id:'f3-14',format:3,prompt:'Open-house comments mention whether the asking amount feels fair, repairs the property needs, and access to nearby schools and transport. Which set of headings gives every comment one clear home?',options:['Price feedback · Overpriced · Neighborhood','Buyer impressions · Home condition · Neighborhood','Price feedback · Home condition · Neighborhood','Price feedback · Home condition · Offers received'],answer:2,rationale:'Price feedback covers fairness of the asking amount, Home condition covers repairs, and Neighborhood covers schools and transport. Price feedback and Overpriced overlap in Option A. Buyer impressions is a parent category that could contain all comments in Option B. Offers received in Option D does not cover neighborhood comments.'},
  {id:'f3-15',format:3,prompt:'A fire department maintenance log records scheduled checks, damage found after equipment is used, and gear removed because it has reached its service-life limit. Which set of headings gives every record one clear home?',options:['Equipment care · Post-use repairs · Age-related replacement','Routine inspections · Hose and ladder checks · Age-related replacement','Routine inspections · Post-use repairs · Equipment failures','Routine inspections · Post-use repairs · Age-related replacement'],answer:3,rationale:'Routine inspections covers scheduled checks, Post-use repairs covers damage after use, and Age-related replacement covers service-life retirement. Equipment care in Option A is a parent category that overlaps the other headings. Hose and ladder checks are examples of routine inspections in Option B. Equipment failures in Option C can occur during any stage and does not specifically cover age-based replacement.'}
