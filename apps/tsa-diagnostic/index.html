    const SPOT_DIFFICULTY={accessible:['f1-03','f1-06','f1-10','f2-01','f2-02','f2-03','f3-02','f3-04','f3-12'],stretch:['f1-02','f1-04','f1-08','f1-11','f1-15','f2-08','f2-10','f2-12','f2-14','f2-15','f3-01','f3-03','f3-05','f3-09','f3-13']};
    function questionDifficulty(id){return SPOT_DIFFICULTY.accessible.includes(id)?'accessible':SPOT_DIFFICULTY.stretch.includes(id)?'stretch':'core'}
    function spotAssessmentQuestions(){if(!Array.isArray(state.spot.questionIds)||state.spot.questionIds.length!==15){const byFormat={1:[],2:[],3:[]};SPOT_QUESTION_BANK.forEach(q=>byFormat[q.format].push(q.id));let seen={};try{seen=JSON.parse(localStorage.getItem('utl_tsa_spot_seen')||'{}')}catch(_){}function take(pool,count){const chosen=[];while(chosen.length<count&&pool.length){const idx=Math.floor(Math.random()*pool.length);chosen.push(pool.splice(idx,1)[0])}return chosen}function pick5(ids){const format=SPOT_QUESTION_BANK.find(q=>q.id===ids[0]).format,seenIds=new Set(seen[format]||[]);function candidates(level){const all=ids.filter(id=>questionDifficulty(id)===level),fresh=all.filter(id=>!seenIds.has(id));return [...(fresh.length?fresh:all)]}return[...take(candidates('accessible'),1),...take(candidates('core'),2),...take(candidates('stretch'),2)]}const picked=[...pick5(byFormat[1]),...pick5(byFormat[2]),...pick5(byFormat[3])];for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]]}state.spot.questionIds=picked;picked.forEach(id=>{const format=SPOT_QUESTION_BANK.find(q=>q.id===id).format;seen[format]=Array.from(new Set([...(seen[format]||[]),id]))});try{localStorage.setItem('utl_tsa_spot_seen',JSON.stringify(seen))}catch(_){}}return state.spot.questionIds.map(id=>SPOT_QUESTION_BANK.find(q=>q.id===id))}
    const qs=new URLSearchParams(location.search); const kind=qs.get('assessment')==='checkpoint'?'checkpoint':'diagnostic';
    const STATE_KEY='utl_tsa_unified_'+kind+'_v2'; const RESULT_KEY='utl_result_tsa_'+kind+'_v2'; if(qs.get('reset')==='1')localStorage.removeItem(STATE_KEY);
    const stages=['welcome','organize','spot','speak','act','scoring','results'];
    const state=load();state.spot.answers=state.spot.answers||{};state.spot.optionOrders=state.spot.optionOrders||{};state.spot.questionIds=state.spot.questionIds||[];state.spot.correctPositions=state.spot.correctPositions||[];state.spot.part1Answers=state.spot.part1Answers||{};state.spot.part1OptionOrders=state.spot.part1OptionOrders||{};state.spot.part1QuestionIds=state.spot.part1QuestionIds||[];state.spot.part1CorrectPositions=state.spot.part1CorrectPositions||[];state.spot.part=state.spot.part===2?2:1;state.spot.quizIndex=Math.max(0,Math.min(9,Number(state.spot.quizIndex)||0));state.spot.part1Index=Math.max(0,Math.min(4,Number(state.spot.part1Index)||0));const form=FORMS[state.form]; let recognition=null,mediaRecorder=null,stream=null,timer=null,startAt=0;
    function chooseForm(){const forced=(qs.get('form')||'').toUpperCase(),canForce=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||qs.get('preview')==='1';if(canForce&&FORMS[forced])return forced;let pair={};try{pair=JSON.parse(localStorage.getItem('utl_tsa_form_pair')||'{}')}catch(_){}if(pair[kind]&&FORMS[pair[kind]])return pair[kind];if(kind==='checkpoint'&&pair.diagnostic){pair.checkpoint={A:'B',B:'C',C:'A'}[pair.diagnostic]}else pair.diagnostic=['A','B','C'][Math.floor(Math.random()*3)];localStorage.setItem('utl_tsa_form_pair',JSON.stringify(pair));return pair[kind]||pair.diagnostic}
    function blank(picked){return{version:2,attemptId:(crypto.randomUUID?crypto.randomUUID():'tsa-'+Date.now()+'-'+Math.random().toString(36).slice(2)),rubricVersion:'tsa-unified-20260811-mc10',kind,form:picked||chooseForm(),stage:'welcome',organize:{labels:['','',''],placements:{}},spot:{questionIds:[],answers:{},index:0},speak:{mode:'record',transcript:'',duration:0},act:{choice:null,mode:'record',transcript:'',duration:0},score:null,syncStatus:'idle',rewardAttempted:false,updatedAt:new Date().toISOString()}}
    function load(){try{const saved=JSON.parse(localStorage.getItem(STATE_KEY)||'null');return saved&&FORMS[saved.form]&&saved.rubricVersion==='tsa-unified-20260811-mc10'?Object.assign(blank(saved.form),saved):blank(saved?.form)}catch(_){return blank()}}
    function save(){state.updatedAt=new Date().toISOString();localStorage.setItem(STATE_KEY,JSON.stringify(state));document.getElementById('savedCopy').textContent='Saved';setTimeout(()=>{const e=document.getElementById('savedCopy');if(e)e.textContent='Progress saves automatically'},900)}
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setProgress(){const i=stages.indexOf(state.stage),pct=state.stage==='results'?100:Math.max(0,(i-0.4)/5*100);document.getElementById('progressBar').style.width=pct+'%';const names={welcome:'Ready to begin',organize:'Part 1a of 3 · Organize information',spot:'Part 1b of 3 · Test the structure',speak:'Part 2 of 3 · Speak concisely',act:'Part 3 of 3 · Act with judgment',scoring:'Preparing your results',results:'Diagnostic complete'};document.getElementById('progressCopy').textContent=names[state.stage]}
    function render(){stopMedia();setProgress();({welcome:welcome,organize:organize,spot:spotQuizVisible,speak:()=>delivery('speak'),act:()=>delivery('act'),scoring:scoreAll,results:results}[state.stage]||welcome)();if(state.stage==='results'){const label=document.querySelector('.score-hero .eyebrow');if(label)label.textContent='Your TSA profile'}scrollTo({top:0,behavior:'smooth'})}
    function go(stage){state.stage=stage;save();render()}
    function welcome(){const label=kind==='checkpoint'?'Checkpoint · after the program':'Diagnostic · before the program';app.innerHTML=`<section class="panel"><p class="eyebrow">${label}</p><h1>See how you Think, Speak, and Act.</h1><p class="lede">Complete four short challenges in one sitting. ${kind==='checkpoint'?'This is your post-program comparison. It uses the same skills and scoring as the diagnostic, with a different scenario set.':'This is your starting baseline before the program.'} It is not a pass or fail test. Most people finish in 12 to 15 minutes.</p><div class="brief"><strong>Your progress saves automatically.</strong> The Speak and Act challenges let you record in this browser or type what you would say. The microphone is optional and is requested only if you press Record. Your responses and transcript are saved with your progress so they can be scored and the assessment can be improved. If AI feedback is unavailable, the same measurable rules will score your work and you can still finish normally.</div><div class="steps"><div class="step"><b>1 · Think</b><span class="substep">1a. Organize information</span><span class="substep">1b. Test the structure</span></div><div class="step"><b>2 · Speak</b>Give a recommendation</div><div class="step"><b>3 · Act</b>Respond to pushback</div></div><div class="actions"><button class="button" id="start">Start the ${kind}</button></div></section>`;start.onclick=()=>go('organize')}
    function organize(){const o=form.organize;const placed=[[],[],[]];Object.entries(state.organize.placements).forEach(([i,b])=>placed[b]?.push(+i));const unplaced=o.items.map((_,i)=>i).filter(i=>state.organize.placements[i]===undefined);app.innerHTML=`<section class="panel"><p class="eyebrow">Part 1a of 3 · Think</p><h1>${o.title}</h1><p class="lede">${o.prompt}</p><div class="notice" id="selectionCue">${state.selected===undefined?'Select a source item, then choose “Place selected item here” in the right bucket. Select a placed item to move it again.':'Selected: <strong>'+esc(o.items[state.selected][0])+'</strong>. Now choose a bucket.'}</div><div class="sort-workspace"><div class="pool"><h3>Source items · ${unplaced.length} remaining</h3><div class="cards">${unplaced.map(cardHtml).join('')||'<span>Everything has been placed.</span>'}</div></div><div class="buckets">${placed.map((list,b)=>`<section class="bucket"><select class="label-select" data-label="${b}" aria-label="Label for group ${b+1}"><option value="">Choose a bucket label</option>${o.labels.map(x=>`<option ${state.organize.labels[b]===x?'selected':''} ${state.organize.labels.some((v,i)=>i!==b&&v===x)?'disabled':''}>${esc(x)}</option>`).join('')}</select><button class="place" data-bucket="${b}" ${state.selected===undefined?'disabled':''}>Place selected item here</button><div class="cards">${list.map(cardHtml).join('')}</div></section>`).join('')}</div></div><div class="actions"><button class="button" id="next" ${unplaced.length||state.organize.labels.some(x=>!x)?'disabled':''}>Continue</button></div></section>`;bindCards();document.querySelectorAll('[data-label]').forEach(x=>x.onchange=()=>{state.organize.labels[+x.dataset.label]=x.value;save();organize()});next.onclick=()=>go('spot')}
    function cardHtml(i){const item=form.organize.items[i];return `<button class="card ${state.selected===i?'selected':''}" data-card="${i}">${esc(item[0])}</button>`}
    function bindCards(){document.querySelectorAll('[data-card]').forEach(x=>x.onclick=()=>{state.selected=+x.dataset.card;save();organize()});document.querySelectorAll('[data-bucket]').forEach(x=>x.onclick=()=>{if(state.selected===undefined)return;state.organize.placements[state.selected]=+x.dataset.bucket;delete state.selected;save();organize()})}
    function spotQuizVisible(){const questions=spotAssessmentQuestions(),i=state.spot.index,q=questions[i],answer=state.spot.answers[q.id],typeLabel={1:'Diagnose the grouping',2:'Complete the grouping',3:'Build the headings'}[q.format];save();app.innerHTML=`<section class="panel"><p class="eyebrow">Part 1b of 3 · Think</p><h1>Test the structure</h1><p class="lede">You will see three kinds of question in mixed order: diagnose a grouping, complete a grouping, and build a set of headings. Use only the information given. Every question has exactly one correct answer; “none of the above” is never the answer.</p><div class="quiz-head"><strong>Question ${i+1} of ${questions.length} · ${typeLabel}</strong><span>${Object.keys(state.spot.answers).filter(id=>questions.some(item=>item.id===id)).length} answered</span></div><div class="quiz-track" aria-hidden="true"><span style="width:${(i+1)/questions.length*100}%"></span></div><div class="quiz-question">${esc(q.prompt)}</div><div class="quiz-options">${q.options.map((option,n)=>`<button class="quiz-option ${answer===n?'selected':''}" data-quiz-answer="${n}" aria-pressed="${answer===n}"><span class="quiz-letter">${String.fromCharCode(65+n)}</span><span>${esc(option)}</span></button>`).join('')}</div><p class="quiz-selection-status" id="quizSelectionStatus" aria-live="polite">${answer===undefined?'':'Answer selected. You can change it or continue.'}</p><div class="actions">${i?'<button class="button secondary" id="quizBack" type="button">Previous</button>':''}<button class="button" id="quizNext" type="button" ${answer===undefined?'disabled':''}>${i===questions.length-1?'Continue to Part 2':'Next question'}</button></div></section>`;const next=document.getElementById('quizNext');document.querySelectorAll('[data-quiz-answer]').forEach(button=>button.onclick=()=>{const chosen=+button.dataset.quizAnswer;state.spot.answers[q.id]=chosen;save();document.querySelectorAll('[data-quiz-answer]').forEach(option=>{const active=+option.dataset.quizAnswer===chosen;option.classList.toggle('selected',active);option.setAttribute('aria-pressed',String(active))});document.getElementById('quizSelectionStatus').textContent='Answer selected. You can change it or continue.';next.disabled=false;next.focus()});const back=document.getElementById('quizBack');if(back)back.onclick=()=>{state.spot.index=i-1;save();spotQuizVisible();scrollTo({top:0,behavior:'smooth'})};next.onclick=()=>{if(state.spot.answers[q.id]===undefined)return;if(i<questions.length-1){state.spot.index=i+1;save();spotQuizVisible();scrollTo({top:0,behavior:'smooth'})}else go('speak')}}
    addEventListener('pagehide',()=>{if(state.speak.recording||state.act.recording){state.speak.recording=false;state.act.recording=false;save()}stopMedia()});
    function count(t){return String(t||'').trim().split(/\s+/).filter(Boolean).length}function format(n){return '0:'+String(Math.max(0,n)).padStart(2,'0')}
    function contains(text,terms){const t=text.toLowerCase();return terms.some(x=>t.includes(x))}
    function validAi(value){const keys=['speakEvidence','actEvidence','speakStrength','speakNext','actStrength','actNext'];return value&&value.fallback!==true&&keys.every(k=>typeof value[k]==='string'&&value[k].trim()&&value[k].length<=500)}
    function delivery(type){const d=state[type],data=form[type],isAct=type==='act',minimum=isAct?15:25,ready=count(d.transcript)>=minimum;const response=isAct&&d.choice===null?'':`<strong class="mode-label">Choose how to give your answer</strong><div class="mode" role="group" aria-label="Response method"><button data-mode="record" aria-pressed="${d.mode==='record'}" class="${d.mode==='record'?'active':''}">Use microphone</button><button data-mode="type" aria-pressed="${d.mode==='type'}" class="${d.mode==='type'?'active':''}">Type my response</button></div>${d.mode==='record'?recordUi(type):typeUi(type)}<p class="ai-label">Write or say at least ${minimum} words so there is enough evidence to score.</p><div class="actions"><button class="button" id="next" ${ready?'':'disabled'}>${isAct?'Finish and see my results':'Continue'}</button></div>`;app.innerHTML=`<section class="panel"><p class="eyebrow">Part ${isAct?'3':'2'} of 3 · ${isAct?'Act':'Speak'}</p>${isAct?`<h1>${data.title}</h1><div class="scenario"><strong>Situation</strong><p>${esc(data.setup)}</p></div><p class="lede">Choose what you would do first.</p><div class="choice-grid">${data.choices.map((c,i)=>`<button class="choice ${d.choice===i?'selected':''}" data-choice="${i}">${esc(c)}</button>`).join('')}</div>${d.choice!==null?`<div class="pushback"><strong>Now respond to this pushback:</strong><p>${esc(data.pushback)}</p><p>State your decision, respond to the concern, and explain what happens next. You have up to 45 seconds.</p></div>`:''}`:`<h1>Give a clear recommendation</h1><div class="scenario"><strong>Situation · ${esc(data.title)}</strong><ul>${data.facts.map(x=>`<li><strong>${esc(x[0])}:</strong> ${esc(x[1])}</li>`).join('')}</ul></div><div class="task"><strong>Your task</strong>Recommend one option. Give two or three reasons based on the information above, then state a clear next step. You have up to 60 seconds.</div>`}${response}</section>`;document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{if(d.recording)stopRecording(type,false);d.mode=x.dataset.mode;d.recording=false;stopMedia();save();delivery(type)});document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{if(d.recording)stopRecording(type,false);d.choice=+x.dataset.choice;d.recording=false;stopMedia();save();delivery(type)});bindDelivery(type);const next=document.getElementById('next');if(next)next.onclick=()=>go(isAct?'scoring':'act')}
    function recordUi(type){const d=state[type],limit=type==='speak'?60:45;return `<div class="recorder"><button class="record-button" id="record"><strong id="clock">${format(d.duration||limit)}</strong><span>${d.recording?'Stop recording':d.transcript?'Record again':'Start recording'}</span></button><div class="record-help"><strong>Your words will appear below as you speak.</strong><p>Your audio stays in this browser. You can review and correct obvious transcription errors before continuing.</p><div id="recordStatus" class="ai-label">Microphone permission is requested only when you press Start.</div></div></div><label><strong>Transcript</strong><textarea class="transcript" id="transcript" placeholder="Your transcript will appear here.">${esc(d.transcript)}</textarea></label>${metrics(type)}`}
    function typeUi(type){return `<div class="notice"><strong>Written response selected.</strong> Type the answer you would give aloud. The assessment scores the content of this response; it does not score vocal delivery.</div><label><strong>Your response</strong><textarea class="transcript" id="transcript" placeholder="Type what you would say.">${esc(state[type].transcript)}</textarea></label>${metrics(type)}`}
    function metrics(type){const d=state[type],words=count(d.transcript),wpm=d.duration?Math.round(words/d.duration*60):0;return `<div class="metrics"><span class="metric">${words} words</span>${d.duration?`<span class="metric">${d.duration}s measured</span><span class="metric">${wpm} WPM</span>`:''}</div>`}
    function bindDelivery(type){const ta=document.getElementById('transcript');if(ta)ta.oninput=()=>{state[type].transcript=ta.value;save();const next=document.getElementById('next');if(next)next.disabled=count(ta.value)<(type==='act'?15:25)};const b=document.getElementById('record');if(b)b.onclick=()=>state[type].recording?stopRecording(type):startRecording(type)}
    async function startRecording(type){const d=state[type],limit=type==='speak'?60:45,SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){d.mode='type';d.recording=false;save();delivery(type);const n=document.querySelector('.notice');if(n)n.innerHTML='<strong>Live transcription is not supported in this browser.</strong> Type what you would say and finish normally.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});d.transcript='';d.duration=0;d.recording=true;startAt=Date.now();mediaRecorder=new MediaRecorder(stream);mediaRecorder.start();recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';let final='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}d.transcript=(final+interim).trim();const ta=document.getElementById('transcript');if(ta)ta.value=d.transcript;save()};recognition.start();timer=setInterval(()=>{d.duration=Math.min(limit,Math.round((Date.now()-startAt)/1000));const c=document.getElementById('clock');if(c)c.textContent=format(limit-d.duration);if(d.duration>=limit)stopRecording(type)},250);delivery(type)}catch(e){stopMedia();d.mode='type';d.recording=false;save();delivery(type);const n=document.querySelector('.notice');if(n)n.innerHTML='<strong>Recording is unavailable.</strong> You can type your response and finish normally.'}}
    function stopRecording(type,rerender=true){const d=state[type];d.recording=false;if(startAt)d.duration=Math.max(1,Math.round((Date.now()-startAt)/1000));stopMedia();save();if(rerender)delivery(type)}
    function stopMedia(){clearInterval(timer);timer=null;try{recognition?.stop()}catch(_){}recognition=null;try{if(mediaRecorder?.state==='recording')mediaRecorder.stop()}catch(_){}mediaRecorder=null;stream?.getTracks().forEach(t=>t.stop());stream=null}
    function deterministic(){const o=form.organize,unique=new Set();let label=0;state.organize.labels.forEach(x=>{if(o.correctLabels.includes(x)&&!unique.has(x)){label+=2;unique.add(x)}});let place=0;o.items.forEach((x,i)=>{const bucket=state.organize.placements[i],chosenLabel=state.organize.labels[bucket],correctLabel=o.correctLabels[x[1]];if(chosenLabel===correctLabel)place+=14/o.items.length});const organize=Math.min(20,Math.round((label+place)*10)/10);const spot=Math.max(0,Math.min(20,spotAssessmentQuestions().reduce((points,q)=>points+(state.spot.answers[q.id]===q.answer?20/15:0),0)));const speech=scoreText(state.speak,form.speak,false);const act=scoreText(state.act,form.act,true);return{think:Math.round((organize+spot)*10)/10,organize,spot,speak:speech.total,act:act.total,speakDetail:speech,actDetail:act,total:Math.round((organize+spot+speech.total+act.total)*10)/10}}
    function normalizeContractions(t){return t.replace(/\bi'd\b/g,'i would').replace(/\bi'll\b/g,'i will').replace(/\bwe'd\b/g,'we would').replace(/\bwe'll\b/g,'we will')}
    function scoreText(d,data,isAct){const t=d.transcript.toLowerCase(),words=count(t),norm=normalizeContractions(t);if(!isAct){const hasRecommendation=/\b(i recommend|i would choose|i would go with|we should choose|the best option is|my recommendation is|let's)\b/.test(norm);let coverage=data.keywords.reduce((n,g)=>n+(contains(t,g)?4:0),0);let structure=(hasRecommendation?4:0)+((t.match(/\b(because|first|second|also|another)\b/g)||[]).length>=2?3:0)+(contains(t,data.next)?3:0);let concise=(words>=35&&words<=150?5:words>=25&&words<=180?3:1)+((t.match(/[.!?]/g)||[]).length>=2?3:1);let total=Math.min(30,coverage+structure+concise);if(!hasRecommendation)total=Math.min(10,total);return{total,coverage,structure,concise,hasRecommendation}}const hasDecision=/\b(i would|we should|my decision is|i will|we will|let's)\b/.test(norm);let choice=d.choice===data.best?6:4;let decision=hasDecision?5:0;let reason=(/\b(because|so that|while|but|instead)\b/.test(t)?4:0)+(contains(t,data.terms)?3:0);let awareness=contains(t,data.concerns)&&/\b(understand|hear|agree|concern|although|while)\b/.test(t)?6:0;let next=contains(t,data.next)?4:0;let concise=words>=18&&words<=110?2:1;let total=Math.min(30,choice+decision+reason+awareness+next+concise);if(!hasDecision)total=Math.min(8,total);return{total,choice,decision,reason,awareness,next,concise,hasDecision}}
    async function scoreAll(){app.innerHTML='<section class="panel"><div class="loading"><span class="spinner"></span><div><h1 style="margin-bottom:4px">Preparing your TSA profile</h1><p>Your score is already available from the fixed assessment rules. AI may add comments, but it cannot change the official score or delay completion.</p></div></div></section>';const base=deterministic();let ai=null,controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const res=await fetch('https://us-central1-the-untaught-lessons.cloudfunctions.net/scoreTsaDiagnostic',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({formId:state.form,kind,speak:state.speak,act:state.act,scenario:{speakFacts:form.speak.facts.map(x=>x[0]+': '+x[1]),actSetup:form.act.setup,actChoice:form.act.choices[state.act.choice],actPushback:form.act.pushback},deterministic:base})});if(res.ok)ai=await res.json()}catch(_){}finally{clearTimeout(timeout)}if(validAi(ai))base.ai=ai;else base.aiFallback=true;state.score=base;state.stage='results';state.syncStatus='pending';save();localStorage.setItem(RESULT_KEY,JSON.stringify({assessment:kind,formId:state.form,mode:{speak:state.speak.mode,act:state.act.mode},responses:{organize:state.organize,spot:state.spot,speak:state.speak,act:state.act},scores:base,rubricVersion:state.rubricVersion,completedAt:new Date().toISOString()}));render();complete(base)}
    function completionPayload(score){let pair={};try{pair=JSON.parse(localStorage.getItem('utl_tsa_form_pair')||'{}')}catch(_){}return{completed:true,attemptId:state.attemptId,assessmentKind:kind,assignedForms:pair,formId:state.form,rubricVersion:state.rubricVersion,score:score.total,scores:score,responseMode:{speak:state.speak.mode,act:state.act.mode},duration:{speak:state.speak.duration,act:state.act.duration},responses:{organize:state.organize,spot:state.spot,speak:state.speak,act:state.act},completedAt:new Date().toISOString()}}
    function showSync(){const e=document.getElementById('syncStatus');if(!e)return;const copy={pending:'Saving your diagnostic response…',saved:'Diagnostic response saved.',failed:'Your result is safe on this device. We will retry saving when you are online.'};e.dataset.state=state.syncStatus;e.textContent=copy[state.syncStatus]||copy.pending}
    async function complete(score){if(!score||state.syncStatus==='saved')return;state.syncStatus='pending';save();showSync();try{const fb=await import('../../assets/firebase.js');await fb.saveUserProgress('tsa-'+kind+'-v2',kind==='checkpoint'?'TSA checkpoint':'TSA diagnostic',completionPayload(score));state.syncStatus='saved'}catch(_){state.syncStatus='failed'}save();showSync();if(!state.rewardAttempted){state.rewardAttempted=true;save();try{await window.UTLRewardEvents?.awardAssessment({assessmentId:kind,title:(kind==='checkpoint'?'Checkpoint':'Diagnostic')+' complete'})}catch(_){}}}
    function results(){const s=state.score||deterministic();const weakest=[['Think',s.think/40],['Speak',s.speak/30],['Act',s.act/30]].sort((a,b)=>a[1]-b[1])[0][0];const strength=[['Think',s.think/40],['Speak',s.speak/30],['Act',s.act/30]].sort((a,b)=>b[1]-a[1])[0][0];const moves={Think:'Practice grouping information before writing or speaking.',Speak:s.ai?.speakNext||'State the recommendation first, then support it with two or three connected reasons.',Act:s.ai?.actNext||'Name your decision, acknowledge the concern, and give a practical next step.'};const observations={Think:`You earned ${Math.round(s.organize)} of 20 for organizing and ${Math.round(s.spot)} of 20 for spotting structural problems.`,Speak:s.ai?`${esc(s.ai.speakStrength)} Evidence: “${esc(s.ai.speakEvidence)}”`:`Your response covered ${Math.round(s.speakDetail.coverage)} of 12 available evidence points and ${Math.round(s.speakDetail.structure)} of 10 structure points.`,Act:s.ai?`${esc(s.ai.actStrength)} Evidence: “${esc(s.ai.actEvidence)}”`:`Your decision, reasoning, response to the concern, and next step produced ${Math.round(s.act)} of 30 points.`};app.innerHTML=`<section class="panel"><div class="score-hero"><p class="eyebrow">Your TSA profile · Form ${state.form}</p><h1>Your provisional TSA snapshot</h1><div class="score-number">${Math.round(s.total)}<span>/100</span></div><p>This is your ${kind==='checkpoint'?'checkpoint':'starting point'}. It is a snapshot of this attempt, not a fixed label. Results are directional while we continue calibrating scoring against real learner responses.</p></div><div class="score-grid"><div class="score-card">Think<strong>${Math.round(s.think)} / 40</strong></div><div class="score-card">Speak<strong>${Math.round(s.speak)} / 30</strong></div><div class="score-card">Act<strong>${Math.round(s.act)} / 30</strong></div></div><div class="feedback-grid"><div class="feedback"><strong>Your strongest area: ${strength}</strong><p>${observations[strength]}</p></div><div class="feedback"><strong>Your next move: ${weakest}</strong><p>${esc(moves[weakest])}</p></div></div><p class="ai-label">${s.aiFallback?'AI comments were unavailable. Your official score still used the same fixed rules.':'AI added comments for Speak and Act. The official score came from fixed rules.'}${state.speak.mode==='type'||state.act.mode==='type'?' One or more responses were text-only, so no vocal qualities were scored.':''}</p><div class="sync-status" id="syncStatus" data-state="${esc(state.syncStatus||'pending')}"></div><div class="actions"><a class="button secondary" href="../../member-login/index.html#learning-journey">Return to Learning Journey</a></div></section>`;showSync()}
    addEventListener('online',()=>{if(state.stage==='results'&&state.syncStatus!=='saved')complete(state.score)});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.stage==='results'&&state.syncStatus!=='saved')complete(state.score)});
    if(qs.get('preview')==='1')window.UTLTsaDiagnosticTest={state,form,deterministic,scoreText};
    render();if(state.stage==='results'&&state.syncStatus!=='saved')complete(state.score);
  })();
  </script>
