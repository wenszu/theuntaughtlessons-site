  <main>

  <div class="confetti hidden" id="confetti" aria-hidden="true"></div>
  <script src="../../assets/exercise-feedback-coach.js?v=20260903-feedback-rollout"></script>
  <script>
    (function(){
      'use strict';
      const STORAGE_KEY='utl_sayno_v2_session';
      const SCENARIO={id:'ma-olympic',label:'MA / Olympic project',setup:'Requests are coming from all directions. Aiko will not tell you what to prioritize. You decide.',tasks:[
        {id:1,text:"Finalize the Olympic committee deck for tomorrow's 9am presentation",urgent:true,important:true,quadrant:'do',why:"Hard deadline tomorrow morning, and it is the flagship deliverable."},
        {id:2,text:'Prepare the strategic narrative for a stakeholder meeting next week',urgent:false,important:true,quadrant:'schedule',why:'High stakes, but next week. Block time for it; do not do it now.'},
        {id:3,text:"Send follow-up notes from today's partner meeting while details are fresh",urgent:true,important:true,quadrant:'do',why:'Value decays by the hour; fresh details are the point.'},
        {id:4,text:"Review feedback from last week's internal review session",urgent:false,important:false,quadrant:'delete',why:'A week old and nothing depends on it. Let it go, or batch it much later.'},
        {id:5,text:'Respond to a journalist asking for a comment on the Olympic project',urgent:false,important:false,quadrant:'delete',why:'Press comments are not yours to give. Route it; do not work it.'},
        {id:6,text:"Help ops set up the meeting room for Aiko's client visit this afternoon",urgent:true,important:false,quadrant:'delegate',why:'Time-bound but not your job. Ops owns this.'},
        {id:7,text:'Draft the Q3 project roadmap Aiko asked for by end of month',urgent:false,important:true,quadrant:'schedule',why:'Directly requested and strategic, but weeks away. Schedule it.'},
        {id:8,text:'Meet a potential new partner who is in town only today',urgent:true,important:true,quadrant:'do',ambiguous:true,why:'A closing window, but is it more important than the deck? Reasonable people differ.'},
        {id:9,text:'Accompany a sick colleague to the clinic',urgent:true,important:true,quadrant:'do',ambiguous:true,why:'Human first. Most would drop things, but some would find help instead. A judgment call.'},
        {id:10,text:"Update the team's shared project tracker that has not been touched in two weeks",urgent:false,important:false,quadrant:'delegate',why:'Two weeks stale already proves it can wait, and someone else can own it.'}
      ]};
      const QUADRANTS=[{key:'do',name:'Do',sub:'Urgent + Important'},{key:'schedule',name:'Schedule',sub:'Not urgent + Important'},{key:'delegate',name:'Delegate',sub:'Urgent + Not important'},{key:'delete',name:'Delete',sub:'Not urgent + Not important'}];
      const QNAME={do:'Do',schedule:'Schedule',delegate:'Delegate',delete:'Delete'};
      const REASONS={8:['The partner’s window tonight is fixed. The deck deadline can move by an hour.','The deck takes priority tonight. Send a colleague to meet the partner.','Meet them briefly now, then focus fully on the deck.'],9:['People come before deliverables. Go.','Find someone closer to accompany them; stay on the deadline','Go now, and hand the deck follow-ups to Aiko tonight']};
      const ROUNDS=[{name:'Urgent or not?',skill:'Decide whether something breaks, expires, or loses value soon if the request waits.'},{name:'Important or not?',skill:'Decide whether skipping the request would materially affect the goal.'},{name:'Build the matrix',skill:'Combine your urgency and importance decisions to place each request.'},{name:'Explain two judgment calls',skill:'Two requests could reasonably fit in more than one place. Choose where you would put each one, then explain your choice in one sentence. You earn points for a clear reason, not for matching the sample.'},{name:'Write the no',skill:'Write the message you would actually send.'}];
      const BANNER_DELAY=4200;
      const SAMPLE_NO="I cannot take the tracker update this week; the committee deck owns my next 48 hours. Ops has the access, and I will flag it to them today.";
      const BASE=SCENARIO.tasks,R3=BASE.filter(t=>!t.ambiguous),AMBIGUOUS=BASE.filter(t=>t.ambiguous);
      const initial={phase:'intro',round:1,queue:[],qIdx:0,inRetry:false,retryIds:[],mp:0,streak:0,completionAwarded:false,completionSaved:false,firstTry:{},answers:{},r3Placed:{},r4:{},r4Stage:'place',noText:'',noSubmitted:false,noTaskId:null,lastAccuracy:null,focusQuad:-1,pendingBanner:null};
      let state=loadState(),banner=state.pendingBanner||null,pickedReason=null,freeReason='',summaryAnimated=false,bannerTimer=null;
      const app=document.getElementById('app'),feedback=document.getElementById('feedback'),scoreValue=document.getElementById('scoreValue'),timerDisplay=document.getElementById('timerDisplay'),timerPauseBtn=document.getElementById('timerPauseBtn'),timerResetBtn=document.getElementById('timerResetBtn');
      let elapsedSeconds=0,timerRunning=state.phase!=='intro',timerInterval=null;
      function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return saved&&saved.phase?Object.assign({},initial,saved):Object.assign({},initial)}catch(_){return Object.assign({},initial)}}
      function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(_){}}
      function setState(patch){state=Object.assign({},state,typeof patch==='function'?patch(state):patch);saveState();render()}
      function escapeHtml(value){return String(value==null?'':value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
      function words(text){return text.trim()?text.trim().split(/\s+/):[]}
      function renderTimer(){const minutes=String(Math.floor(elapsedSeconds/60)).padStart(2,'0'),seconds=String(elapsedSeconds%60).padStart(2,'0');timerDisplay.textContent=minutes+':'+seconds;timerPauseBtn.textContent=timerRunning?'Ⅱ':'▶';timerPauseBtn.setAttribute('aria-label',timerRunning?'Pause timer':'Resume timer')}
      function startTimer(){if(timerRunning&&timerInterval)return;timerRunning=true;if(!timerInterval)timerInterval=setInterval(()=>{if(timerRunning){elapsedSeconds++;renderTimer()}},1000);renderTimer()}
      function taskById(id){return BASE.find(t=>t.id===Number(id))}
      function queueFor(round){if(round===1||round===2)return BASE.map(t=>t.id);if(round===3)return R3.map(t=>t.id);if(round===4)return AMBIGUOUS.map(t=>t.id);return[]}
      function accuracy(round){const ids=queueFor(round);if(!ids.length)return 0;return Math.round(ids.filter(id=>state.firstTry['r'+round+'-'+id]).length/ids.length*100)}
      function noChecks(text){const sentences=text.split(/(?<=[.!?])\s+/).filter(Boolean),first=(sentences[0]||'').toLowerCase(),whole=text.toLowerCase();return{clearNo:/(^|\W)(no|can't|cannot|can not|won't|will not|unable|not able|not going to|have to pass|pass on|decline|declining)(\W|$)/.test(first)&&!/(maybe|might|perhaps)/.test(first),reason:/(because|so that|since|owns|deadline|priority|priorities|committed|my next|focus)/.test(whole),alternative:/(instead|after|\bcan\b|\bwill\b|i'll|flag|ops|aiko|tomorrow|today|next week|monday|tuesday|wednesday|thursday|friday|later)/.test(whole)}}
      function addMp(amount){if(amount<=0)return;state.mp+=amount;saveState();scoreValue.textContent=state.mp;scoreValue.classList.remove('score-pop');void scoreValue.offsetWidth;scoreValue.classList.add('score-pop');const toast=document.createElement('div');toast.className='toast';toast.textContent='+'+amount+' exercise point'+(amount===1?'':'s');document.getElementById('toasts').appendChild(toast);setTimeout(()=>toast.remove(),1200)}
      function clearBannerTimer(){if(bannerTimer){clearTimeout(bannerTimer);bannerTimer=null}}
      function armBannerTimer(data){clearBannerTimer();bannerTimer=setTimeout(()=>{if(banner===data)advance()},BANNER_DELAY)}
      function showBanner(data){banner=data;state.pendingBanner=data;saveState();renderBanner();armBannerTimer(data)}
      function renderBanner(){const siteFeedback=document.getElementById('utl-feedback-btn');if(!banner){document.body.classList.remove('has-feedback');if(siteFeedback)siteFeedback.hidden=false;feedback.className='feedback';feedback.innerHTML='';return}document.body.classList.add('has-feedback');if(siteFeedback)siteFeedback.hidden=true;feedback.className='feedback '+banner.type+' open';feedback.innerHTML='<div class="feedback-inner"><div><span class="feedback-guide">Saved. Moving on shortly. Choose again or continue now if you prefer.</span><div class="feedback-head"><span class="feedback-title" id="feedbackTitle">'+escapeHtml(banner.title)+'</span>'+(banner.mp?'<span class="chip">+'+banner.mp+' point'+(banner.mp===1?'':'s')+'</span>':'')+(banner.combo?'<span class="chip combo">'+escapeHtml(banner.combo)+'</span>':'')+'</div><p>'+escapeHtml(banner.why)+'</p><div class="feedback-timer"><i></i></div></div><div class="feedback-actions"><button class="button" type="button" data-continue>Continue now</button></div></div>';requestAnimationFrame(()=>feedback.querySelector('[data-continue]')?.focus({preventScroll:true}))}
      function startRound(round){pickedReason=null;freeReason='';setState({phase:'play',round,queue:queueFor(round),qIdx:0,inRetry:false,retryIds:[],r4Stage:'place',streak:0,focusQuad:-1})}
      function interstitial(round,lastAccuracy){if(round===1)startTimer();setState({phase:'interstitial',round,lastAccuracy:lastAccuracy==null?null:lastAccuracy})}
      function startRetries(){setState(s=>({phase:'play',queue:s.retryIds.slice(),qIdx:0,inRetry:true,retryIds:[],streak:0}))}
      function pickNoTask(){const pools=[Object.entries(state.r3Placed).filter(([,q])=>q==='delete'),Object.entries(state.r3Placed).filter(([,q])=>q==='delegate'),Object.entries(state.r4).filter(([,v])=>v.placed==='delete'||v.placed==='delegate')];for(const pool of pools)if(pool.length)return Number(pool[0][0]);return 10}
      function advance(){clearBannerTimer();banner=null;state.pendingBanner=null;saveState();renderBanner();const atEnd=state.qIdx+1>=state.queue.length;if(!atEnd){setState({qIdx:state.qIdx+1,r4Stage:'place',focusQuad:-1});return}if((state.round===1||state.round===2)&&!state.inRetry&&state.retryIds.length){setState({phase:'retryIntro'});return}if(state.round<=3){interstitial(state.round+1,accuracy(state.round));return}if(state.round===4){setState({phase:'interstitial',round:5,lastAccuracy:null,noTaskId:pickNoTask()})}}
      function answerBinary(choice){const task=taskById(state.queue[state.qIdx]),truth=state.round===1?task.urgent:task.important,correct=choice===truth,axis=state.round===1?(task.urgent?'Urgent':'Not urgent'):(task.important?'Important':'Not important'),key='r'+state.round+'-'+task.id,revising=key in state.firstTry;state.answers[key]=choice;if(revising){saveState();showBanner({type:correct?'good':'warn',title:correct?'Matches the sample':'Different from the sample',why:'The sample calls this '+axis+'. '+task.why,mp:0,combo:''});render();return}let gained=0,combo='';if(correct){const nextStreak=state.streak+1;gained=1+(nextStreak>=3?2:0);combo=nextStreak>=3?'🔥 '+nextStreak+' in a row +2 points':'';if(!state.inRetry&&!(key in state.firstTry))state.firstTry[key]=true;state.streak=nextStreak;addMp(gained)}else{if(!state.inRetry&&!(key in state.firstTry))state.firstTry[key]=false;if(!state.inRetry&&!state.retryIds.includes(task.id))state.retryIds.push(task.id);state.streak=0;saveState()}showBanner({type:correct?'good':'warn',title:correct?'Matches the sample':'Different from the sample',why:'The sample calls this '+axis+'. '+task.why,mp:gained,combo});render()}
      function answerQuadrant(quad){const task=taskById(state.queue[state.qIdx]);if(state.round===3){const match=quad===task.quadrant,key='r3-'+task.id,revising=key in state.firstTry;state.r3Placed[task.id]=quad;if(revising){saveState();showBanner({type:'info',title:'Selection updated to '+QNAME[quad],why:'The sample puts this in '+QNAME[task.quadrant]+'. '+task.why,mp:0});render();return}state.firstTry[key]=match;if(match)addMp(2);else saveState();state.focusQuad=-1;showBanner({type:'info',title:match?'Matches the sample: '+QNAME[quad]:'You chose '+QNAME[quad],why:'The sample puts this in '+QNAME[task.quadrant]+'. '+task.why,mp:match?2:0});render();return}state.r4[task.id]={placed:quad,reason:''};pickedReason=null;freeReason='';setState({r4Stage:'why',focusQuad:-1})}
      function submitReason(){const task=taskById(state.queue[state.qIdx]),reason=pickedReason!==null?REASONS[task.id][pickedReason]:freeReason.trim();if(!reason)return;state.r4[task.id]={placed:state.r4[task.id].placed,reason};addMp(3);showBanner({type:'info',title:'A defensible call',why:'The sample leans '+QNAME[task.quadrant]+'. '+task.why+' Your '+QNAME[state.r4[task.id].placed]+' choice also holds with that reasoning.',mp:3});render()}
      function submitNo(){if(noScore()<2)return;state.noSubmitted=true;state.phase='r5done';addMp(10);saveState();showConfetti();render()}
      function noScore(){const c=noChecks(state.noText);return[c.clearNo,c.reason,c.alternative].filter(Boolean).length}
      function showConfetti(){const layer=document.getElementById('confetti');layer.innerHTML='';for(let i=0;i<44;i++){const piece=document.createElement('span');piece.style.left=((i*137)%100)+'%';piece.style.background=['#EEA320','#003366','#4D7094','#F3EDE2'][i%4];piece.style.animationDelay=((i%10)*.07)+'s';layer.appendChild(piece)}layer.classList.remove('hidden');setTimeout(()=>layer.classList.add('hidden'),1800)}
      function placementsPayload(){const result={};BASE.forEach(task=>{result[task.text]=(task.ambiguous?(state.r4[task.id]||{}).placed:state.r3Placed[task.id])||task.quadrant});return result}
      function completionPayload(){return{scenarioId:SCENARIO.id,scenarioLabel:SCENARIO.label,placements:placementsPayload(),page:window.location.href,mp_total:state.mp,exercise_points:state.mp,reward_type:'completion-exercise',round_accuracies:{urgency:accuracy(1),importance:accuracy(2),quadrant:accuracy(3)},written_no:state.noText,version:1,experienceVersion:'v1-guided'}}
      function saveCompletion(){if(state.completionSaved)return;state.completionSaved=true;saveState();const payload=completionPayload();try{localStorage.setItem('utl_p3_ex1_done','true');localStorage.setItem('utl_result_eisenhower-matrix',JSON.stringify(payload))}catch(_){}try{window.UTLRewardEvents?.awardCompletionExercise({appId: 'eisenhower-matrix',title:'The art of saying no complete',body:'Your prioritization decisions and written no were saved.'})}catch(error){console.warn('Reward save failed.',error)}import('../../assets/firebase.js').then(({saveUserProgress})=>saveUserProgress('eisenhower-matrix','The art of saying no',payload)).catch(error=>console.warn('Firestore progress save failed.',error))}
      function showSummary(){if(!state.completionAwarded){state.completionAwarded=true;addMp(5)}state.phase='summary';saveState();saveCompletion();summaryAnimated=false;render()}
      function restart(){try{localStorage.removeItem(STORAGE_KEY)}catch(_){}clearBannerTimer();state=Object.assign({},initial);banner=null;pickedReason=null;freeReason='';summaryAnimated=false;renderBanner();render()}
      function progress(){let label='Phase 3 practice',copy='Meet Aiko’s request list before the first decision.',count='',pct=0;if(state.phase==='interstitial'){label='Round '+state.round+' of 5 · '+ROUNDS[state.round-1].name;copy=ROUNDS[state.round-1].skill}else if(state.phase==='retryIntro'){label='Round '+state.round+' of 5 · '+ROUNDS[state.round-1].name;copy='Review the answers that did not match the sample.'}else if(state.phase==='play'){const length=state.queue.length||1;label='Round '+state.round+' of 5 · '+ROUNDS[state.round-1].name;copy=state.inRetry?'Choose again after reviewing the sample explanation.':ROUNDS[state.round-1].skill;count=state.round===5?'Final round':(state.inRetry?'Review question '+(state.qIdx+1)+' of '+length:'Question '+(state.qIdx+1)+' of '+length);pct=state.round===5?0:Math.round((state.qIdx+1)/length*100)}else if(state.phase==='r5done'||state.phase==='summary'){label='Exercise complete';copy='Your decisions and written no are ready for your workspace.';count='Done';pct=100}document.getElementById('contextStrip').innerHTML='<div><div class="label">'+escapeHtml(label)+'</div><div class="context-copy">'+escapeHtml(copy)+'</div></div>'+(state.phase==='intro'?'':'<div class="context-progress">'+escapeHtml(count)+'<div class="context-track"><div class="context-fill" style="width:'+pct+'%"></div></div></div>');scoreValue.textContent=state.mp}
      function card(content,classes){return'<section class="card fade '+(classes||'')+'">'+content+'</section>'}
      function goal(){return'<aside class="rail-card goal" aria-label="Exercise brief"><div class="label">Exercise brief</div><h3>Protect what actually matters.</h3><p>Everything on Aiko’s list can be justified, and that is the trap. You are not picking what you like, you are deciding what gets dropped, and then saying so out loud.</p></aside>'}
      function axes(){return'<aside class="rail-card"><h3>Keep these apart</h3><dl class="defs"><div><dt>Urgent = the clock</dt><dd>Something breaks, expires, or loses value soon.</dd></div><div><dt>Important = the consequence</dt><dd>It moves the goal, or its failure costs you.</dd></div></dl><p class="rail-hint">A loud request is not automatically either one.</p></aside>'}
      function tallyRows(items,total){return items.map(x=>'<div class="tally-row"><b>'+x[0]+'</b><div class="tally-track"><div class="tally-fill" style="width:'+Math.min(100,x[1]/total*100)+'%"></div></div><span>'+x[1]+'</span></div>').join('')}
      function rail(){if(state.phase==='intro')return'<div class="rail"><aside class="rail-card"><h3>The two questions</h3><div class="mini"><i></i><span class="mini-col">Urgent</span><span class="mini-col">Not urgent</span><span class="mini-side">Important</span><div class="mini-cell"><b>Do</b><span>now, yourself</span></div><div class="mini-cell"><b>Schedule</b><span>book the time</span></div><span class="mini-side">Not important</span><div class="mini-cell"><b>Delegate</b><span>someone else</span></div><div class="mini-cell"><b>Delete</b><span>say no</span></div></div><p class="rail-hint">Two independent reads. Answer them separately and the grid fills itself.</p></aside><aside class="rail-card"><h3>You will leave with</h3><ul class="takeaways"><li><i>✦</i>A defensible ranking of all ten requests.</li><li><i>✦</i>Two judgment calls you can argue either way, and did.</li><li><i>✦</i>One written no you could actually send today.</li></ul></aside></div>';let extra='';if(state.round===1||state.round===2){const yes=BASE.filter(t=>state.answers['r'+state.round+'-'+t.id]===true).length,no=BASE.filter(t=>state.answers['r'+state.round+'-'+t.id]===false).length,noun=state.round===1?'urgent':'important';extra='<aside class="rail-card"><h3>'+(state.round===1?'Read the clock only.':'Read the consequence only.')+'</h3><p>'+(state.round===1?'Ignore how big it feels. Ask one thing: does something break soon if this waits?':'Ignore the deadline. Ask one thing: if this never happened, what would it cost?')+'</p>'+(yes+no?'<p class="rail-hint">So far: <b>'+yes+'</b> '+noun+' · <b>'+no+'</b> not '+noun+'</p>':'')+(yes>=6?'<p class="rail-hint warn">If almost everything qualifies, the word stops meaning anything.</p>':'')+'</aside>'+axes()}else if(state.round===3){const q={do:0,schedule:0,delegate:0,delete:0};Object.values(state.r3Placed).forEach(x=>q[x]++);extra='<aside class="rail-card"><h3>Where your list is landing</h3>'+tallyRows([['Do',q.do],['Schedule',q.schedule],['Delegate',q.delegate],['Delete',q.delete]],8)+'<p class="rail-hint '+(q.do>=4?'warn':'')+'">'+(q.do>=4?'Do is filling up. A plan where everything is Do is not a plan.':'A real week has few Dos, several Schedules, and things you refuse to carry.')+'</p></aside>'+axes()}else if(state.round===4)extra='<aside class="rail-card"><h3>Judgment, not answers.</h3><p>These two split a room of experienced people. What separates the strong call from the weak one is not the square you pick. It is whether you can say why in one sentence.</p><p class="rail-hint">Points are for reasoning, not for matching.</p></aside>';else if(state.round===5||state.phase==='r5done')extra='<aside class="rail-card"><h3>The shape of a good no</h3><dl class="defs"><div><dt>1 · The no</dt><dd>First sentence. No throat-clearing, no “maybe”.</dd></div><div><dt>2 · The reason</dt><dd>Name the priority it loses to, not your feelings.</dd></div><div><dt>3 · The alternative</dt><dd>A person, a date, or a smaller version.</dd></div></dl><p class="rail-hint">A no without a door is a rejection. A no with one is a decision.</p></aside>';if(state.phase==='summary')extra='<aside class="rail-card"><h3>Carry this into your week</h3><p>Run the two questions on your own list before your next planning block: what breaks soon, and what actually moves the goal.</p><p class="rail-hint">Then find the one request you have been quietly carrying, and send the no.</p></aside>';return'<div class="rail">'+goal()+extra+'</div>'}
      function record(){if(state.round===1||state.round===2){const rows=BASE.filter(t=>state.answers['r'+state.round+'-'+t.id]!==undefined);return card('<div class="label">Your choices this round</div><p class="record-note">This is a history of your choices. It does not mark them right or wrong.</p>'+(rows.length?'<ul>'+rows.map(t=>{const yes=state.answers['r'+state.round+'-'+t.id];return'<li><span class="record-text">'+escapeHtml(t.text)+'</span><span class="pill">'+(state.round===1?(yes?'Urgent':'Not urgent'):(yes?'Important':'Not important'))+'</span></li>'}).join('')+'</ul>':'<p class="empty">Your choices will appear here as you work through the round.</p>'),'record')}if(state.round===3){const rows=BASE.filter(t=>state.r3Placed[t.id]);return card('<div class="label">Your placements this round</div><p class="record-note">This is a history of where you placed each request. It does not mark them right or wrong.</p>'+(rows.length?'<ul>'+rows.map(t=>'<li><span class="record-text">'+escapeHtml(t.text)+'</span><span class="pill">'+QNAME[state.r3Placed[t.id]]+'</span></li>').join('')+'</ul>':'<p class="empty">Your placements will appear here as you build the matrix.</p>'),'record')}return''}
      function renderOverlay(){const round=state.round;return'<div class="overlay"><div class="overlay-panel"><div class="round-dots">'+ROUNDS.map((_,i)=>'<span class="round-dot '+(i<round?'on':'')+'"></span>').join('')+'</div><div class="label">Round '+round+' of 5</div><h2>'+escapeHtml(ROUNDS[round-1].name)+'</h2><p>'+escapeHtml(ROUNDS[round-1].skill)+'</p><button class="button" type="button" data-start-round="'+round+'">'+(round===5?'Write the no':'Start round')+'</button></div></div>'}
      function render(){progress();let html='';const task=state.phase==='play'?taskById(state.queue[state.qIdx]):null;if(state.phase==='intro')html=card('<div class="label">Phase 3 · Act confidently · about 10 minutes</div><h1>Aiko needs you to prioritize.</h1><p>Requests are coming from every direction and Aiko will not tell you what to prioritize. She expects you to decide, and to be able to defend it in one sentence when she asks.</p><div class="pullquote">Everything feels important, but not everything is.</div><p>Ten real requests are waiting. Your job is not to work harder through them; it is to sort them by two questions that most people collapse into one, then act on the answer, including telling someone no.</p><p class="supporting" style="margin:10px 0 0">Nothing here is graded on speed, and a wrong read never costs you points.</p>','intro')+card('<div class="label">How the exercise works</div><ol class="round-list">'+ROUNDS.map((r,i)=>'<li><span class="round-num">'+(i+1)+'</span><span><b>'+escapeHtml(r.name)+'</b><span>'+escapeHtml(r.skill)+'</span></span></li>').join('')+'</ol><div class="button-row"><button class="button" type="button" data-intro-start>Start the exercise</button></div>');
        else if(state.phase==='interstitial')html=renderOverlay();
        else if(state.phase==='retryIntro')html='<div class="overlay"><div class="overlay-panel"><div class="label">Round '+state.round+'</div><h2>Review '+state.retryIds.length+' answer'+(state.retryIds.length===1?'':'s')+'</h2><p>Your first choice did not match the sample. Review each explanation and choose again. Your score will not go down.</p><button class="button" type="button" data-start-retries>Review my answers</button></div></div>';
        else if(state.phase==='play'&&(state.round===1||state.round===2)&&task){const selected=state.answers['r'+state.round+'-'+task.id];html=card('<div class="label">'+(state.inRetry?'Review question ':'Question ')+(state.qIdx+1)+' of '+state.queue.length+'</div><p class="task">'+escapeHtml(task.text)+'</p><p class="supporting" style="margin:12px 0 0">'+(state.round===1?'Does something break, expire, or lose value soon if this waits?':'Would skipping this materially affect the goal?')+'</p>')+'<div class="binary"><button class="choice '+(selected===true?'selected':'')+'" type="button" data-binary="true" aria-pressed="'+(selected===true)+'">'+(state.round===1?'Yes, urgent':'Yes, important')+'<span class="key">Press 1</span></button><button class="choice '+(selected===false?'selected':'')+'" type="button" data-binary="false" aria-pressed="'+(selected===false)+'">'+(state.round===1?'No, not urgent':'No, not important')+'<span class="key">Press 2</span></button></div>';}
        else if(state.phase==='play'&&(state.round===3||(state.round===4&&state.r4Stage==='place'))&&task){const selected=state.round===3?state.r3Placed[task.id]:(state.r4[task.id]||{}).placed;html=card('<div class="label">Question '+(state.qIdx+1)+' of '+state.queue.length+'</div><p class="task">'+escapeHtml(task.text)+'</p>'+(state.round===4?'<p class="supporting" style="margin:10px 0 0">This request could reasonably fit in more than one place. Choose where you would put it. On the next screen, you will explain your choice in one sentence.</p>':'<p class="supporting" style="margin:10px 0 0">Choose the action that follows from your urgency and importance decisions.</p>'))+'<div class="quadrants">'+QUADRANTS.map((q,i)=>'<button class="quadrant '+(state.focusQuad===i?'focused ':'')+(selected===q.key?'selected':'')+'" type="button" data-quadrant="'+q.key+'" aria-pressed="'+(selected===q.key)+'" aria-label="Choose '+q.name+': '+q.sub+'"><h3>'+q.name+'</h3><p>'+q.sub+'</p></button>').join('')+'</div><p class="keyboard-note">Click a placement, or use the arrow keys and press Enter.</p>';}
        else if(state.phase==='play'&&state.round===4&&state.r4Stage==='why'&&task){const placement=(state.r4[task.id]||{}).placed,placementOption=QUADRANTS.find(q=>q.key===placement)||QUADRANTS[0];html=card('<div class="label">Round 4 · Explain your choice</div><p class="task" style="font-size:18px">“'+escapeHtml(task.text)+'”</p><div class="placement-summary"><span>Your placement</span><button class="placement-tile" type="button" data-change-placement aria-label="Change placement from '+escapeHtml(placementOption.name)+'" title="Choose a different placement"><strong>'+escapeHtml(placementOption.name)+'</strong><small>'+escapeHtml(placementOption.sub)+'</small><span class="placement-edit" aria-hidden="true">↺</span></button></div><p class="supporting">Choose the explanation that best matches your reasoning. You can also write your own. There is no single required placement here. The goal is to make a clear, defensible decision.</p><div class="reason-list">'+REASONS[task.id].map((reason,i)=>'<button class="reason '+(pickedReason===i?'selected':'')+'" type="button" data-reason="'+i+'">'+escapeHtml(reason)+'</button>').join('')+'<input class="reason-input" id="freeReason" value="'+escapeHtml(freeReason)+'" placeholder="Type your answer here."></div><div class="button-row"><button class="button" type="button" data-submit-reason '+(pickedReason===null&&!freeReason.trim()?'disabled':'')+'>Submit</button></div>');}
        else if(state.phase==='play'&&state.round===5){const task5=taskById(state.noTaskId)||BASE[9],checks=noChecks(state.noText),count=words(state.noText).length;html=card('<div class="label">Final challenge · Write the no</div><p class="task" style="font-size:18px">You have decided not to do: “'+escapeHtml(task5.text)+'”.</p><p class="supporting" style="margin-top:10px">Write the message you would send. Keep it to 50 words.</p><textarea class="no-text" id="noText" placeholder="Type your answer here.">'+escapeHtml(state.noText)+'</textarea><div class="word-count '+(count>=50?'max':'')+'">'+count+' / 50 words</div><ul class="checklist"><li class="'+(checks.clearNo?'met':'')+'"><span class="checkmark">'+(checks.clearNo?'✓':'')+'</span>A clear no in the first sentence, without “maybe”, “might”, or “perhaps”</li><li class="'+(checks.reason?'met':'')+'"><span class="checkmark">'+(checks.reason?'✓':'')+'</span>Gives a reason or names the priority taking precedence</li><li class="'+(checks.alternative?'met':'')+'"><span class="checkmark">'+(checks.alternative?'✓':'')+'</span>Offers an alternative or useful next step</li></ul><div class="button-row"><button class="button" type="button" data-submit-no '+(noScore()<2?'disabled':'')+'>Send the no</button></div>'+(noScore()<2?'<p class="supporting" style="margin:10px 0 0">Complete at least 2 of the 3 checks to continue.</p>':''));}
        else if(state.phase==='r5done')html=card('<div class="label">Sent · +10 exercise points</div><h2>Your no, next to the sample</h2><div class="comparison"><div><h3>Yours</h3><div class="message">'+escapeHtml(state.noText)+'</div></div><div><h3>Sample</h3><div class="message">'+escapeHtml(SAMPLE_NO)+'</div></div></div><p class="supporting" style="margin:16px 0 0">Notice the shape: no, reason, alternative. Three sentences without an apology spiral.</p><div class="button-row"><button class="button" type="button" data-show-summary>See my results</button></div>');
        else if(state.phase==='summary'){html=card('<div class="label">Scenario complete</div><div class="summary-score"><span id="summaryCount">0</span> <small>exercise points</small></div><p class="bank-note">Your choices and written no are saved.</p><p class="supporting">The +5 finish bonus is included in this exercise score. Completing either version earns the same one-time completion MP toward your level.</p>','summary-main')+card('<div class="label">Skill read</div>'+[['Urgency read',accuracy(1)],['Importance read',accuracy(2)],['Quadrant judgment',accuracy(3)]].map(item=>'<div class="skill"><div class="skill-label"><span>'+item[0]+'</span><span>'+item[1]+'%</span></div><div class="skill-track"><div class="skill-fill" data-width="'+item[1]+'"></div></div></div>').join(''))+card('<div class="label">Your saved no</div><button class="copy" type="button" data-copy>Copy</button><p>'+escapeHtml(state.noText)+'</p>','saved-no')+'<div class="button-row" style="justify-content:center"><button class="button secondary" type="button" data-restart>Restart scenario</button><a class="button" href="../../member-login/index.html#learning-journey">Back to Learning Journey</a></div>';}
        if(state.phase==='play'&&state.round<=3)html+=record();if(state.phase!=='interstitial'&&state.phase!=='retryIntro')html='<div class="layout">'+rail()+'<div class="primary">'+html+'</div></div>';app.dataset.phase=state.phase;app.innerHTML=html;bindDynamic();if(state.phase==='summary'){animateSummary();const mount=document.createElement('section');mount.className='card fade';app.querySelector('.primary .button-row')?.before(mount);window.UTLFeedbackCoach?.mountPrompt({mount,title:'The Art of Saying No',goal:'Make a clear prioritization decision and explain it in a way that is direct, credible, and useful.',criteria:['State the decision clearly in the first sentence','Give a reason connected to the priority that takes precedence','Offer a practical alternative or next step','Keep the message concise and professional'],response:()=>state.noText,sample:SAMPLE_NO,signals:[`Urgency read: ${accuracy(1)}%`,`Importance read: ${accuracy(2)}%`,`Quadrant judgment: ${accuracy(3)}%`]});}if(state.phase==='play'&&!banner)requestAnimationFrame(()=>requestAnimationFrame(positionCurrentPrompt))}
      function syncStickyOffsets(){const header=document.querySelector('.app-header');document.documentElement.style.setProperty('--utl-app-header-height',(header?header.offsetHeight:76)+'px')}
      function positionCurrentPrompt(){syncStickyOffsets();const prompt=app.querySelector('.primary .card'),action=app.querySelector('.choice,.quadrant,.reason,.no-text');if(prompt){const strip=document.getElementById('contextStrip'),stripBottom=strip&&getComputedStyle(strip).position==='sticky'?strip.getBoundingClientRect().bottom:0,target=window.scrollY+prompt.getBoundingClientRect().top-stripBottom-16;window.scrollTo({top:Math.max(0,target),behavior:'auto'})}action?.focus({preventScroll:true})}
      function bindDynamic(){app.querySelector('[data-intro-start]')?.addEventListener('click',()=>interstitial(1,null));app.querySelector('[data-start-round]')?.addEventListener('click',e=>startRound(Number(e.currentTarget.dataset.startRound)));app.querySelector('[data-start-retries]')?.addEventListener('click',startRetries);app.querySelectorAll('[data-binary]').forEach(b=>b.addEventListener('click',()=>answerBinary(b.dataset.binary==='true')));app.querySelectorAll('[data-quadrant]').forEach(b=>b.addEventListener('click',()=>answerQuadrant(b.dataset.quadrant)));app.querySelectorAll('[data-reason]').forEach(b=>b.addEventListener('click',()=>{pickedReason=Number(b.dataset.reason);freeReason='';render()}));const reasonInput=document.getElementById('freeReason');reasonInput?.addEventListener('input',()=>{freeReason=reasonInput.value;if(freeReason)pickedReason=null;const button=app.querySelector('[data-submit-reason]');if(button)button.disabled=!freeReason.trim()});app.querySelector('[data-change-placement]')?.addEventListener('click',()=>setState({r4Stage:'place'}));app.querySelector('[data-submit-reason]')?.addEventListener('click',submitReason);const noText=document.getElementById('noText');noText?.addEventListener('input',()=>{const list=words(noText.value),value=list.length>50?list.slice(0,50).join(' '):noText.value;if(noText.value!==value)noText.value=value;state.noText=value;saveState();const checks=noChecks(value),met=[checks.clearNo,checks.reason,checks.alternative],count=words(value).length,items=app.querySelectorAll('.checklist li');app.querySelector('.word-count').textContent=count+' / 50 words';app.querySelector('.word-count').classList.toggle('max',count>=50);items.forEach((item,i)=>{item.classList.toggle('met',met[i]);item.querySelector('.checkmark').textContent=met[i]?'✓':''});app.querySelector('[data-submit-no]').disabled=met.filter(Boolean).length<2});app.querySelector('[data-submit-no]')?.addEventListener('click',submitNo);app.querySelector('[data-show-summary]')?.addEventListener('click',showSummary);app.querySelector('[data-copy]')?.addEventListener('click',e=>{navigator.clipboard?.writeText(state.noText).then(()=>{e.currentTarget.textContent='Copied ✓';setTimeout(()=>{if(e.currentTarget)e.currentTarget.textContent='Copy'},1500)})});app.querySelector('[data-restart]')?.addEventListener('click',restart)}
      function animateSummary(){if(summaryAnimated)return;summaryAnimated=true;const count=document.getElementById('summaryCount'),start=performance.now(),target=state.mp,duration=1000;function tick(now){const t=Math.min(1,(now-start)/duration);if(count)count.textContent=Math.round(target*(1-Math.pow(1-t,3)));if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick);requestAnimationFrame(()=>document.querySelectorAll('.skill-fill').forEach(fill=>fill.style.width=fill.dataset.width+'%'))}
      feedback.addEventListener('click',e=>{if(e.target.closest('[data-continue]'))advance()});
      timerPauseBtn.addEventListener('click',()=>{timerRunning=!timerRunning;if(timerRunning)startTimer();else renderTimer()});
      timerResetBtn.addEventListener('click',()=>{elapsedSeconds=0;renderTimer()});
      window.addEventListener('resize',syncStickyOffsets);
      window.addEventListener('keydown',e=>{if(banner){if(e.key==='Enter'){e.preventDefault();advance()}return}if(state.phase!=='play')return;if(state.round===1||state.round===2){if(e.key==='1')answerBinary(true);else if(e.key==='2')answerBinary(false);return}const active=document.activeElement&&document.activeElement.tagName;if(active==='TEXTAREA'||active==='INPUT')return;const quadrantPhase=state.round===3||(state.round===4&&state.r4Stage==='place');if(!quadrantPhase)return;if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let current=state.focusQuad<0?0:state.focusQuad;if(state.focusQuad<0)current=0;else if(e.key==='ArrowRight'&&current%2===0)current++;else if(e.key==='ArrowLeft'&&current%2===1)current--;else if(e.key==='ArrowDown'&&current<2)current+=2;else if(e.key==='ArrowUp'&&current>=2)current-=2;setState({focusQuad:current})}else if(e.key==='Enter'&&state.focusQuad>=0){e.preventDefault();answerQuadrant(QUADRANTS[state.focusQuad].key)}});
      syncStickyOffsets();if(timerRunning)startTimer();else renderTimer();renderBanner();if(banner)armBannerTimer(banner);render();
    })();
